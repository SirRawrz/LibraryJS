        dialog.setAttribute('aria-hidden', 'false');
        title.textContent = 'Manage: ' + playlistSlug;
        window._currentManagingPlaylist = playlistSlug;

        const imgUrl = await checkPlaylistImageUrl(profile, playlistSlug);
        preview.src = imgUrl;

        const arr = await loadPlaylistFileFromServer(profile, playlistSlug) || [];
        window._managePlaylistArray = arr;

        const closeBtn = document.getElementById('manageCloseBtn');
        const saveBtn = document.getElementById('manageSaveBtn');
        const deleteBtn = document.getElementById('manageDeleteBtn');

        function renderManageSongs() {
          songsList.innerHTML = '';
          arr.forEach((s, idx) => {
            const div = document.createElement('div');
            div.className = 'song-item';
            div.tabIndex = -1;
            const name = document.createElement('div');
            name.className = 'name';
            name.textContent = s;
            const rem = document.createElement('button');
            rem.className = 'btn-ctrl';
            rem.textContent = 'Remove';
            rem.tabIndex = 0;
            rem.dataset.index = idx;
            rem.onclick = async function() {
              if (!confirm('Remove this song from playlist?')) return;
              const removed = arr[idx];
              const bn = (typeof basename === 'function') ? basename(removed) : (removed && removed.split('/').pop());
              arr.splice(idx, 1);
              renderManageSongs();
              try { await savePlaylistFileToServer(profile, playlistSlug, arr); } catch (err) {
                console.warn('[manage] failed saving playlist after remove', err);
                alert('Warning: removed locally but failed to save to server.');
              }
              try { if (typeof renderPlaylistTiles === 'function') await renderPlaylistTiles(); } catch (e) { console.warn('renderPlaylistTiles failed', e); }
              try {
                if (Array.isArray(playlist) && bn) {
                  let changed = false;
                  for (let i = playlist.length - 1; i >= 0; i--) {
                    const pbn = (typeof basename === 'function') ? basename(playlist[i]) : (playlist[i] && playlist[i].split('/').pop());
                    if (pbn === bn) { playlist.splice(i, 1);
                      changed = true; }
                  }
                  if (changed) {
                    if (currentTrackIndex >= playlist.length) currentTrackIndex = Math.max(0, playlist.length - 1);
                    if (playlist.length) { try { loadAndPlay(currentTrackIndex); } catch (e) { console.warn('loadAndPlay failed after manage remove', e); } } else { try { audioEl.pause(); } catch (e) {}
                      try { trackTitleEl.textContent = '— Not playing —';
                        artistMiniEl.textContent = '—'; } catch (e) {} }
                  }
                }
              } catch (e) { console.warn('failed to reconcile in-memory playlist after remove', e); }
            };
            div.appendChild(name);
            div.appendChild(rem);
            songsList.appendChild(div);
          });

          setupManageNavigation();
        }

        function setupManageNavigation() {
          const allFocusable = [
            closeBtn,
            saveBtn,
            ...Array.from(songsList.querySelectorAll('.song-item button')),
            deleteBtn,
            imgInput
          ].filter(el => el && el.tabIndex >= 0);

          setTimeout(() => { try { closeBtn.focus(); } catch (e) {} }, 50);

          allFocusable.forEach((el, idx) => {
            el.addEventListener('keydown', function(e) {
              const isDown = (e.key === 'ArrowDown' || e.key === 'ArrowRight');
              const isUp = (e.key === 'ArrowUp' || e.key === 'ArrowLeft');
              if (!isDown && !isUp) return;

              e.preventDefault();
              let newIdx = idx;
              if (isDown) {
                newIdx = (idx + 1) % allFocusable.length;
              } else if (isUp) {
                newIdx = (idx - 1 + allFocusable.length) % allFocusable.length;
              }
              if (newIdx >= 0 && newIdx < allFocusable.length) {
                allFocusable[newIdx].focus();
              }
            });
          });
        }

        closeBtn.onclick = function() {
          dialog.style.display = 'none';
          dialog.setAttribute('aria-hidden', 'true');
          window._manageSelectedImageFile = null;
        };

        saveBtn.onclick = async function() {
          const arrToSave = window._managePlaylistArray || [];
          await savePlaylistFileToServer(profile, playlistSlug, arrToSave);
          if (window._manageSelectedImageFile) {
            await uploadPlaylistImage(profile, playlistSlug, window._manageSelectedImageFile);
            window._manageSelectedImageFile = null;
          }
          alert('Playlist saved');
          if (typeof renderPlaylistTiles === 'function') renderPlaylistTiles();
          dialog.style.display = 'none';
          dialog.setAttribute('aria-hidden', 'true');
        };

        deleteBtn.onclick = async function() {
          if (!confirm('Delete this playlist entirely? This will remove the playlist file and unregister it from your master list.')) return;
          const master = await loadMasterPlaylistsFromServer(profile);
          const idx = master.indexOf(playlistSlug);
          if (idx !== -1) master.splice(idx, 1);
          await saveMasterPlaylistsToServer(profile, master);
          try {
            if (typeof isWindowsUpload === 'function' && isWindowsUpload()) {
              await fetch(`/Profiles/${encodeURIComponent(profile + '-' + playlistSlug + '.txt')}`, { method: 'DELETE' });
            } else {
              await fetch(`/api/file/delete?path=${encodeURIComponent('/Profiles/' + profile + '-' + playlistSlug + '.txt')}`, { method: 'DELETE' });
            }
          } catch (e) { console.warn(e); }
          dialog.style.display = 'none';
          dialog.setAttribute('aria-hidden', 'true');
          if (typeof renderPlaylistTiles === 'function') renderPlaylistTiles();
        };

        imgInput.onchange = function(e) {
          const f = e.target.files && e.target.files[0];
          if (!f) return;
          preview.src = URL.createObjectURL(f);
          window._manageSelectedImageFile = f;
        };

        renderManageSongs();
      }

      window.openManagePlaylist = openManagePlaylist;

      // ---- Back button interception (preserved) ----
      (function() {
        const SENTINEL_HASH = 'radio-playlist-dialog';

        function isAnyDialogOpen() {
          const pd = document.getElementById('playlistDialog');
          const md = document.getElementById('managePlaylistDialog');
          return (pd && pd.style.display === 'block') ||
                 (md && md.style.display === 'block');
        }

        function closeAllDialogs() {
          hidePlaylistDialog();
        }

        function ensureSentinel() {
          try {
            if (location.hash !== '#' + SENTINEL_HASH) {
              history.pushState(null, '', '#' + SENTINEL_HASH);
              if (location.hash !== '#' + SENTINEL_HASH) {
                location.hash = SENTINEL_HASH;
              }
            }
          } catch (e) {}
        }

        window.addEventListener('beforeunload', function(e) {
          if (isAnyDialogOpen()) {
            e.preventDefault();
            e.returnValue = '';
            return '';
          }
        });

        window.addEventListener('popstate', function(e) {
          if (isAnyDialogOpen()) {
            e.preventDefault();
            e.stopPropagation();
            closeAllDialogs();
            history.pushState(null, '', '#' + SENTINEL_HASH);
          }
        });

        window.addEventListener('hashchange', function(e) {
          if (isAnyDialogOpen()) {
            e.preventDefault();
            e.stopPropagation();
            closeAllDialogs();
            setTimeout(ensureSentinel, 10);
          }
        });

        document.addEventListener('keydown', function(e) {
          const isBack = (e.key === 'Escape' || e.key === 'Backspace' ||
                          e.keyCode === 10009 || e.keyCode === 4);
          if (isBack && isAnyDialogOpen()) {
            e.preventDefault();
            e.stopPropagation();
            closeAllDialogs();
            ensureSentinel();
          }
        }, { capture: true, passive: false });

        window.addEventListener('load', ensureSentinel);
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          ensureSentinel();
        }

        const origShow = window.showPlaylistDialog;
        if (typeof origShow === 'function') {
          window.showPlaylistDialog = function() {
            ensureSentinel();
            return origShow.apply(this, arguments);
          };
        }
        const origOpen = window.openManagePlaylist;
        if (typeof origOpen === 'function') {
          window.openManagePlaylist = function() {
            ensureSentinel();
            return origOpen.apply(this, arguments);
          };
        }
        const origExiled = window.showExiledDialog;
        if (typeof origExiled === 'function') {
          window.showExiledDialog = function() {
            ensureSentinel();
            return origExiled.apply(this, arguments);
          };
        }
        const origGenres = window.showGenresDialog;
        if (typeof origGenres === 'function') {
          window.showGenresDialog = function() {
            ensureSentinel();
            return origGenres.apply(this, arguments);
          };
        }
      })();

      // ---- INITIALIZATION (wait for loadexpanded) ----
      (async function init() {
        if (window.__loadexpandedPromise) {
          console.log('[Radio] Waiting for loadexpanded...');
          await window.__loadexpandedPromise;
        }
        console.log('[Radio] loadexpanded done. Parsing merged library...');
        parseMergedLibrary();
        console.log(`[Radio] Parsed ${MUSIC_LIBRARY_ENTRIES.length} entries, ${artistOriginMap.size} artists.`);

        // Load liked songs and exiled
        await loadLikedSongsFromServer();
        await refreshExiledCache(getActiveProfileName());

        // Restore playlist from profile radio.txt
        const profile = getActiveProfileName();
        const saved = await restorePlaylistFromProfile(profile);
        if (Array.isArray(saved) && saved.length) {
          playlist = saved;
          currentTrackIndex = 0;
          loadAndPlay(0);
        } else {
          // fallback: if no radio playlist, maybe try liked?
          const liked = getStoredLikedSongs();
          if (liked.length) {
            playlist = shuffle(liked);
            currentTrackIndex = 0;
            isPlayingLiked = true;
            loadAndPlay(0);
          }
        }

        // Set volume
        audioEl.volume = Number(volumeHidden.value || 0.9);
        renderVolumeSegments();
        renderProgressSegments();

        // Profile icon
        const img = document.getElementById("profileIcon");
        if (img) {
          img.src = `./Profiles/${profile}.jpg`;
          img.alt = profile;
          img.style.display = "block";
        }

        // Expose globals
        window.playlist = playlist;
        window.currentTrackIndex = currentTrackIndex;
        window.loadAndPlay = loadAndPlay;
        window.playNextTrack = playNextTrack;
        window.playPreviousTrack = playPreviousTrack;
        window.togglePlayback = togglePlayback;
        window.showPlaylistDialog = showPlaylistDialog;
        window.hidePlaylistDialog = hidePlaylistDialog;
        window.showExiledDialog = showExiledDialog;
        window.openManagePlaylist = openManagePlaylist;
        window.renderPlaylistTiles = function() { /* call from dialog */ };
        window.getStoredLikedSongs = getStoredLikedSongs;
        window.setStoredLikedSongs = setStoredLikedSongs;
        window.saveLikedSongsToServer = saveLikedSongsToServer;
        window.toggleLikeForFile = toggleLikeForFile;
        window.updateLikedSongsUI = updateLikedSongsUI;
        window.resolveImage = resolveImage;
        window.applyImage = applyImage;
        window.parseMergedLibrary = parseMergedLibrary;
        window.MUSIC_LIBRARY_ENTRIES = MUSIC_LIBRARY_ENTRIES;
        window.getSongsForGenre = getSongsForGenre;
        window.getSongsForArtist = getSongsForArtist;

        // Exile helpers
        window.cleanNameFromPath = cleanNameFromPath;
        window.isExiledSong = isExiledSong;
        window.refreshExiledCache = refreshExiledCache;
        window.appendExiledSong = appendExiledSong;
        window.filterOutExiled = filterOutExiled;

        console.log('[Radio] Initialization complete.');
      })();

    </script>
  </div>
</body>
</html>
