<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Radio Player</title>
<!-- ===== LOAD PLATFORM + SCREENSAVER ===== -->
<script src="./loadplatform.js"></script>
<script src="./screensaver.js"></script>
<!-- ===== loadexpanded.js (priority source merging) ===== -->
<script src="./loadexpanded.js"></script>
<!-- ===== musiclibrary.js (fallback only) ===== -->
<script src="musiclibrary.js"></script>

<style>
/* ---------- Base reset & variables ---------- */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root{
  --bg-top: #050505;
  --bg-mid: #0b0b0b;
  --bg-bottom: #080808;
  --fg: #eaeaea;
  --muted-fg: rgba(255,255,255,0.66);
  --player-radius: 12px;
  --player-padding: 10px;
  --player-max-width: 1200px;
  --default-topbar-height: 64px;
  --safe-bottom: env(safe-area-inset-bottom, 12px);
}

/* ---------- Page base ---------- */
html, body {
  height: 100%;
  font-family: Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--fg);
  background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 60%, var(--bg-bottom) 100%);
  text-align: center;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden !important;
  overflow-y: auto;
  min-height: 100vh;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(84px + var(--safe-bottom));
}

.hidden { display: none !important; }
.visually-hidden { position: absolute !important; width:1px; height:1px; overflow:hidden; clip:rect(1px,1px,1px,1px); white-space:nowrap; }

/* ---------- Top bar (desktop default) ---------- */
.top-bar {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 20px;
  gap: 12px;
  background: rgba(10,10,10,0.35);
  backdrop-filter: blur(6px);
  z-index: 1000;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}

.top-button {
  background: linear-gradient(180deg,#222,#1a1a1a);
  color: #fff; border: none;
  padding: 8px 12px; border-radius:8px; cursor:pointer;
  font-size:15px; margin:0 6px; display:inline-flex; align-items:center; justify-content:center;
  transition: transform .12s ease, box-shadow .12s ease;
  box-shadow: 0 4px 10px rgba(0,0,0,0.45);
}
.top-button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,0.5); }
.top-button svg { width:18px; height:18px; fill:white; margin-right:6px; }
#profileIcon { width:36px; height:36px; border-radius:10px; object-fit:cover; margin-left:12px; display:none; border:1px solid rgba(255,255,255,0.03); }

/* ---------- COVER / CENTER IMAGE (pulled-down desktop) ---------- */
#coverContainer {
  position: absolute;
  top: 110px;
  left: 50%;
  transform: translateX(-50%);
  width: 760px;
  height: 560px;
  overflow: visible;
  background: transparent;
  z-index: 0;
  pointer-events: none;
}
#coverContainer[tabindex] { outline:none; }

/* ---------- Carousel (desktop defaults) ---------- */
#artistCarousel {
  width: 760px;
  height: 420px;
  margin: 8px auto;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1400px;
  pointer-events: none;
}
#artistCarousel img {
  transition: transform 340ms cubic-bezier(.2,.9,.2,1), opacity 300ms ease, filter 300ms ease;
  border-radius: 12px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.45);
  object-fit: cover;
  user-select: none;
  -webkit-user-drag: none;
  position: absolute;
  pointer-events: auto;
  background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.12));
  border: 1px solid rgba(255,255,255,0.02);
}

#artistCarousel img.center {
  width: 380px;
  height: 380px;
  z-index: 8;
  opacity: 1;
  left: 50%;
  top: 50%;
  transform-origin: center center;
  transform: translate(-50%, -50%) translateZ(0px) scale(1);
  pointer-events: none;
}

#artistCarousel img.prev1, #artistCarousel img.next1 { width: 240px; height:240px; z-index:7; opacity:0.98; }
#artistCarousel img.prev2, #artistCarousel img.next2 { width: 180px; height:180px; z-index:6; opacity:0.92; }
#artistCarousel img.prev3, #artistCarousel img.next3 { width: 140px; height:140px; z-index:5; opacity:0.88; }
#artistCarousel img.prev4, #artistCarousel img.next4 { width:110px; height:110px; z-index:4; opacity:0.82; }

#artistCarousel img.prev1 { left:50%; top:50%; transform: translate(-50%,-50%) translateX(-170px) translateZ(-8px) rotateY(12deg) scale(0.96); }
#artistCarousel img.prev2 { left:50%; top:50%; transform: translate(-50%,-50%) translateX(-300px) translateZ(-26px) rotateY(14deg) scale(0.86); }
#artistCarousel img.prev3 { left:50%; top:50%; transform: translate(-50%,-50%) translateX(-410px) translateZ(-46px) rotateY(16deg) scale(0.76); }
#artistCarousel img.prev4 { left:50%; top:50%; transform: translate(-50%,-50%) translateX(-500px) translateZ(-70px) rotateY(18deg) scale(0.68); }

#artistCarousel img.next1 { left:50%; top:50%; transform: translate(-50%,-50%) translateX(170px) translateZ(-8px) rotateY(-12deg) scale(0.96); }
#artistCarousel img.next2 { left:50%; top:50%; transform: translate(-50%,-50%) translateX(300px) translateZ(-26px) rotateY(-14deg) scale(0.86); }
#artistCarousel img.next3 { left:50%; top:50%; transform: translate(-50%,-50%) translateX(410px) translateZ(-46px) rotateY(-16deg) scale(0.76); }
#artistCarousel img.next4 { left:50%; top:50%; transform: translate(-50%,-50%) translateX(500px) translateZ(-70px) rotateY(-18deg) scale(0.68); }

#artistCarousel img:hover { filter: saturate(1.06) brightness(1.04); transform: translate(-50%,-50%) scale(1.01); box-shadow: 0 12px 26px rgba(0,0,0,0.55); }

/* ---------- Responsive adjustments ---------- */
@media (max-width: 1200px) {
  #coverContainer { width: 90%; left:50%; transform:translateX(-50%); top: 100px; }
  #artistCarousel { width: 90%; height: 380px; }
}
@media (max-width: 900px) {
  #coverContainer { top: 90px; width: 92%; }
  #artistCarousel img.prev3, #artistCarousel img.next3, #artistCarousel img.prev4, #artistCarousel img.next4 { display:none; }
  #artistCarousel img.center { width: 300px; height:300px; }
}
@media (max-width: 600px) {
  #coverContainer { top: 70px; }
  #artistCarousel img.prev2, #artistCarousel img.next2 { display:none; }
  #artistCarousel img.center { width: 220px; height:220px; }
}

/* ---------- Player bar (desktop default) ---------- */
.player-bar {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 40px);
  max-width: var(--player-max-width);
  background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  border-radius: var(--player-radius);
  padding: var(--player-padding);
  display: flex;
  gap: 10px;
  align-items: center;
  z-index: 1200;
  box-shadow: 0 8px 22px rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.02);
  backdrop-filter: blur(4px);
  margin-bottom: calc(var(--safe-bottom) * 0);
}

.player-left, .player-mid, .player-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
.player-left { flex: 0 0 auto; justify-content: flex-start; }
.player-mid  { flex: 1 1 360px; align-items: center; min-width: 160px; }
.player-right{ flex: 0 0 auto; justify-content: flex-end; }

.btn-ctrl {
  background: linear-gradient(180deg, #111, #0d0d0d);
  border: none; color: #fff;
  padding: 8px 10px; border-radius: 8px; cursor: pointer; font-weight:600;
  display:inline-flex; gap:8px; align-items:center; justify-content:center; box-shadow: 0 6px 14px rgba(0,0,0,0.45);
}
.btn-ctrl:hover { transform: translateY(-2px); }

.time {
  font-size: 13px;
  color: rgba(255,255,255,0.72);
  min-width: 56px;
  text-align:center;
}

.progress-seg {
  display: flex;
  gap: 6px;
  align-items: center;
  width: 100%;
  padding: 6px 0;
  box-sizing: border-box;
  outline: none;
}
.progress-seg .seg {
  flex: 1 1 0;
  height: 8px;
  border-radius: 4px;
  background: linear-gradient(180deg,#1f1f1f,#2b2b2b);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
  cursor: pointer;
  transition: transform 120ms ease, background 160ms ease, box-shadow 160ms ease;
}
.progress-seg .seg.filled {
  background: linear-gradient(90deg,#69f0ae,#00bcd4);
  box-shadow: 0 6px 18px rgba(0,180,200,0.12), inset 0 1px 0 rgba(255,255,255,0.06);
}

.volume-seg {
  display: flex;
  gap: 4px;
  align-items: center;
  width: 112px;
  margin-right: 8px;
}
.volume-seg .seg {
  flex: 1 1 0;
  height: 6px;
  border-radius: 3px;
  background: linear-gradient(180deg,#2a2a2a,#1b1b1b);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
  cursor: pointer;
  transition: background 120ms ease, transform 120ms ease;
}
.volume-seg .seg.filled {
  background: linear-gradient(90deg,#ffd54f,#ff8a65);
  box-shadow: 0 6px 14px rgba(255,140,100,0.08);
}

.progress-seg:focus, .volume-seg:focus {
  outline: 2px solid rgba(255, 180, 60, 0.3);
  outline-offset: 3px;
}
.progress-seg:not(.activated) .seg,
.volume-seg:not(.activated) .seg { pointer-events: none; }
.seg-activate { pointer-events: auto; }

@media (max-width: 600px) {
  .volume-seg { width: 86px; gap:3px; }
  .progress-seg { gap: 4px; }
}

.muted { opacity: 0.6; }
.track-mini {
  font-size: 14px; color: #fff; text-align:left;
  max-width: 360px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.artist-mini { font-size: 12px; color: var(--muted-fg); margin-top:4px; }

/* ---------- Playlist/dialog overlays ---------- */
#playlistDialog {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80vw;
  max-height: 80vh;
  background-color: rgba(0,0,0,0.95);
  padding: 24px;
  border-radius: 12px;
  border: 2px solid rgba(255,255,255,0.06);
  z-index: 3000;
  display: none;
  box-shadow: 0 12px 40px rgba(0,0,0,0.7);
  color: #fff;
  overflow-y: auto;
  pointer-events: auto;
}
#dialogOverlay {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: rgba(0,0,0,0.5);
  z-index: 2500;
  display: none;
  pointer-events: auto;
}

#playlistTopArea { display:flex; align-items:flex-start; gap:12px; margin-bottom:12px; }
.playlist-add-square { width:120px; height:120px; background:#222; border-radius:8px; overflow:hidden; position:relative; box-shadow:0 2px 6px rgba(0,0,0,0.4); }
.playlist-add-square img { width:100%; height:100%; object-fit:cover; display:block; }
.playlist-add-square .add-icon { position:absolute; left:6px; top:6px; background:rgba(0,0,0,0.5); color:#fff; padding:4px 6px; border-radius:4px; font-weight:bold; }
.playlist-tiles-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.playlist-tile { width:100px; text-align:center; font-size:12px; cursor:pointer; position:relative; }
.playlist-tile img { width:100px; height:100px; border-radius:6px; object-fit:cover; display:block; }
.playlist-tile .tile-name { margin-top:6px; color:#fff; }
.playlist-tile .add-to-btn { position:absolute; right:6px; bottom:6px; background: rgba(0,0,0,0.6); color:#fff; border:none; border-radius:4px; padding:2px 6px; cursor:pointer; }
.playlist-tile .playlist-gear-btn { position:absolute; right:6px; top:6px; background: rgba(0,0,0,0.6); color:#fff; border:none; border-radius:50%; width:28px; height:28px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; }
.playlist-tile .add-to-btn { transition: transform 140ms ease, background-color 200ms ease; }
.playlist-tile .add-to-btn.checked { transform: scale(1.08); background-color: rgba(0, 255, 0, 0.06); }

#genres {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
  padding: 6px 0 12px 0;
}
.genre {
  text-align: center;
  width: 150px;
  cursor: pointer;
  position: relative;
}
.genre img {
  width: 150px;
  height: 150px;
  object-fit: cover;
  border-radius: 10px;
  display: block;
}
.genre p {
  font-weight: bold;
  margin-top: 5px;
  color: #fff;
}
.genre input {
  position: absolute;
  top: 5px;
  right: 5px;
  transform: scale(2.3);
  transform-origin: top right;
  accent-color: #1ABC9C;
}

/* Manage dialog */
#managePlaylistDialog {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  background: rgba(0,0,0,0.95);
  padding: 24px;
  border-radius: 12px;
  border: 2px solid rgba(255,255,255,0.06);
  box-shadow: 0 12px 40px rgba(0,0,0,0.7);
  z-index: 4000;
  width: 90%;
  max-width: 600px;
  display: none;
  color: #fff;
}
#managePlaylistDialog .cover-preview { width:120px; height:120px; object-fit:cover; border-radius:6px; }
#managePlaylistDialog .song-item { display:flex; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
#managePlaylistDialog .song-item .name { flex:1; margin-right:8px; color:#fff; font-size:13px; }
/* Manage top bar */
#manageTopBar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
#manageTopBar .manage-close-btn,
#manageTopBar .manage-save-btn {
  background: linear-gradient(180deg,#222,#1a1a1a);
  color: #fff;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.45);
}
#manageTopBar .manage-close-btn:hover,
#manageTopBar .manage-save-btn:hover { transform: translateY(-2px); }
#manageTopBar .manage-title { font-size: 18px; font-weight: 700; }

/* ---------- Mobile portrait improvements ---------- */
@media (orientation: portrait) and (max-width: 900px) {
  html, body {
    overflow: auto !important;
    -webkit-overflow-scrolling: touch;
  }

  .top-bar {
    position: sticky;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    z-index: 999;
    background: rgba(10,10,10,0.85);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid rgba(255,255,255,0.02);
  }

  .top-bar button,
  .top-bar .btn,
  .top-bar a.button {
    flex: 0 1 auto;
    min-width: 44px;
    padding: 6px 10px;
    font-size: 14px;
    line-height: 1;
    white-space: nowrap;
    box-sizing: border-box;
  }
  .top-bar .icon-only { padding: 6px; min-width: 40px; }

  .top-bar .page-title, .top-bar .profile-text {
    flex: 1 1 100%;
    min-width: 0;
    font-size: 15px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #coverContainer {
    position: relative !important;
    left: 0 !important;
    transform: none !important;
    top: 0 !important;
    width: 100% !important;
    height: auto !important;
    margin-top: calc(var(--topbar-height, var(--default-topbar-height)) + 8px);
    padding: 8px 0 24px 0;
    pointer-events: auto !important;
  }

  #artistCarousel {
    width: 100%;
    height: min(52vh, 420px);
    perspective: 900px;
    margin: 0 auto;
  }
  #artistCarousel img.center {
    width: min(54vmin, 260px);
    height: min(54vmin, 260px);
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) translateZ(0) scale(1);
  }
  #artistCarousel img.prev1, #artistCarousel img.next1 {
    width: min(34vmin, 160px);
    height: min(34vmin, 160px);
  }
  #artistCarousel img.prev3, #artistCarousel img.next3,
  #artistCarousel img.prev4, #artistCarousel img.next4 {
    display: none;
  }

  .player-bar {
    left: 50% !important;
    transform: translateX(-50%) !important;
    width: calc(100% - 20px) !important;
    max-width: 100% !important;
    border-radius: 10px !important;
    padding: 12px !important;
    bottom: calc(10px + var(--safe-bottom)) !important;
  }

  .player-bar .mute-button,
  .player-bar #muteBtn,
  .player-bar .btn-mute,
  .player-bar [data-action="mute"],
  .player-bar [aria-label="Mute"] {
    display: none !important;
    visibility: hidden !important;
  }

  .player-bar .controls,
  .player-bar .control-row {
    display: flex !important;
    align-items: center !important;
    gap: 8px !important;
  }
  .player-bar input[type="range"],
  .player-bar .progress {
    flex: 1 1 auto !important;
    min-width: 0 !important;
    margin-right: 6px !important;
  }
  .player-bar .volume,
  .player-bar .volume-control,
  .player-bar .vol {
    flex: 0 0 56px !important;
    min-width: 40px !important;
    text-align: center !important;
  }

  .player-bar .icon, .player-bar button { transform: scale(0.92); }
  body { padding-bottom: calc(84px + var(--safe-bottom)) !important; }
}

@media (orientation: portrait) and (max-width: 420px) {
  #artistCarousel img.center { width: 48vmin; height: 48vmin; }
  #artistCarousel { height: 46vh; }
  .player-bar { padding: 10px; bottom: calc(8px + var(--safe-bottom)); }
  .top-bar { padding: 6px 8px; gap: 5px; }
  .top-bar button, .top-bar .btn { font-size: 13px; padding: 6px 8px; min-width: 40px; }
  .top-bar .page-title { font-size: 14px; }
}

@media (orientation: portrait) and (max-width: 900px) {
  #playlistBtn { order: 1 !important; }
  #fullscreenBtn { order: 2 !important; }

  #fullscreenBtn {
    width: 42px !important;
    height: 42px !important;
    padding: 6px !important;
    display:flex !important;
    align-items:center !important;
    justify-content:center !important;
    font-size: 0 !important;
  }
  #fullscreenBtn::before {
    content: "⛶";
    font-size: 20px;
    line-height: 1;
  }
  #fullscreenBtn .label { display: none !important; }
}

:fullscreen #coverContainer {
  width: 100% !important;
  height: calc(100vh - 120px) !important;
  top: 70px !important;
}
:fullscreen #artistCarousel { width: 100% !important; height: 100% !important; }
:fullscreen #artistCarousel img.center { width: 50vmin !important; height: 50vmin !important; }
:fullscreen #artistCarousel img.prev1, :fullscreen #artistCarousel img.next1 { width: 32vmin !important; height: 32vmin !important; }
:fullscreen #artistCarousel img.prev2, :fullscreen #artistCarousel img.next2 { width: 24vmin !important; height: 24vmin !important; }
:fullscreen #artistCarousel img.prev3, :fullscreen #artistCarousel img.next3 { width: 18vmin !important; height: 18vmin !important; }
:fullscreen #artistCarousel img.prev4, :fullscreen #artistCarousel img.next4 { width: 14vmin !important; height: 14vmin !important; }
:fullscreen .player-bar { max-width: 95% !important; bottom: 20px !important; }

.seg-container { display:flex; align-items:center; gap:8px; }
.seg-activate {
  min-width:28px; height:28px; border-radius:6px;
  border:1px solid rgba(255,255,255,0.06);
  background: linear-gradient(180deg,#111,#222);
  color:#fff; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; padding:0 6px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}
.seg-activate[aria-pressed="true"] {
  background: linear-gradient(90deg,#69f0ae,#00bcd4);
  color:#002b2b; transform: translateY(-1px);
  box-shadow: 0 8px 22px rgba(0,180,200,0.08);
}

.progress-seg:focus, .volume-seg:focus { outline: 2px solid rgba(255, 180, 60, 0.3); outline-offset: 3px; }
.progress-seg.activated { outline: 3px solid rgba(255, 180, 60, 0.3); outline-offset: 4px; }
.progress-seg:not(.activated) .seg, .volume-seg:not(.activated) .seg { pointer-events: none; }
.seg-activate { pointer-events: auto; }

/* ===== Carousel caption styles – REMOVED – captions are hidden ===== */
/* The captions are removed from HTML and the JavaScript no longer updates them. */

.seg-container {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
}

.seg-activate {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.progress-seg {
  display: flex;
  gap: 10px;
  align-items: center;
  flex: 1;
  padding: 8px 0;
}
.progress-seg .seg {
  flex: 1 1 0;
  height: 14px;
  border-radius: 7px;
  background: linear-gradient(180deg,#252525,#181818);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
  transition: transform 120ms ease, box-shadow 150ms ease, background 150ms ease;
}
.progress-seg .seg.filled {
  background: linear-gradient(90deg,#4de0b3,#0097a7);
  box-shadow: 0 8px 20px rgba(0,150,170,0.15);
}
.progress-seg.activated {
  outline: 3px solid rgba(0,160,200,0.12);
  outline-offset: 4px;
}

.volume-seg {
  display: flex;
  gap: 8px;
  align-items: center;
  width: 170px;
}
.volume-seg .seg {
  flex: 1 1 0;
  height: 12px;
  border-radius: 6px;
  background: linear-gradient(180deg,#2c2c2c,#161616);

<script>
(function(){
  function reorderTopBarDOM(){
    const m = window.matchMedia("(orientation: portrait) and (max-width: 900px)");
    const top = document.querySelector('.top-bar') || document.querySelector('.topbar') || document.getElementById('topbar');
    if(!top) return;

    const playlist = top.querySelector('#playlistBtn');
    const fullscreen = top.querySelector('#fullscreenBtn');

    if(m.matches){
      if(playlist && fullscreen && playlist.parentElement === fullscreen.parentElement){
        if(playlist.compareDocumentPosition(fullscreen) & Node.DOCUMENT_POSITION_PRECEDING){
          top.insertBefore(playlist, fullscreen);
        }
      } else if (playlist && fullscreen) {
        if (fullscreen.parentElement && playlist.parentElement && playlist.parentElement !== fullscreen.parentElement) {
          try {
            fullscreen.parentElement.insertBefore(playlist.parentElement, fullscreen);
          } catch(e){}
        }
      }
    }
  }

  window.addEventListener('resize', reorderTopBarDOM, {passive:true});
  window.addEventListener('orientationchange', reorderTopBarDOM, {passive:true});
  document.addEventListener('DOMContentLoaded', reorderTopBarDOM);
})();
</script>

    <script>
      const audioEl = document.getElementById("audio");

      (function installAudioPreloader() {
        if (window._audioPreloader) return;
        let _controller = null;
        let _blobUrl = null;
        let _url = null;
        let _revokeTimer = null;

        function _revokeBlob() {
          try { if (_blobUrl) { URL.revokeObjectURL(_blobUrl); } } catch (e) {}
          _blobUrl = null;
        }

        async function preload(url, bytes = 512 * 1024) {
          abort();
          if (!url) return null;
          _controller = new AbortController();
          _url = url;
          const range = `bytes=0-${Math.max(0, bytes - 1)}`;

          try {
            const resp = await fetch(url, {
              headers: { Range: range },
              signal: _controller.signal,
              cache: 'force-cache'
            });
            if (!resp || (!resp.ok && resp.status !== 206 && resp.status !== 200)) { return null; }
            const arr = await resp.arrayBuffer();
            const contentType = resp.headers.get('content-type') || 'audio/mpeg';
            const blob = new Blob([arr], { type: contentType });
            _blobUrl = URL.createObjectURL(blob);
            try { if (_revokeTimer) clearTimeout(_revokeTimer); } catch (e) {}
            _revokeTimer = setTimeout(() => { _revokeBlob(); _url = null; }, 3 * 60 * 1000);
            return { url: _url, blobUrl: _blobUrl, bytes: arr.byteLength };
          } catch (e) { return null; }
        }

        function abort() {
          try { if (_controller) _controller.abort(); } catch (e) {}
          _controller = null;
          _url = null;
          try { if (_revokeTimer) { clearTimeout(_revokeTimer); _revokeTimer = null; } } catch (e) {}
          _revokeBlob();
        }

        function state() { return { url: _url, blobUrl: _blobUrl }; }

        window._audioPreloader = { preload, abort, state };
      })();

      async function _resolveTrackUrlSafe(raw) {
        try {
          if (!raw) return null;
          // Use origin-aware resolution
          let entry = MUSIC_LIBRARY_ENTRIES.find(e => e.raw === raw || e.base === normalizeSongBase(raw));
          if (!entry) {
            const artist = getArtistFromFilename(raw);
            if (artist) {
              entry = MUSIC_LIBRARY_ENTRIES.find(e => getArtistFromFilename(e.base) === artist);
            }
          }
          const origin = entry ? entry.origin : window.location.origin;
          const base = normalizeSongBase(raw);
          const flacUrl = fileToMusicUrl(base, 'flac', origin);
          // Return flacUrl directly (the preloader will fetch it)
          return flacUrl;
        } catch (e) { return raw; }
      }

      function stripKnownAudioExtension(name) {
        if (!name) return '';
        return String(name).replace(/\.(mp3|flac|wav|m4a|ogg|aac|opus|wma|alac|aif|aiff|m4b|mp4)(\?.*)?$/i, '').trim();
      }

      function parseFilename(filename) {
        if (!filename) return { title: '', artist: '' };
        const base = filename.split('/').pop().replace(/\.(mp3|flac|wav|m4a|ogg|aac|opus|wma|alac|aif|aiff|m4b|mp4)$/i, '').trim();
        const parts = base.split(' - ').map(p => p.trim()).filter(Boolean);
        if (parts.length === 0) return { title: '', artist: '' };
        if (parts.length === 1) return { title: parts[0], artist: '' };
        if (parts.length >= 3 && /^\d+$/.test(parts[0])) {
          const artist = parts[1];
          const title = parts.slice(2).join(' - ');
          return { title, artist };
        }
        if (parts.length === 2) { return { title: parts[0], artist: parts[1] }; }
        const artist = parts[parts.length - 1];
        const title = parts.slice(0, parts.length - 1).join(' - ');
        return { title, artist };
      }

      function getTitleFromFilename(filename) { return parseFilename(filename).title || ''; }
      function getArtistFromFilename(filename) { return parseFilename(filename).artist || ''; }

      audioEl.preload = "metadata";
      audioEl.crossOrigin = "anonymous";

      function basename(path) {
        if (!path && path !== 0) return '';
        try {
          var p = String(path);
          p = p.trim().replace(/^["']|["']$/g, '');
          var parts = p.split(/[\\/]/);
          var last = parts[parts.length - 1] || '';
          return last.trim();
        } catch (e) { return String(path); }
      }

      const trackTitleEl = document.getElementById("trackTitle");
      const artistMiniEl = document.getElementById("artistMini");
      const coverImageEl = document.getElementById("coverImage");
      const playlistDialog = document.getElementById("playlistDialog");
      const dialogOverlay = document.getElementById("dialogOverlay");
      const toggleBtn = document.getElementById("togglePlaylistBtn");
      const shuffleBtn = document.getElementById("shuffleBtn");
      const prevBtn = document.getElementById("prevBtn");
      const playPauseBtn = document.getElementById("playPauseBtn");
      const nextBtn = document.getElementById("nextBtn");
      const likeBtn = document.getElementById("likeBtn");
      const fullscreenBtn = document.getElementById("fullscreenBtn");

      const barPlay = document.getElementById("barPlay");
      const barPrev = document.getElementById("barPrev");
      const barNext = document.getElementById("barNext");
      const progress = document.getElementById("progress");
      const curTime = document.getElementById("curTime");
      const durTime = document.getElementById("durTime");
      const volume = document.getElementById("volume");
      const muteBtn = document.getElementById("muteBtn");

      let playlist = [];
      let currentTrackIndex = 0;
      let isPlayingLiked = false;
      let lastPlaylist = null;
      let userSeeking = false;
      let lastVolume = 0.9;
      let dialogOpen = false;

      function formatTime(s) {
        if (!s || isNaN(s)) return "0:00";
        s = Math.floor(s);
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return `${m}:${sec.toString().padStart(2, "0")}`;
      }

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      // ---- START: cross-file compatibility helpers ----
      const SERVER_UPLOAD_STYLE = window.SERVER_UPLOAD_STYLE || localStorage.getItem('SERVER_UPLOAD_STYLE') || 'windows';
      function isWindowsUpload() { return String(SERVER_UPLOAD_STYLE).toLowerCase() === 'windows'; }
      function isAndroidUpload() { return String(SERVER_UPLOAD_STYLE).toLowerCase().includes('android'); }
      function isIphoneUpload() { return String(SERVER_UPLOAD_STYLE).toLowerCase().includes('iphone') || String(SERVER_UPLOAD_STYLE).toLowerCase() === 'iphones'; }

      function extractFirstJsonArray(text) {
        if (!text || typeof text !== 'string') return null;
        for (let i = 0; i < text.length; i++) {
          if (text[i] === '[') {
            let depth = 0;
            for (let j = i; j < text.length; j++) {
              if (text[j] === '[') depth++;
              else if (text[j] === ']') {
                depth--;
                if (depth === 0) return text.slice(i, j + 1);
              }
            }
            break;
          }
        }
        return null;
      }

      function normalizeQuotesAndDashes(name) {
        return String(name || '').replace(/[‘’‛“”]/g, "'").replace(/[‐‑‒–—]/g, '-').trim();
      }

      function normalizeSongBase(raw) {
        let s = String(raw == null ? '' : raw).trim();
        try { s = decodeURIComponent(s); } catch (e) {}
        s = s.split(/[\/]/).pop();
        s = s.replace(/[?#].*$/, '');
        s = s.replace(/\.(mp3|flac|wav|m4a|ogg|aac|opus|wma|alac)(\?.*)?$/i, '');
        s = s.replace(/\$[9AM\+RPUHEBC]$/i, '');
        return s.trim();
      }

      function flattenStoredList(input) {
        const out = [];
        const walk = (item) => {
          if (item == null) return;
          if (Array.isArray(item)) { item.forEach(walk); return; }
          let str = String(item).trim();
          if (!str) return;
          if (str.startsWith('[') && str.endsWith(']')) {
            try { const parsed = JSON.parse(str); if (Array.isArray(parsed)) { walk(parsed); return; } } catch (e) {}
          }
          out.push(str);
        };
        walk(input);
        return out;
      }

      function getActiveProfileName() {
        const profile = localStorage.getItem('activeProfile') || 'Guest';
        return String(profile || 'Guest').trim() || 'Guest';
      }

      function getLikedSongsStorageKey(profile) { return `likedSongs:${profile || getActiveProfileName()}`; }

      // ---- REPLACED: music library parsing will use loadexpanded merged data ----
      // We'll keep these variables but populate them via parseMergedLibrary()
      let MUSIC_LIBRARY_ENTRIES = [];
      let MUSIC_LIBRARY_GENRE_MAP = {};
      let MUSIC_LIBRARY_GENRE_CODE_BY_NAME = {};

      // ---- ORIGIN-AWARE IMAGE LOADING (copied from Music.html) ----
      const MAX_CONCURRENT_IMAGE_REQUESTS = 4;
      const IMAGE_CACHE = new Map();
      const PENDING_IMAGE_QUEUE = [];
      let ACTIVE_IMAGE_REQUESTS = 0;

      function processImageQueue() {
        if (ACTIVE_IMAGE_REQUESTS >= MAX_CONCURRENT_IMAGE_REQUESTS || PENDING_IMAGE_QUEUE.length === 0) return;
        const job = PENDING_IMAGE_QUEUE.shift();
        ACTIVE_IMAGE_REQUESTS++;
        _probeImage(job.baseName).then(result => {
          if (!result.endsWith('default.jpg')) {
            IMAGE_CACHE.set(job.baseName, result);
          }
          job.resolve(result);
        }).finally(() => {
          ACTIVE_IMAGE_REQUESTS--;
          processImageQueue();
        });
      }

      function _probeImage(baseName) {
        if (!baseName) return Promise.resolve('Music/Images/default.jpg');
        const nameVariations = getArtistNameVariations(baseName);
        const primaryOrigin = getOriginForArtist(baseName);

        const allOrigins = new Set();
        allOrigins.add(primaryOrigin);
        const sources = window.__availableSources || [];
        const serverSource = sources.find(s => s.priority === 3);
        if (serverSource) allOrigins.add(serverSource.origin);
        for (const src of sources) allOrigins.add(src.origin);
        allOrigins.add(window.location.origin);

        const originOrder = [];
        if (allOrigins.has(primaryOrigin)) originOrder.push(primaryOrigin);
        if (serverSource && serverSource.origin !== primaryOrigin) originOrder.push(serverSource.origin);
        const sortedSources = [...sources].sort((a,b) => b.priority - a.priority);
        for (const src of sortedSources) {
          if (!originOrder.includes(src.origin)) originOrder.push(src.origin);
        }
        if (!originOrder.includes(window.location.origin)) originOrder.push(window.location.origin);

        const candidates = [];
        for (const origin of originOrder) {
          const base = origin.endsWith('/') ? origin : origin + '/';
          for (const name of nameVariations) {
            const encoded = encodeURIComponent(name);
            candidates.push(`${base}Music/Images/${encoded}.jpg`);
          }
        }
        candidates.push(`Music/Images/${encodeURIComponent(baseName)}.jpg`);
        candidates.push('Music/Images/default.jpg');

        const unique = [...new Set(candidates)];

        return new Promise((resolve) => {
          let index = 0;
          function tryNext() {
            if (index >= unique.length) {
              resolve('Music/Images/default.jpg');
              return;
            }
            const url = unique[index++];
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 2000);
            fetch(url, { method: 'HEAD', cache: 'no-store', signal: controller.signal })
              .then(res => {
                clearTimeout(timer);
                if (res && res.ok) resolve(url);
                else tryNext();
              })
              .catch(() => {
                clearTimeout(timer);
                tryNext();
              });
          }
          tryNext();
        });
      }

      function resolveImage(baseName) {
        if (!baseName) return Promise.resolve('Music/Images/default.jpg');
        if (IMAGE_CACHE.has(baseName)) {
          const cached = IMAGE_CACHE.get(baseName);
          if (!cached.endsWith('default.jpg')) {
            return Promise.resolve(cached);
          }
          IMAGE_CACHE.delete(baseName);
        }
        return new Promise((resolve, reject) => {
          PENDING_IMAGE_QUEUE.push({ baseName, resolve, reject });
          processImageQueue();
        });
      }

      async function applyImage(img, baseName) {
        if (!img) return;
        const url = await resolveImage(baseName);
        img.src = url;
        img.onerror = function() {
          this.onerror = null;
          this.src = 'Music/Images/default.jpg';
        };
      }

      // ---- Origin map and parsing (copied from Music.html) ----
      let artistOriginMap = new Map();

      function buildArtistOriginMap(entries) {
        const map = new Map();
        for (const e of entries) {
          const artist = getArtistFromFilename(e.base);
          if (artist && !map.has(artist)) {
            map.set(artist, e.origin);
          }
        }
        return map;
      }

      function getOriginForArtist(artistName) {
        if (!artistName) return window.location.origin;
        if (artistOriginMap.has(artistName)) return artistOriginMap.get(artistName);
        const entry = MUSIC_LIBRARY_ENTRIES.find(e => getArtistFromFilename(e.base) === artistName);
        if (entry) return entry.origin;
        return window.location.origin;
      }

      function getArtistNameVariations(fullName) {
        const variations = [fullName];
        const lower = fullName.toLowerCase();
        const featIndex = lower.indexOf(' feat ');
        if (featIndex !== -1) {
          variations.push(fullName.substring(0, featIndex).trim());
        }
        const capitalFeatIndex = fullName.indexOf(' Feat ');
        if (capitalFeatIndex !== -1 && capitalFeatIndex !== featIndex) {
          variations.push(fullName.substring(0, capitalFeatIndex).trim());
        }
        return [...new Set(variations.filter(v => v.length > 0))];
      }

      function parseMergedLibrary() {
        const raw = window.musicLibrary || [];
        const entries = [];
        const genreMap = window.musicLibraryGenreMap || {};
        MUSIC_LIBRARY_GENRE_MAP = genreMap;
        MUSIC_LIBRARY_GENRE_CODE_BY_NAME = Object.fromEntries(
          Object.entries(genreMap).map(([code, name]) => [String(name), String(code)])
        );

        for (const item of raw) {
          let rawStr = '';
          let origin = window.location.origin;
          if (typeof item === 'string') {
            rawStr = item;
          } else if (item && typeof item === 'object') {
            rawStr = item.raw || '';
            origin = item._origin || window.location.origin;
          }
          if (!rawStr) continue;
          const idx = rawStr.lastIndexOf('$');
          const base = normalizeSongBase(idx === -1 ? rawStr : rawStr.slice(0, idx));
          const code = idx === -1 ? '' : rawStr.slice(idx + 1).trim();
          const genre = genreMap[code] || code;
          entries.push({ raw: rawStr, base, code, genre, origin });
        }
        MUSIC_LIBRARY_ENTRIES = entries;
        artistOriginMap = buildArtistOriginMap(entries);
      }

      // ---- FUNCTIONS THAT USE THE PARSED LIBRARY (replacing old ones) ----
      function getAllGenreNames() {
        const seen = new Set();
        const names = [];
        for (const rec of MUSIC_LIBRARY_ENTRIES) {
          if (!rec.genre || seen.has(rec.genre)) continue;
          seen.add(rec.genre);
          names.push(rec.genre);
        }
        return names.sort((a,b) => a.localeCompare(b));
      }

      function getSongsForGenre(genreName) {
        const code = MUSIC_LIBRARY_GENRE_CODE_BY_NAME[String(genreName || '').trim()];
        if (!code) return [];
        return MUSIC_LIBRARY_ENTRIES.filter(rec => rec.code === code).map(rec => rec.base).filter(Boolean);
      }

      function getSongsForArtist(artistName) {
        const target = String(artistName || '').trim();
        if (!target) return [];
        const songs = [];
        const seen = new Set();
        for (const rec of MUSIC_LIBRARY_ENTRIES) {
          const artist = getArtistFromFilename(rec.base);
          if (artist === target && !seen.has(rec.base)) {
            seen.add(rec.base);
            songs.push(rec.base);
          }
        }
        return songs;
      }

      function normalizeLoadedPlaylist(list) {
        const out = [];
        const seen = new Set();
        flattenStoredList(list).forEach(item => {
          const base = normalizeSongBase(item);
          if (!base || seen.has(base)) return;
          seen.add(base);
          out.push(base);
        });
        return out;
      }

      // ---- ORIGIN-AWARE FILE TO MUSIC URL (REPLACED) ----
      function fileToMusicUrl(baseName, ext, origin) {
        const clean = normalizeSongBase(baseName);
        const baseUrl = origin || window.location.origin;
        return `${baseUrl}/Music/${encodeURIComponent(clean)}.${ext}`;
      }

      // ---- SIMPLIFIED AUDIO LOADING (origin-aware) ----
      function setAudioWithFallbacks(audioEl, raw) {
        // Determine origin
        let entry = MUSIC_LIBRARY_ENTRIES.find(e => e.raw === raw || e.base === normalizeSongBase(raw));
        if (!entry) {
          const artist = getArtistFromFilename(raw);
          if (artist) {
            entry = MUSIC_LIBRARY_ENTRIES.find(e => getArtistFromFilename(e.base) === artist);
          }
        }
        const origin = entry ? entry.origin : window.location.origin;
        const base = normalizeSongBase(raw);
        const flacUrl = fileToMusicUrl(base, 'flac', origin);
        const mp3Url = fileToMusicUrl(base, 'mp3', origin);

        // Try flac first, fallback to mp3 on error
        audioEl.onerror = function() {
          // If we were trying flac, switch to mp3
          if (audioEl.src === flacUrl) {
            audioEl.onerror = null;
            audioEl.src = mp3Url;
            try { audioEl.load(); } catch (e) {}
            audioEl.play().catch(() => {});
          }
        };
        audioEl.src = flacUrl;
        try { audioEl.load(); } catch (e) {}
        audioEl.play().catch(() => {});
      }

      // ---- Helper functions for liked songs ----
      function _songKey(value) {
        let s = String(value == null ? '' : value).trim();
        if (!s) return '';
        try { s = decodeURIComponent(s); } catch (e) {}
        s = s.split(/[\/]/).pop();
        s = s.replace(/[?#].*$/, '');
        s = s.replace(/\.(mp3|flac|wav|m4a|ogg|aac|opus|wma|alac)$/i, '');
        s = s.replace(/\s+/g, ' ').trim();
        return s.toLowerCase();
      }

      function _isLikedSong(rawSong, likedList) {
        const rawKey = _songKey(rawSong);
        if (!rawKey || !Array.isArray(likedList)) return false;
        return likedList.some(item => {
          const itemKey = _songKey(item);
          return itemKey && itemKey === rawKey;
        });
      }

      function _splitLegacyLikedBundle(value) {
        const s = String(value == null ? '' : value).trim();
        if (!s) return [];
        const commaCount = (s.match(/,/g) || []).length;
        const dashCount = (s.match(/\s-\s/g) || []).length;
        if (commaCount > 0 && dashCount > 1 && !/\.(mp3|flac|wav|m4a|ogg|aac|opus|wma|alac)\b/i.test(s)) {
          return s.split(/\s*,\s*/).map(x => String(x).trim()).filter(Boolean);
        }
        return [s];
      }

      function _normalizeLikedSongsArray(arr) {
        const out = [];
        const seen = new Set();
        flattenStoredList(arr).forEach(item => {
          if (item == null) return;
          let str = String(item).trim();
          if (!str) return;
          if ((str.startsWith('"') && str.endsWith('"')) || (str.startsWith("'") && str.endsWith("'"))) {
            str = str.slice(1, -1);
          }
          try { str = decodeURIComponent(str); } catch (e) {}
          _splitLegacyLikedBundle(str).forEach(part => {
            const song = String(part).trim();
            if (!song) return;
            const key = _songKey(song);
            if (!key || seen.has(key)) return;
            seen.add(key);
            out.push(song);
          });
        });
        return out;
      }

      function setStoredLikedSongs(arr) {
        try {
          const profile = getActiveProfileName();
          const cleaned = _normalizeLikedSongsArray(flattenStoredList(arr));
          const payload = isWindowsUpload() ? '[[[' + JSON.stringify(cleaned) + ']]]' : JSON.stringify(cleaned);
          try { localStorage.setItem(getLikedSongsStorageKey(profile), payload); } catch (e) {}
          try { localStorage.setItem('likedSongs', payload); } catch (e) {}
        } catch (e) { console.warn('setStoredLikedSongs failed', e); }
      }

      function getStoredLikedSongs() {
        const profile = getActiveProfileName();

        let raw = '';
        for (const k of keys) {
          try { raw = localStorage.getItem(k) || ''; if (raw) break; } catch (e) {}
        }
        let arr = [];
        try {
          const extracted = extractFirstJsonArray(raw);
          if (extracted) arr = JSON.parse(extracted);
          else if (raw) arr = JSON.parse(raw);
        } catch (e) {
          const match = raw.match(/\[\[\[\s*(\[[\s\S]*?\])\s*\]\]\]/);
          try { if (match) arr = JSON.parse(match[1]); } catch (e2) { arr = []; }
        }
        arr = flattenStoredList(arr);
        return _normalizeLikedSongsArray(arr);
      }

      function _hashSlugToInt(s) {
        if (!s) return 0;
        let h = 5381;
        for (let i = 0; i < s.length; i++) h = ((h << 5) + h) + s.charCodeAt(i);
        return Math.abs(h);
      }

      async function checkPlaylistImageUrl(profile, slug, index) {
        const base = `/Music/Images/${encodeURIComponent(slug)}`;
        const fallbackPrefix = `/Music/Images/playlist`;
        const FALLBACK_COUNT = 15;
        try {
          const j = await fetch(base + '.jpg', { method: 'HEAD' });
          if (j && j.ok) return base + '.jpg';
          const p = await fetch(base + '.png', { method: 'HEAD' });
          if (p && p.ok) return base + '.png';
        } catch (e) {}
        try {
          let n;
          if (typeof index === 'number' && !isNaN(index)) { n = (index % FALLBACK_COUNT) + 1; } else { n = (_hashSlugToInt(slug) % FALLBACK_COUNT) + 1; }
          const candidate = `${fallbackPrefix}${n}.jpg`;
          const r = await fetch(candidate, { method: 'HEAD' });
          if (r && r.ok) return candidate;
        } catch (e) {}
        for (let k = 1; k <= FALLBACK_COUNT; k++) {
          try {
            const candidate = `${fallbackPrefix}${k}.jpg`;
            const r = await fetch(candidate, { method: 'HEAD' });
            if (r && r.ok) return candidate;
          } catch (e) {}
        }
        return 'Music/Images/default.jpg';
      }

      function updateNowPlayingUI(filename) {

      function assignCarouselForIndex(index) {
        if (!playlist.length) return;
        currentTrackIndex = index;
        const raw = playlist[index];
        const artist = getArtistFromFilename(raw);
        const elems = {
          prev4: document.getElementById("prev4"),
          prev3: document.getElementById("prev3"),
          prev2: document.getElementById("prev2"),
          prev1: document.getElementById("prev1"),
          center: coverImageEl,
          next1: document.getElementById("next1"),
          next2: document.getElementById("next2"),
          next3: document.getElementById("next3"),
          next4: document.getElementById("next4"),
        };

        // Use applyImage for center
        applyImage(elems.center, artist);
        elems.center.style.display = '';

        function clearHandlers(el) {
          if (!el) return;
          el.onclick = null;
          el.ondblclick = null;
          el.ontouchstart = null;
          el.ontouchmove = null;
          el.ontouchend = null;
        }

        function assignSlot(offset, el) {
          if (!el) return;
          clearHandlers(el);
          if (playlist.length === 1) { el.style.display = 'none'; return; }
          const idx = (index + offset + playlist.length) % playlist.length;
          let candidate = playlist[idx];

          if (!candidate || typeof candidate !== 'string') {
            try {
              if (playlist[idx] && typeof playlist[idx] === 'object' && playlist[idx].file) {
                candidate = String(playlist[idx].file);
                playlist[idx] = candidate;
              } else { el.style.display = 'none'; return; }
            } catch (e) { el.style.display = 'none'; return; }
          }

          if (!candidate.includes('/') && !/\.\w+$/.test(candidate) && !candidate.includes(' - ')) {
            let songs = getSongsForArtist(candidate);
            if (!songs.length) { el.style.display = 'none'; return; }
            candidate = songs[0];
            try { playlist[idx] = candidate; } catch (e) {}
          }

          const candArtist = getArtistFromFilename(candidate);
          el.style.display = '';
          applyImage(el, candArtist);
          el.title = String(candidate).replace(/\.(mp3|flac|m4a)$/, "");

          el.onclick = () => { loadAndPlay(idx); };
          el.ondblclick = (ev) => { ev.stopPropagation(); loadAndPlay(idx); };

          let touchStartX = 0, touchStartTime = 0, touchMoved = false;
          const LONG_PRESS_MS = 400, SWIPE_THRESHOLD = 30;

          el.ontouchstart = (ev) => {
            if (!ev.touches || !ev.touches.length) return;
            const t = ev.touches[0];
            touchStartX = t.clientX;
            touchStartTime = Date.now();
            touchMoved = false;
          };
          el.ontouchmove = (ev) => {
            if (!ev.touches || !ev.touches.length) return;
            const t = ev.touches[0];
            if (Math.abs(t.clientX - touchStartX) > 8) touchMoved = true;
          };
          el.ontouchend = (ev) => {
            const duration = Date.now() - touchStartTime;
            if (!touchMoved && duration >= LONG_PRESS_MS) { loadAndPlay(idx); return; }
            if (ev.changedTouches && ev.changedTouches[0]) {
              const t = ev.changedTouches[0];
              const dx = t.clientX - touchStartX;
              if (Math.abs(dx) > SWIPE_THRESHOLD) loadAndPlay(idx);
            }
          };
        }

        assignSlot(-1, elems.prev1);
        assignSlot(-2, elems.prev2);
        assignSlot(-3, elems.prev3);
        assignSlot(-4, elems.prev4);
        assignSlot(1, elems.next1);
        assignSlot(2, elems.next2);
        assignSlot(3, elems.next3);
        assignSlot(4, elems.next4);
      }

      // ---- Replaced setAudioWithFallbacks above ----

      function loadAndPlay(index) {
        if (!playlist.length) return;
        currentTrackIndex = index;
        const raw = playlist[index];

        updateNowPlayingUI(raw);
        try { updateMediaSessionForRaw(raw); } catch (e) {}
        try { ensureFullscreenOnPlay(); } catch (e) {}
        assignCarouselForIndex(index);
        updateLikedSongsUI();

        try { if (window._audioPreloader && typeof window._audioPreloader.abort === 'function') window._audioPreloader.abort(); } catch (e) {}

        setAudioWithFallbacks(audioEl, raw);

        try { if (typeof playPauseBtn !== 'undefined' && playPauseBtn) playPauseBtn.textContent = "Pause"; } catch (e) {}
        try { if (typeof barPlay !== 'undefined' && barPlay) barPlay.textContent = "ll"; } catch (e) {}

        try {
          try { if (audioEl._nextPreloadTimeout) { clearTimeout(audioEl._nextPreloadTimeout); audioEl._nextPreloadTimeout = null; } } catch (e) {}
          audioEl._nextPreloadTimeout = setTimeout(() => {
            try {
              (async () => {
                if (!Array.isArray(playlist) || playlist.length <= 1) return;
                const nextIdx = (currentTrackIndex + 1) % playlist.length;
                const nextRaw = playlist[nextIdx];
                const nextUrl = await _resolveTrackUrlSafe(nextRaw);
                if (!nextUrl) return;
                if (window._audioPreloader && typeof window._audioPreloader.preload === 'function') {
                  window._audioPreloader.preload(nextUrl, 400 * 1024).catch(() => {});
                }
              })();
            } catch (e) { console.warn('schedule preload failed', e); }
          }, 8000);
        } catch (e) {}
      }

      function playNextTrack() {
        if (!playlist.length) return;
        const next = (currentTrackIndex + 1) % playlist.length;
        loadAndPlay(next);
      }

      function playPreviousTrack() {
        if (!playlist || !playlist.length) return;
        try {
          let idx = (currentTrackIndex - 1 + playlist.length) % playlist.length;
          let tries = 0;
          while (typeof isExiledSong === 'function' && playlist && playlist.length && isExiledSong(playlist[idx]) && tries < playlist.length) {
            idx = (idx - 1 + playlist.length) % playlist.length;
            tries++;
          }
          if (tries >= playlist.length) { alert('No playable tracks (all exiled)'); return; }
          loadAndPlay(idx);
        } catch (e) {
          console.warn('playPreviousTrack wrapper failed, falling back', e);
          const prev = (currentTrackIndex - 1 + playlist.length) % playlist.length;
          loadAndPlay(prev);
        }
      }

      // -------- Segmented controls (unchanged) --------
      function buildSegments(container, count, segClass) {
        container.innerHTML = '';
        for (let i = 0; i < count; i++) {
          const d = document.createElement('div');
          d.className = segClass || 'seg';
          d.dataset.index = i;
          d.tabIndex = -1;
          container.appendChild(d);
        }
        return Array.from(container.children);
      }

      const progressSeg = document.getElementById('progressSeg');
      const progressHidden = document.getElementById('progress');
      const progressActivateBtn = document.getElementById('progressActivateBtn');

      const volumeSeg = document.getElementById('volumeSeg');
      const volumeHidden = document.getElementById('volume');
      const volumeActivateBtn = document.getElementById('volumeActivateBtn');

      const PROG_COUNT = 20;
      const VOL_COUNT = 10;
      buildSegments(progressSeg, PROG_COUNT, 'seg');
      buildSegments(volumeSeg, VOL_COUNT, 'seg');

      let progActive = false;
      let volActive = false;
      let prevFocusBeforeProg = null;
      let prevFocusBeforeVol = null;

      function renderProgressSegments() {
        if (!audioEl.duration) {
          [...progressSeg.children].forEach(s => s.classList.remove('filled'));
          return;
        }
        const pct = Math.max(0, Math.min(1, (audioEl.currentTime || 0) / audioEl.duration));
        const fillCount = Math.round(pct * PROG_COUNT);
        [...progressSeg.children].forEach((s, i) => s.classList.toggle('filled', i < fillCount));
        if (progressHidden) progressHidden.value = (pct * 100).toFixed(3);
        curTime.textContent = formatTime(audioEl.currentTime || 0);
        updateCompactUI();
      }

      function renderVolumeSegments() {
        const vol = Number(audioEl.volume) || 0;
        const fill = Math.round(vol * VOL_COUNT);
        [...volumeSeg.children].forEach((s, i) => s.classList.toggle('filled', i < fill));
        if (volumeHidden) volumeHidden.value = vol.toFixed(3);
        muteBtn.textContent = vol === 0 ? "🔈" : "🔊";
        updateCompactUI();
      }

      function progPointerToPct(ev) {
        const r = progressSeg.getBoundingClientRect();
        const x = (ev.clientX !== undefined ? ev.clientX : (ev.touches && ev.touches[0] && ev.touches[0].clientX)) - r.left;
        return Math.max(0, Math.min(1, x / r.width));
      }

      function volPointerToPct(ev) {
        const r = volumeSeg.getBoundingClientRect();
        const x = (ev.clientX !== undefined ? ev.clientX : (ev.touches && ev.touches[0] && ev.touches[0].clientX)) - r.left;
        return Math.max(0, Math.min(1, x / r.width));
      }

      function activateProgress() {
        if (progActive) return;
        prevFocusBeforeProg = document.activeElement || document.body;
        progActive = true;
        progressSeg.classList.add('activated');
        progressActivateBtn.setAttribute('aria-pressed', 'true');
        progressSeg.setAttribute('aria-roledescription', 'activated segmented timeline — use left/right to adjust, up/down or back to exit');
        progressSeg.focus();
      }

      function deactivateProgress() {
        if (!progActive) return;
        progActive = false;
        progressSeg.classList.remove('activated');
        progressActivateBtn.setAttribute('aria-pressed', 'false');
        progressSeg.removeAttribute('aria-roledescription');
        try {
          if (prevFocusBeforeProg && document.contains(prevFocusBeforeProg)) prevFocusBeforeProg.focus();
          else if (muteBtn) muteBtn.focus();
        } catch (e) { if (muteBtn) muteBtn.focus(); }
      }

      function activateVolume() {
        if (volActive) return;
        prevFocusBeforeVol = document.activeElement || document.body;
        volActive = true;
        volumeSeg.classList.add('activated');
        volumeActivateBtn.setAttribute('aria-pressed', 'true');
        volumeSeg.setAttribute('aria-roledescription', 'activated segmented volume — use left/right to adjust, up/down or back to exit');
        volumeSeg.focus();
      }

      function deactivateVolume() {
        if (!volActive) return;
        volActive = false;
        volumeSeg.classList.remove('activated');
        volumeActivateBtn.setAttribute('aria-pressed', 'false');
        volumeSeg.removeAttribute('aria-roledescription');
        try {
          if (prevFocusBeforeVol && document.contains(prevFocusBeforeVol)) prevFocusBeforeVol.focus();
          else if (muteBtn) muteBtn.focus();
        } catch (e) { if (muteBtn) muteBtn.focus(); }
      }

      progressActivateBtn.addEventListener('click', (e) => { activateProgress(); });
      volumeActivateBtn.addEventListener('click', (e) => { activateVolume(); });

      progressSeg.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault();
          if (progActive) deactivateProgress();
          else activateProgress();
          return;
        }
        if (!progActive) return;
        if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') {
          ev.preventDefault();
          audioEl.currentTime = Math.max(0, audioEl.currentTime - audioEl.duration / PROG_COUNT);
          renderProgressSegments();
        } else if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp') {
          ev.preventDefault();
          audioEl.currentTime = Math.min(audioEl.duration, audioEl.currentTime + audioEl.duration / PROG_COUNT);
          renderProgressSegments();
        } else if (ev.key === 'Home') { ev.preventDefault(); audioEl.currentTime = 0; renderProgressSegments(); } else if (ev.key === 'End') { ev.preventDefault(); audioEl.currentTime = audioEl.duration || 0; renderProgressSegments(); } else if (ev.key === 'Escape' || ev.key === 'Backspace') {
          deactivateProgress();
        } else if (ev.key === 'ArrowUp' || ev.key === 'ArrowDown') {
          deactivateProgress();
        }
      });

      volumeSeg.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault();
          if (volActive) deactivateVolume();
          else activateVolume();
          return;
        }
        if (!volActive) return;
        if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') {
          ev.preventDefault();
          audioEl.volume = Math.max(0, (audioEl.volume || 0) - (1 / VOL_COUNT));
          renderVolumeSegments();
        } else if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp') {
          ev.preventDefault();
          audioEl.volume = Math.min(1, (audioEl.volume || 0) + (1 / VOL_COUNT));
          renderVolumeSegments();
        } else if (ev.key === 'Home') { ev.preventDefault(); audioEl.volume = 0; renderVolumeSegments(); } else if (ev.key === 'End') { ev.preventDefault(); audioEl.volume = 1; renderVolumeSegments(); } else if (ev.key === 'Escape' || ev.key === 'Backspace') {
          deactivateVolume();
        } else if (ev.key === 'ArrowUp' || ev.key === 'ArrowDown') {
          deactivateVolume();
        }
      });

      let progDragging = false;
      progressSeg.addEventListener('pointerdown', (ev) => {
        if (!progActive) { activateProgress(); }
        progDragging = true;
        progressSeg.setPointerCapture(ev.pointerId);
        const pct = progPointerToPct(ev);
        if (audioEl.duration) audioEl.currentTime = pct * audioEl.duration;
        renderProgressSegments();
      });
      progressSeg.addEventListener('pointermove', (ev) => {
        if (!progActive || !progDragging) return;
        const pct = progPointerToPct(ev);
        if (audioEl.duration) audioEl.currentTime = pct * audioEl.duration;
        renderProgressSegments();
      });
      progressSeg.addEventListener('pointerup', (ev) => { progDragging = false; try { progressSeg.releasePointerCapture(ev.pointerId); } catch (e) {} });

      volumeSeg.addEventListener('pointerdown', (ev) => {
        if (!volActive) { activateVolume(); }
        volumeSeg.setPointerCapture(ev.pointerId);
        volDragging = true;
        const pct = volPointerToPct(ev);
        audioEl.volume = pct;
        renderVolumeSegments();
      });
      let volDragging = false;
      volumeSeg.addEventListener('pointermove', (ev) => {
        if (!volActive || !volDragging) return;

        audioEl.volume = pct;
        renderVolumeSegments();
      });
      volumeSeg.addEventListener('pointerup', (ev) => { volDragging = false; try { volumeSeg.releasePointerCapture(ev.pointerId); } catch (e) {} });

      progressSeg.addEventListener('click', (ev) => {
        if (!progActive) return;
        const pct = progPointerToPct(ev);
        if (audioEl.duration) audioEl.currentTime = pct * audioEl.duration;
        renderProgressSegments();
      });
      volumeSeg.addEventListener('click', (ev) => {
        if (!volActive) return;
        const pct = volPointerToPct(ev);
        audioEl.volume = pct;
        renderVolumeSegments();
      });

      audioEl.addEventListener("timeupdate", () => {
        if (!audioEl.duration) { curTime.textContent = formatTime(0); return; }
        if (!progDragging && !progActive) renderProgressSegments();
        else if (!progDragging) renderProgressSegments();
      });
      audioEl.addEventListener("loadedmetadata", () => {
        durTime.textContent = formatTime(audioEl.duration || 0);
        renderProgressSegments();
      });
      audioEl.addEventListener("ended", () => { playNextTrack(); renderProgressSegments(); });

      muteBtn.addEventListener("click", () => {
        if ((audioEl.volume || 0) > 0) { lastVolume = audioEl.volume; audioEl.volume = 0; } else { audioEl.volume = lastVolume || 0.9; }
        renderVolumeSegments();
      });

      if (typeof audioEl.volume === 'number') {
        audioEl.volume = Number(volumeHidden.value || audioEl.volume || 0.9);
      }
      renderVolumeSegments();
      renderProgressSegments();

      barPlay.addEventListener("click", () => { togglePlayback(); });
      playPauseBtn.addEventListener("click", () => { togglePlayback(); });
      barPrev.addEventListener("click", playPreviousTrack);
      barNext.addEventListener("click", playNextTrack);

      if (typeof shuffleBtn !== 'undefined' && shuffleBtn) {

            playlist = shuffle ? shuffle(playlist) : playlist.sort(() => Math.random() - 0.5);

      nextBtn.addEventListener("click", playNextTrack);

      function togglePlayback() {

      // ---- Playlist dialog (unchanged, uses getSongsForGenre etc. from new functions) ----
      const playlistGrid = document.getElementById("playlistGrid");

      function showPlaylistDialog() {
        playlistGrid.innerHTML = "";

        const likedBackRow = document.createElement("div");

        likedBtn.onclick = async function() {
          hidePlaylistDialog();
          try {
            if (!isPlayingLiked) {
              lastPlaylist = Array.isArray(playlist) ? playlist.slice() : [];

              if (typeof loadLikedSongsFromServer === 'function') { await loadLikedSongsFromServer(); }

              var liked = (typeof getStoredLikedSongs === 'function') ? getStoredLikedSongs() : [];
              if (!liked) liked = [];

              if (typeof liked === 'string') liked = liked.split(',').map(s => s.trim());
              else if (Array.isArray(liked) && liked.length === 1 && typeof liked[0] === 'string' && liked[0].indexOf(',') !== -1) {
                liked = liked[0].split(',').map(s => s.trim());
              }

              liked = (Array.isArray(liked) ? liked : [])
                .map(function(s) { try { s = decodeURIComponent(s); } catch (e) {} return (typeof s === 'string') ? s.trim() : ''; })
                .map(function(s) { return s.replace(/\.(mp3|flac|ogg|wav|m4a)$/i, ''); })
                .filter(Boolean);

              if (!Array.isArray(liked) || liked.length === 0) {

                  lastPlaylist = null; }
                return;
              }

              playlist = (typeof shuffle === 'function') ? shuffle(liked.slice()) : liked.slice().sort(function() { return Math.random() - 0.5; });

              currentTrackIndex = 0;

              try { likedBtn.textContent = 'Play Last Playlist'; } catch (e) {}
              if (playlist.length && typeof loadAndPlay === 'function') loadAndPlay(0);

                } else if (Array.isArray(playlist) && playlist.length) { loadedProfileRadio = playlist.slice(); }
              } catch (err) { console.warn('restorePlaylistFromProfile failed', err); }

              if (Array.isArray(loadedProfileRadio) && loadedProfileRadio.length) {

                lastPlaylist = null;
                isPlayingLiked = false;
                try { likedBtn.textContent = 'Play my Liked Songs'; } catch (e) {}
                currentTrackIndex = 0;
                if (playlist.length && typeof loadAndPlay === 'function') loadAndPlay(0);
                try { var g = document.getElementById('genres'); if (g) g.style.display = ''; } catch (e) {}
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
              }

              if (Array.isArray(lastPlaylist) && lastPlaylist.length) {
                playlist = lastPlaylist.slice();
                lastPlaylist = null;
                isPlayingLiked = false;
                try { likedBtn.textContent = 'Play my Liked Songs'; } catch (e) {}
                if (playlist.length && typeof loadAndPlay === 'function') loadAndPlay(0);
              } else {
                alert('No profile-radio or previous playlist available to restore.');
              }
            }
          } catch (e) { console.error('likedBtn action failed', e); }
        };

        const backBtn = document.createElement("button");
        backBtn.textContent = "Back";
        backBtn.className = "btn-ctrl";
        backBtn.style.width = "48%";
        backBtn.onclick = hidePlaylistDialog;

        playlist.forEach((url, idx) => {

          const name = parts[parts.length - 1];
          const btn = document.createElement("button");
          btn.textContent = `${idx + 1}. ${stripKnownAudioExtension(name)}`;
          btn.className = "track-btn";
          btn.style.width = "100%";
          btn.style.margin = "6px 0";
          btn.onclick = () => { hidePlaylistDialog(); loadAndPlay(idx); };
          playlistGrid.appendChild(btn);

        patchExtraDialogContent();

      // ---- patchExtraDialogContent (unchanged, but uses getSongsForGenre) ----

      // ---- Exiled feature (unchanged) ----
      function cleanNameFromPath(p) {
        if (!p) return '';
        let n = (typeof basename === 'function') ? basename(p) : String(p).split('/').pop();
        try { n = decodeURIComponent(n); } catch (e) {}
        n = n.replace(/\.(mp3|flac|wav|m4a|aac|ogg)$/i, '');
        return n;
      }

      function isExiledSong(p) {
        try {
          if (!window.exiledSet) return false;
          const s = cleanNameFromPath(p).toLowerCase();
          return window.exiledSet.has(s);
        } catch (e) { return false; }
      }

      async function loadExiledFromServer(profile) {
        profile = profile || getActiveProfileName();
        try {
          if (typeof loadPlaylistFileFromServer === 'function') {
            const arr = await loadPlaylistFileFromServer(profile, 'ExiledSongs');
            return Array.isArray(arr) ? arr : [];
          }
        } catch (e) { console.warn('loadExiledFromServer', e); }
        return [];
      }

      async function saveExiledToServer(profile, arr) {
        profile = profile || getActiveProfileName();
        try {
          if (typeof savePlaylistFileToServer === 'function') {
            return await savePlaylistFileToServer(profile, 'ExiledSongs', arr);
          }
        } catch (e) { console.warn('saveExiledToServer', e); }
        return false;
      }

      async function appendExiledSong(profile, songPath) {
        profile = profile || getActiveProfileName();
        try {
          const bn = cleanNameFromPath(songPath);
          let arr = await loadExiledFromServer(profile) || [];
          const cleanedArr = arr.map(x => cleanNameFromPath(x).toLowerCase());
          if (cleanedArr.includes(bn.toLowerCase())) return true;
          arr.push(bn);
          await saveExiledToServer(profile, arr);
          return true;
        } catch (e) { console.warn('appendExiledSong', e); return false; }
      }

      async function refreshExiledCache(profile) {
        profile = profile || getActiveProfileName();
        try {
          const arr = await loadExiledFromServer(profile);
          window.exiledList = [];
          const seen = new Set();
          if (Array.isArray(arr)) {
            arr.forEach(it => {
              if (!it) return;
              const b = cleanNameFromPath(it);
              const key = String(b).toLowerCase();
              if (!seen.has(key)) { seen.add(key);
                window.exiledList.push(b); }
            });
          }
          window.exiledSet = new Set((window.exiledList || []).map(x => (typeof x === 'string' ? x.toLowerCase() : String(x).toLowerCase())));
          return window.exiledList;
        } catch (e) { console.warn('refreshExiledCache', e);
          window.exiledList = [];
          window.exiledSet = new Set(); return []; }
      }

      function filterOutExiled(arr) {
        if (!Array.isArray(arr)) return arr;
        const ex = window.exiledSet || new Set();
        if (!ex || ex.size === 0) return arr.slice();
        return arr.filter(item => {
          if (!item) return false;
          let b = (typeof basename === 'function') ? basename(item) : String(item).split('/').pop();
          try { b = decodeURIComponent(b); } catch (e) {}
          b = b.replace(/\.(mp3|flac|wav|m4a|aac|ogg)$/i, '');
          return !ex.has(String(b).toLowerCase());
        });
      }

      function tryWrapLoadPlaylistLoader() {
        if (typeof loadPlaylistFileFromServer !== 'function') return false;
        const orig = loadPlaylistFileFromServer;
        loadPlaylistFileFromServer = async function(profile, playlistSlug) {
          const res = await orig(profile, playlistSlug);
          try {
            if (!playlistSlug) return res;
            if (String(playlistSlug).toLowerCase() === 'exiledsongs') return res;
            return filterOutExiled(Array.isArray(res) ? res : []);
          } catch (e) { console.warn('wrapped loader filter error', e); return res; }
        };
        return true;
      }

      function tryWrapLoadAndPlay() {
        if (typeof loadAndPlay !== 'function') return false;
        const orig = loadAndPlay;
        loadAndPlay = function(index) {
          try {
            if (!Array.isArray(playlist) || !playlist.length) return orig(index);
            let idx = index;
            let tries = 0;
            while (playlist && playlist.length && isExiledSong(playlist[idx]) && tries < playlist.length) {
              idx = (idx + 1) % playlist.length;
              tries++;
            }
            if (tries >= playlist.length) { alert('No playable tracks (all exiled)'); return; }
            return orig(idx);
          } catch (e) { console.warn('wrapped loadAndPlay error', e); return orig(index); }
        };
        return true;
      }

      function updateCompactUI() {
        try {
          const pct = (audioEl.duration && audioEl.currentTime) ? Math.max(0, Math.min(1, (audioEl.currentTime || 0) / audioEl.duration)) : 0;
          if (progressFill) progressFill.style.width = (pct * 100) + '%';
          if (progressLine) progressLine.setAttribute('aria-valuenow', Math.round(pct * 100));
        } catch (e) {}

        try {
          const vol = Number(audioEl.volume) || 0;
          const volPct = Math.round(vol * 100 / 10) * 10;

        } catch (e) {}

      (function wireCompactToExistingRenders() {
        const origProgressRender = window.renderProgressSegments;
        if (typeof origProgressRender === 'function') {

            updateCompactUI(); };
        }

        const origVolumeRender = window.renderVolumeSegments;

          window.renderVolumeSegments = function patchedVolume() { origVolumeRender();
            updateCompactUI(); };

      })();

      if (progressLine) {
        progressLine.addEventListener('click', (ev) => {
          if (!audioEl.duration) return;
          const r = progressLine.getBoundingClientRect();
          const x = (ev.clientX !== undefined ? ev.clientX : (ev.touches && ev.touches[0] && ev.touches[0].clientX)) - r.left;
          const pct = Math.max(0, Math.min(1, x / r.width));
          audioEl.currentTime = pct * audioEl.duration;
          renderProgressSegments();
        });
        progressLine.addEventListener('keydown', (ev) => {
          if (!audioEl.duration) return;
          if (ev.key === 'ArrowLeft') { ev.preventDefault();
            audioEl.currentTime = Math.max(0, audioEl.currentTime - (audioEl.duration / PROG_COUNT));
            renderProgressSegments(); } else if (ev.key === 'ArrowRight') { ev.preventDefault();
            audioEl.currentTime = Math.min(audioEl.duration, audioEl.currentTime + (audioEl.duration / PROG_COUNT));
            renderProgressSegments(); }
        });
      }

      // ---- MediaSession update (preserved) ----
      async function updateMediaSessionForRaw(raw) {
        if (!raw) return;
        try {
          if (!('mediaSession' in navigator)) return;

          var artist = (typeof getArtistFromFilename === 'function') ? getArtistFromFilename(raw) : '';
          var title = (typeof getTitleFromFilename === 'function') ? getTitleFromFilename(raw) : '';

          if (!title) { try { title = stripKnownAudioExtension((raw.split('/').pop() || raw)); } catch (e) { title = raw; } }

          var imgPath = artist ? ('Music/Images/' + encodeURIComponent(artist) + '.jpg') : 'Music/Images/default.jpg';

          try { if (typeof audioEl !== 'undefined' && audioEl) { audioEl.title = title ? (artist ? (title + ' — ' + artist) : title) : ''; } } catch (e) {}

          var absImg = (new URL(imgPath, location.href)).href;
          var artworks = [
            { src: absImg, sizes: '96x96', type: 'image/jpeg' },
            { src: absImg, sizes: '192x192', type: 'image/jpeg' },
            { src: absImg, sizes: '512x512', type: 'image/jpeg' }
          ];

          try {
            navigator.mediaSession.metadata = new MediaMetadata({ title: title || 'Radio', artist: artist || '', album: '', artwork: artworks });
            navigator.mediaSession.playbackState = (audioEl && audioEl.paused) ? 'paused' : 'playing';
            try { navigator.mediaSession.setActionHandler('play', () => { audioEl && audioEl.play().catch(() => {}); }); } catch (e) {}
            try { navigator.mediaSession.setActionHandler('pause', () => { audioEl && audioEl.pause(); }); } catch (e) {}
            try { navigator.mediaSession.setActionHandler('previoustrack', () => { typeof playPreviousTrack === 'function' && playPreviousTrack(); }); } catch (e) {}
            try { navigator.mediaSession.setActionHandler('nexttrack', () => { typeof playNextTrack === 'function' && playNextTrack(); }); } catch (e) {}
          } catch (e) { console.warn('mediaSession metadata set failed', e); }

          try {
            const resp = await fetch(absImg, { cache: 'force-cache' });
            if (resp && resp.ok) {
              const blob = await resp.blob();
              const blobUrl = URL.createObjectURL(blob);
              const blobArt = [
                { src: blobUrl, sizes: '96x96', type: blob.type || 'image/jpeg' },
                { src: blobUrl, sizes: '192x192', type: blob.type || 'image/jpeg' },
                { src: blobUrl, sizes: '512x512', type: blob.type || 'image/jpeg' }
              ];
              try {
                navigator.mediaSession.metadata = new MediaMetadata({ title: title || 'Radio', artist: artist || '', album: '', artwork: blobArt });
              } catch (e) {}
            }
          } catch (e) {}
        } catch (err) { console.warn('updateMediaSessionForRaw error', err); }
      }

      // ---- Fullscreen scaling (preserved) ----
      function _applyFullscreenScale() {
        try {
          const contentW = Math.max(document.documentElement.scrollWidth, document.body.scrollWidth);
          const contentH = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
          const winW = window.innerWidth;
          const winH = window.innerHeight;
          if (!contentW || !contentH) return;
          const scale = Math.min(winW / contentW, winH / contentH, 1);
          document.body.style.transformOrigin = 'top left';
          document.body.style.transform = 'scale(' + scale + ')';
          document.body.style.width = contentW + 'px';
          document.body.style.height = contentH + 'px';
          document.documentElement.style.overflow = 'auto';
          document.body.style.overflow = 'auto';
        } catch (e) { console.warn('applyFullscreenScale failed', e); }
      }

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.title = `Select ${genre}`;
            checkbox.checked = false;
            checkbox.tabIndex = 0;
            div.appendChild(checkbox);
            allCheckboxes.push(checkbox);

            if (index === 0) firstCheckbox = checkbox;

            const openGenre = async () => {
              try {
                playlist = songs.slice();
                if (typeof shuffle === 'function') { playlist = shuffle(playlist); } else { playlist.sort(() => Math.random() - 0.5); }
                currentTrackIndex = 0;

              const isDown = (e.key === 'ArrowDown' || e.key === 'ArrowRight');
              const isUp = (e.key === 'ArrowUp' || e.key === 'ArrowLeft');
              if (!isDown && !isUp) return;

              e.preventDefault();
              let newIdx = idx;

              } else if (isUp) {
                newIdx = (idx - 1 + allFocusable.length) % allFocusable.length;
