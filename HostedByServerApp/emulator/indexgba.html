			// Choose the server files that match the current page scheme.
			// HTTPS pages must stay on HTTPS, and HTTP pages should stay on HTTP.
			// The filename tells us which combination to use:
			// - serverip.txt / tailscaleip.txt -> HTTP
			// - httpsserverip.txt / httpstailscaleip.txt -> HTTPS

			const pageScheme = location.protocol === 'https:' ? 'https' : 'http';
			let serverOrigin = location.origin || `${location.protocol}//${location.host}`;
			let serverIP = location.host || `${location.hostname}${location.port ? ':' + location.port : ''}`;

			function cleanAddress(value) {
				return String(value || '')
					.trim()
					.replace(/^['"]|['"]$/g, '')
					.replace(/\/+$/g, '');
			}

			function originCandidatesFromValue(rawValue, preferredScheme) {
				const cleaned = cleanAddress(rawValue);
				if (!cleaned) return [];

				const candidates = [];
				const addCandidate = (candidate) => {
					try {
						const url = new URL(candidate);
						const origin = url.origin;
						if (!candidates.includes(origin)) candidates.push(origin);
					} catch (_) {
						// ignore invalid candidates
					}
				};

				if (/^[a-z][a-z0-9+.-]*:\/\//i.test(cleaned)) {
					// Full URL provided.
					addCandidate(cleaned);
					const withoutScheme = cleaned.replace(/^[a-z][a-z0-9+.-]*:\/\//i, '');
					if (withoutScheme) {
						addCandidate(`${preferredScheme}://${withoutScheme}`);
					}
				} else {
					// Bare host:port or host path fragment.
					addCandidate(`${preferredScheme}://${cleaned}`);
				}

				return candidates;
			}

			// Tiny reachability probe using an Image (avoids CORS problems)
			function hostIsReachable(origin, timeout = 1500) {
				return new Promise((resolve) => {
					let done = false;
					const img = new Image();
					const timer = setTimeout(() => {
						if (done) return;
						done = true;
						img.src = '';
						resolve(false);
					}, timeout);

					img.onload = () => {
						if (done) return;
						done = true;
						clearTimeout(timer);
						resolve(true);
					};

					img.onerror = () => {
						if (done) return;
						done = true;
						clearTimeout(timer);
						resolve(false);
					};

					img.src = `${origin}/favicon.ico?ts=${Date.now()}`;
				});
			}

			async function chooseServerOrigin() {
				async function readFileTrim(path) {
					try {
						const r = await fetch(path, { cache: 'no-store' });
						if (!r.ok) return null;
						const t = (await r.text()).trim();
						return t || null;
					} catch (e) {
						return null;
					}
				}

				const sources = pageScheme === 'https'
					? [
						{ file: '/httpsserverip.txt', preferredScheme: 'https' },
						{ file: '/httpstailscaleip.txt', preferredScheme: 'https' },
					]
					: [
						{ file: '/serverip.txt', preferredScheme: 'http' },
						{ file: '/tailscaleip.txt', preferredScheme: 'http' },
					];

				for (const source of sources) {
					const value = await readFileTrim(source.file);
					if (!value) {
						console.warn(`${source.file} not found or empty`);
						continue;
					}

					console.log(`${source.file} contains:`, value);
					const candidates = originCandidatesFromValue(value, source.preferredScheme);

					for (const origin of candidates) {
						if (await hostIsReachable(origin)) {
							console.log(`Using ${source.file} value:`, origin);
							serverIP = new URL(origin).host;
							return origin;
						}
					}

					console.warn(`${source.file} value not reachable:`, value);
				}

				console.warn('Falling back to default origin:', serverOrigin);
				serverIP = new URL(serverOrigin).host;
				return serverOrigin;
			}

			try {
				serverOrigin = await chooseServerOrigin();
			} catch (e) {
				console.warn('Error choosing server origin — using default:', serverOrigin, e);
				serverIP = new URL(serverOrigin).host;
			}

			// ---- Helper: upload using unified API ----
			async function uploadState(slot, fileName, stateBytes) {
    while (typeof window.platformAPI === 'undefined') {
        await new Promise(resolve => setTimeout(resolve, 50));
    }
    const targetPath = `/emulator/${slot}/${encodeURIComponent(fileName)}`;
    const blob = new Blob([stateBytes], { type: 'application/octet-stream' });
    // Let platformAPI handle the upload (works on Windows, Android, Arduino, etc.)
    await platformAPI.uploadFile(blob, targetPath, serverOrigin);
    console.log('[uploadState] uploaded to', targetPath);
}

async function downloadState(slot, fileName) {
    while (typeof window.platformAPI === 'undefined') {
        await new Promise(resolve => setTimeout(resolve, 50));
    }
    const targetPath = `/emulator/${slot}/${encodeURIComponent(fileName)}`;
    const downloadUrl = await platformAPI.getDownloadUrl(serverOrigin, targetPath);
    console.log('[downloadState] Download URL:', downloadUrl);
    const response = await fetch(downloadUrl, { cache: 'no-store' });
    if (!response.ok) throw new Error(`Failed to fetch save: ${response.status}`);
    const arrayBuffer = await response.arrayBuffer();
    return new Uint8Array(arrayBuffer);
}

				// ---- Link Cable Save handler ----
				function waitForRomBaseReady(emulator, timeoutMs = 15000) {
					const started = Date.now();
					const clean = (value) => String(value || '').replace(/\.(gba|gbc|gb|zip|7z|rar)$/i, '').trim();

					return new Promise((resolve, reject) => {
						const tick = () => {
							try {
								const rawBase = (emulator && typeof emulator.getBaseFileName === 'function')
									? emulator.getBaseFileName()
									: (emulator && emulator.romName) || '';
								const cleanBase = clean(rawBase);

								if (cleanBase) {
									resolve(cleanBase);
									return;
								}
							} catch (e) {}

							if (Date.now() - started >= timeoutMs) {
								reject(new Error('Timed out waiting for ROM to finish loading'));
								return;
							}
							setTimeout(tick, 250);
						};
						tick();
					});
				}

				document.getElementById("loadLinkCable").onclick = async () => {
					loadDialog.style.display = 'none';
					try {
						console.log("[LinkLoad] start import SRM flow");
						const emulator = window.EJS_emulator || (window.EJS_getInstance ? window.EJS_getInstance(0) : null);
						if (!emulator) throw new Error("Emulator instance not found");

						const profile = localStorage.getItem("activeProfile") || "Guest";
						const cleanBase = await waitForRomBaseReady(emulator);
						const srmFileName = `${profile}-${cleanBase}.srm`;
						const srmUrl = `/emulator/netplay/${encodeURIComponent(srmFileName)}`;

						console.log("[LinkLoad] profile:", profile, "base:", cleanBase, "srmFileName:", srmFileName, "url:", srmUrl);

						// fetch SRM
						const res = await fetch(srmUrl, { cache: 'no-store' });
						if (!res.ok) throw new Error(`Failed to fetch SRM: ${res.status} ${res.statusText}`);
						const srmBytes = new Uint8Array(await res.arrayBuffer());
						console.log("[LinkLoad] downloaded SRM bytes:", srmBytes.length);

						// FS reference (try emulator.Module.FS first, then global Module.FS)
						const FS = (emulator.Module && emulator.Module.FS) ? emulator.Module.FS : (window.Module && window.Module.FS ? window.Module.FS : null);
						if (!FS) throw new Error("Emulator FS not available (Module.FS not found)");
						console.log("[LinkLoad] found FS");

						// get save path(s) candidate list:
						const candidates = [];

						// 1) try gameManager.getSaveFilePath() if available (best candidate)
						try {
							if (emulator.gameManager && typeof emulator.gameManager.getSaveFilePath === 'function') {
								const reported = emulator.gameManager.getSaveFilePath();
								if (reported) {
									console.log("[LinkLoad] gameManager.getSaveFilePath() =>", reported);
									candidates.push(reported);
								}
							}
						} catch (e) {
							console.warn("[LinkLoad] getSaveFilePath error:", e);
						}

						// 2) common emulator save dirs / fallback locations
						candidates.push(`/data/saves/${srmFileName}`);
						candidates.push(`/data/saves/mGBA/${srmFileName}`);
						candidates.push(`/saves/${srmFileName}`);
						candidates.push(`/${srmFileName}`);
						candidates.push(`/persistent/${srmFileName}`);

						// 3) also try plain basename (no profile) because some cores expect just <basename>.srm
						const plainName = `${cleanBase}.srm`;
						candidates.push(`/data/saves/${plainName}`);
						candidates.push(`/saves/${plainName}`);
						candidates.push(`/${plainName}`);

						// dedupe while preserving order
						const seen = new Set();
						const uniqCandidates = candidates.filter(p => { if (seen.has(p)) return false; seen.add(p); return true; });
						console.log("[LinkLoad] candidate paths:", uniqCandidates);

						// helper to mkdir -p within FS
						const mkdirp = (path) => {
							const parts = path.split('/').filter(Boolean);
							let cur = '';
							for (const p of parts.slice(0, -1)) { // create directories only (skip file part)
								cur += '/' + p;
								try { FS.mkdir(cur); } catch (e) { /* ignore if exists */ }
							}
						};

						// Try writing to each candidate until one verifies OK (we will still write to all to be safe)
						const writeResults = [];
						for (const dest of uniqCandidates) {
							try {
								mkdirp(dest);
								try { FS.unlink(dest); } catch (_) {}
								FS.writeFile(dest, srmBytes);
								// Attempt to persist if IDBFS is mounted at any ancestor
								if (typeof FS.syncfs === 'function') {
									await new Promise((resolve, reject) => FS.syncfs(false, (err) => err ? reject(err) : resolve()));
								}
								// read back and compare length (simple verification)
								let readBack = null;
								try {
									readBack = FS.readFile(dest);
								} catch (e) {
									// reading might fail if path isn't used by FS bindings; continue
								}
								const ok = readBack && readBack.length === srmBytes.length;
								writeResults.push({ dest, ok, readBackLen: readBack ? readBack.length : 0 });
								console.log(`[LinkLoad] wrote/read verify -> ${dest} ok=${ok} readLen=${readBack ? readBack.length : 0}`);
							} catch (e) {
								writeResults.push({ dest, ok: false, error: String(e) });
								console.warn("[LinkLoad] failed write to", dest, e);
							}
						}

						// Summarize results in console so you can inspect
						console.log("[LinkLoad] writeResults:", writeResults);

						// Now attempt core helpers that make it re-scan / use battery files
						try {
							if (emulator.gameManager && typeof emulator.gameManager.loadSaveFiles === 'function') {
								await emulator.gameManager.loadSaveFiles();
								console.log("[LinkLoad] called gameManager.loadSaveFiles()");
							} else if (emulator.gameManager && typeof emulator.gameManager.saveSaveFiles === 'function') {
								await emulator.gameManager.saveSaveFiles();
								console.log("[LinkLoad] called gameManager.saveSaveFiles()");
							} else {
								console.log("[LinkLoad] no gameManager save/load helper found");
							}
						} catch (e) {
							console.warn("[LinkLoad] error calling save/load helper:", e);
						}

						// Optionally, call a core-specific load battery function if exposed (best-effort)
						try {
							if (emulator.gameManager && typeof emulator.gameManager.loadBattery === 'function') {
								emulator.gameManager.loadBattery();
								console.log("[LinkLoad] called gameManager.loadBattery()");
							}
						} catch (e) {
							// ignore if not present
						}

						// Final step: restart emulator to force core to read battery file
						try {
							if (emulator.gameManager && typeof emulator.gameManager.restart === 'function') {
								emulator.gameManager.restart();
								console.log("[LinkLoad] called gameManager.restart()");
							} else {
								console.log("[LinkLoad] restart helper not present, reloading page as fallback");
							}
						} catch (e) {
							console.warn("[LinkLoad] restart failed:", e);
						}

						alert("Imported Link Cable save. Check console (LinkLoad logs) to verify the path that was written and whether verification succeeded.");
					} catch (err) {
						console.error("[LinkLoad] import failed:", err);
						alert(`Link Cable Load failed: ${err.message}`);
					}
				};

							if (label) container.insertBefore(clone, label);
							else container.appendChild(clone);

						// Try immediate append; if container not present yet, observe DOM and try again
						if (!tryAppend()) {
							const mo = new MutationObserver(() => {
								if (tryAppend()) mo.disconnect();
							});
							mo.observe(document.body, { childList: true, subtree: true });

							try { msgObj = JSON.parse(msgObj); } catch (err) { /* keep string */ }
						}
						const incomingPlayer = (msgObj && (typeof msgObj.player === 'number' || (typeof msgObj.player === 'string' && /^\d+$/.test(msgObj.player))))
							? Number(msgObj.player)
							: (typeof dc._assignedSlot === 'number' ? dc._assignedSlot : null);
						if (incomingPlayer !== null) {
							const evSeq = (msgObj && (typeof msgObj.seq === 'number')) ? msgObj.seq : null;
							if (evSeq !== null) {
								const last = lastSeqForSlot[incomingPlayer] || 0;
								if (evSeq <= last) {
									return;
								}
								lastSeqForSlot[incomingPlayer] = evSeq;
							}
							if (msgObj && typeof msgObj.player === 'undefined') msgObj.player = incomingPlayer;
							if (arguments && arguments.length) arguments[0] = msgObj;
						}
					} catch (err) {
						// non-fatal, fall back to original behavior
					}
					try {
						if (typeof orig === 'function') {
							try { orig.call(dc, ev); } catch(e) { if (window.__NETPLAY_SHIM_VERBOSE) console.warn('[netplay-shim] orig dc.onmessage failed', e); }
						}
					} catch(e) {
						if (window.__NETPLAY_SHIM_VERBOSE) console.warn('[netplay-shim] wrapped dc.onmessage error', e);
					}
				};
				dc.__netplay_shim_wrapped = true;
				if (window.__NETPLAY_SHIM_VERBOSE) console.log('[netplay-shim] wrapped dc.onmessage', dc);
			}

			const checker = setInterval(function(){
				try {
					if (window.npw && window.npw.dc) wrapDc(window.npw.dc);
					if (window.netplay && window.netplay.dc) wrapDc(window.netplay.dc);
					for (const k of ['dc','peerConnection','dataChannel']) {
						if (window[k] && window[k].onmessage && !window[k].__netplay_shim_wrapped) wrapDc(window[k]);
					}
				} catch(e){}
			}, 500);

			if (window.__NETPLAY_SHIM_VERBOSE) console.log('[netplay-shim] installed netplayInject helper. Use window.netplayInject(playerIndex, keyOrButton, pressed) to inject input.');
		})();

		// --- Auto-open Link Cable Save when returning from a dual session ---
		(function installLoadLinkCableReferral() {
			try {
				const params = new URLSearchParams(window.location.search);
				const referral = params.get('referral') || sessionStorage.getItem('mgbaDualLoadReferral');
				if (referral !== 'loadLinkCable') return;
				sessionStorage.setItem('mgbaDualLoadReferral', 'loadLinkCable');
				try {
					params.delete('referral');
					const qs = params.toString();
					const cleanUrl = `${location.pathname}${qs ? `?${qs}` : ''}${location.hash || ''}`;
					history.replaceState(null, '', cleanUrl);
				} catch (e) {}
				const started = Date.now();
				const tick = () => {
					const btn = document.getElementById('loadLinkCable');
					const emulator = window.EJS_emulator || (typeof window.EJS_getInstance === 'function' ? window.EJS_getInstance(0) : null);
					const romBaseReady = !!(emulator && typeof emulator.getBaseFileName === 'function' && String(emulator.getBaseFileName() || '').trim());
					if (btn && romBaseReady) {
						try { sessionStorage.removeItem('mgbaDualLoadReferral'); } catch (e) {}
						btn.click();
						return;
					}
					if (Date.now() - started < 15000) setTimeout(tick, 250);
				};
				tick();
			} catch (e) {
				console.warn('Referral auto-load failed:', e);
			}
		})();

		// --- Toggle Link-Trade UI via window.linkTradeCableButtons ---
		(function manageLinkTradeUI(){
			const css = `
				body.link-trade-disabled #toggleLink,
				body.link-trade-disabled #loadLinkCable,
				body.link-trade-disabled [data-ejs-link-cable],
				body.link-trade-disabled .link-trade-toggle {
					display: none !important;
					visibility: hidden !important;
					pointer-events: none !important;
				}
				body.link-trade-disabled #toggleShared {
					grid-column: 1 / -1 !important;
					justify-self: center !important;
				}
			`;
			const style = document.createElement('style');
			style.setAttribute('data-ejs-link-trade-style', '1');
			style.textContent = css;
			document.head && document.head.appendChild(style);

			function updateUI(enabled) {
				const disabled = !enabled;
				if (disabled) {
					document.body.classList.add('link-trade-disabled');
					console.info('Link-Trade UI: DISABLED');
				} else {
					document.body.classList.remove('link-trade-disabled');
					console.info('Link-Trade UI: ENABLED');
				}
			}

			(function makeFlagReactive(){
				const existing = Object.getOwnPropertyDescriptor(window, 'linkTradeCableButtons');
				if (existing && !existing.configurable) {
					updateUI(Boolean(window.linkTradeCableButtons));
					return;
				}
				let _val = (typeof window.linkTradeCableButtons !== 'undefined') ? Boolean(window.linkTradeCableButtons) : true;
				updateUI(_val);
				Object.defineProperty(window, 'linkTradeCableButtons', {
					configurable: true,
					enumerable: true,
					get() { return _val; },
					set(v) {
						_val = Boolean(v);
						updateUI(_val);
					}
				});
			})();

			const mo = new MutationObserver(() => {
				updateUI(Boolean(window.linkTradeCableButtons));
			});
			mo.observe(document.documentElement || document.body, { childList: true, subtree: true });
			updateUI(Boolean(window.linkTradeCableButtons));
		})();
	</script>
