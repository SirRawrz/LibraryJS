<script>
(function() {
    // ---------- CONFIGURATION ----------
    const BASE = "https://raw.githubusercontent.com/SirRawrz/LibraryJS-Content-Shells/main/";
    const CATALOG_URL = BASE + "catalog.json";

    let COLLECTION_SHELLS = [];

    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("searchInput");
    let shells = [];

    // Modal DOM refs
    const collectionModal = document.getElementById("collectionModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalBody = document.getElementById("modalBody");
    const modalCloseBtn = document.getElementById("modalCloseBtn");

    const restoreModal = document.getElementById("restoreModal");
    const restoreModalTitle = document.getElementById("restoreModalTitle");
    const progressLabel = document.getElementById("progressLabel");
    const progressBar = document.getElementById("progressBar");
    const statusText = document.getElementById("statusText");
    const restoreModalCloseBtn = document.getElementById("restoreModalCloseBtn");

    // ---------- Helper: Zip parsing (simplified from transfer-backup.html) ----------
    function readUInt16(view, offset) { return view.getUint16(offset, true); }
    function readUInt32(view, offset) { return view.getUint32(offset, true); }

    async function inflateRaw(bytes) {
        if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('deflate-raw');
            const stream = new Blob([bytes]).stream().pipeThrough(ds);
            return new Uint8Array(await new Response(stream).arrayBuffer());
        }
        throw new Error('Deflate not supported in this browser.');
    }

    async function parseZip(file) {
        const buf = await file.arrayBuffer();
        const bytes = new Uint8Array(buf);
        const view = new DataView(buf);

        let eocd = -1;
        for (let i = bytes.length - 22; i >= 0; i--) {
            if (readUInt32(view, i) === 0x06054b50) { eocd = i; break; }
        }
        if (eocd < 0) throw new Error('ZIP EOCD not found');

        const entryCount = readUInt16(view, eocd + 10);
        const centralOffset = readUInt32(view, eocd + 16);
        const entries = [];
        let ptr = centralOffset;
        for (let n = 0; n < entryCount; n++) {
            if (readUInt32(view, ptr) !== 0x02014b50) throw new Error('Invalid central dir');
            const method = readUInt16(view, ptr + 10);
            const compressedSize = readUInt32(view, ptr + 20);
            const nameLen = readUInt16(view, ptr + 28);
            const extraLen = readUInt16(view, ptr + 30);
            const commentLen = readUInt16(view, ptr + 32);
            const localHeaderOffset = readUInt32(view, ptr + 42);
            const nameBytes = bytes.slice(ptr + 46, ptr + 46 + nameLen);
            const name = new TextDecoder().decode(nameBytes);
            entries.push({ name, method, compressedSize, localHeaderOffset });
            ptr += 46 + nameLen + extraLen + commentLen;
        }

        const result = new Map();
        for (const entry of entries) {
            const lh = entry.localHeaderOffset;
            if (readUInt32(view, lh) !== 0x04034b50) throw new Error('Invalid local header');
            const nameLen = readUInt16(view, lh + 26);
            const extraLen = readUInt16(view, lh + 28);
            const dataStart = lh + 30 + nameLen + extraLen;
            const raw = bytes.slice(dataStart, dataStart + entry.compressedSize);
            let fileBytes;
            if (entry.method === 0) fileBytes = raw;
            else if (entry.method === 8) fileBytes = await inflateRaw(raw);
            else throw new Error(`Unsupported compression method ${entry.method}`);
            result.set(entry.name, fileBytes);
        }
        return result;
    }

    // ---------- Helper: Zip creation (from transfer-backup.html) ----------
    function crc32(bytes) {
        let crc = ~0 >>> 0;
        for (let i = 0; i < bytes.length; i++) {
            crc ^= bytes[i];
            for (let k = 0; k < 8; k++) {
                crc = (crc >>> 1) ^ (0xEDB88320 & -(crc & 1));
            }
        }
        return (~crc) >>> 0;
    }

    function concatBytes(parts) {
        const total = parts.reduce((n, p) => n + p.length, 0);
        const out = new Uint8Array(total);
        let offset = 0;
        for (const p of parts) { out.set(p, offset); offset += p.length; }
        return out;
    }

    function makeZip(files) {
        const enc = new TextEncoder();
        const localParts = [];
        const centralParts = [];
        let offset = 0;

        for (const file of files) {
            const nameBytes = enc.encode(file.name);
            const dataBytes = file.bytes instanceof Uint8Array ? file.bytes : enc.encode(String(file.content ?? ''));
            const crc = crc32(dataBytes);

            const local = new Uint8Array(30 + nameBytes.length + dataBytes.length);
            const ldv = new DataView(local.buffer);
            ldv.setUint32(0, 0x04034b50, true);
            ldv.setUint16(4, 20, true);
            ldv.setUint16(6, 0x0800, true);
            ldv.setUint16(8, 0, true);
            ldv.setUint16(10, 0, true);
            ldv.setUint16(12, 0, true);
            ldv.setUint32(14, crc, true);
            ldv.setUint32(18, dataBytes.length, true);
            ldv.setUint32(22, dataBytes.length, true);
            ldv.setUint16(26, nameBytes.length, true);
            ldv.setUint16(28, 0, true);
            local.set(nameBytes, 30);
            local.set(dataBytes, 30 + nameBytes.length);
            localParts.push(local);

            const central = new Uint8Array(46 + nameBytes.length);
            const cdv = new DataView(central.buffer);
            cdv.setUint32(0, 0x02014b50, true);
            cdv.setUint16(4, 20, true);
            cdv.setUint16(6, 20, true);
            cdv.setUint16(8, 0x0800, true);
            cdv.setUint16(10, 0, true);
            cdv.setUint16(12, 0, true);
            cdv.setUint16(14, 0, true);
            cdv.setUint32(16, crc, true);
            cdv.setUint32(20, dataBytes.length, true);
            cdv.setUint32(24, dataBytes.length, true);
            cdv.setUint16(28, nameBytes.length, true);
            cdv.setUint16(30, 0, true);
            cdv.setUint16(32, 0, true);
            cdv.setUint16(34, 0, true);
            cdv.setUint16(36, 0, true);
            cdv.setUint32(38, 0, true);
            cdv.setUint32(42, offset, true);
            central.set(nameBytes, 46);
            centralParts.push(central);

            offset += local.length;
        }

        const centralBytes = concatBytes(centralParts);
        const end = new Uint8Array(22);
        const edv = new DataView(end.buffer);
        edv.setUint32(0, 0x06054b50, true);
        edv.setUint16(4, 0, true);
        edv.setUint16(6, 0, true);
        edv.setUint16(8, files.length, true);
        edv.setUint16(10, files.length, true);
        edv.setUint32(12, centralBytes.length, true);
        edv.setUint32(16, offset, true);
        edv.setUint16(20, 0, true);

        return concatBytes([...localParts, centralBytes, end]);
    }

    // ---------- Helper: find balanced block ----------
    function findBalancedBlock(source, openIndex, openChar, closeChar) {
        if (openIndex < 0 || openIndex >= source.length) return null;
        let depth = 0;
        let state = 'code';
        let quote = '';
        let escape = false;
        let regexClass = false;
        let expectRegex = true;

        function setExpectFromChar(ch) {
            if (/\s/.test(ch)) return;
            if (/[\w$\]]/.test(ch)) { expectRegex = false; return; }
            if (/[)\}]/.test(ch)) { expectRegex = false; return; }
            if (/[\(\[\{,;:\?!=<>~&|+\-*%^]/.test(ch) || ch === '.') { expectRegex = true; return; }
            expectRegex = true;
        }

        for (let i = openIndex; i < source.length; i++) {
            const ch = source[i];
            const next = source[i+1];
            if (state === 'lineComment') {
                if (ch === '\n') state = 'code';
                continue;
            }
            if (state === 'blockComment') {
                if (ch === '*' && next === '/') { state = 'code'; i++; }
                continue;
            }
            if (state === 'string') {
                if (escape) { escape = false; continue; }
                if (ch === '\\') { escape = true; continue; }
                if (ch === quote) { state = 'code'; expectRegex = false; }
                continue;
            }
            if (state === 'template') {
                if (escape) { escape = false; continue; }
                if (ch === '\\') { escape = true; continue; }
                if (ch === '`') { state = 'code'; expectRegex = false; }
                continue;
            }
            if (state === 'regex') {
                if (escape) { escape = false; continue; }
                if (ch === '\\') { escape = true; continue; }
                if (ch === '[') { regexClass = true; continue; }
                if (ch === ']') { regexClass = false; continue; }
                if (ch === '/' && !regexClass) { state = 'code'; expectRegex = false; continue; }
                continue;
            }
            if (ch === '/' && next === '/') { state = 'lineComment'; i++; continue; }
            if (ch === '/' && next === '*') { state = 'blockComment'; i++; continue; }
            if (ch === '"' || ch === "'" || ch === '`') {
                state = ch === '`' ? 'template' : 'string';
                quote = ch;
                continue;
            }
            if (ch === '/' && expectRegex) { state = 'regex'; regexClass = false; continue; }
            if (ch === openChar) { depth++; expectRegex = true; continue; }
            if (ch === closeChar) {
                depth--;
                if (depth === 0) return source.slice(openIndex, i+1);
                expectRegex = false;
                continue;
            }
            setExpectFromChar(ch);
        }
        return null;
    }

    function extractFunctionBlock(text, fnName) {
        const idx = text.search(new RegExp(`function\\s+${fnName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`));
        if (idx < 0) return null;
        const open = text.indexOf('{', idx);
        if (open < 0) return null;
        const block = findBalancedBlock(text, open, '{', '}');
        return block ? text.slice(idx, open + block.length) : null;
    }

    function extractLibraryBlock(text, key) {
        const re = new RegExp(`(?:^|\\n)([ \\t]*)("${key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}"|'${key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}')\\s*:\\s*\\[`);
        const match = re.exec(text);
        if (!match) return null;
        const openIndex = text.indexOf('[', match.index + match[0].length - 1);
        if (openIndex < 0) return null;
        const block = findBalancedBlock(text, openIndex, '[', ']');
        return block ? text.slice(match.index, openIndex + block.length) : null;
    }

    // ---------- Helper: detect collections from loadseasonfunctions.js ----------
    async function fetchCollectionsFromLoader() {
        try {
            const res = await fetch('./loadseasonfunctions.js', { cache: 'no-store' });
            if (!res.ok) return [];
            const text = await res.text();
            // parse loaders (simplified: find function blocks with switch)
            const re = /function\s+(load[A-Za-z0-9_]+seasons?)\s*\(\)\s*\{/gi;
            const collections = [];
            let m;
            while ((m = re.exec(text)) !== null) {
                const fnName = m[1];
                const block = extractFunctionBlock(text, fnName);
                if (block && /switch\s*\(/.test(block)) {
                    // extract title from function name (same as loaderDisplayName)
                    const title = fnName.replace(/^load/i, '').replace(/seasons?$/i, '')
                        .replace(/ApOsTrOpHe/g, "'")
                        .replace(/AmPeRsAnD/g, '&')
                        .replace(/PeRiOd/g, '.')
                        .replace(/CoMmA/g, ',')
                        .replace(/ExClAmAtIoN/g, '!')
                        .replace(/HyPhEn/g, '-')
                        .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
                        .trim();
                    collections.push(title);
                }
            }
            return collections;
        } catch {
            return [];
        }
    }

    // ---------- Installation using hidden iframe (same as original) ----------
    function installZipBlob(zipBlob, shellName) {
        restoreModal.classList.add('active');
        restoreModalTitle.textContent = `Adding ${shellName} to Library…`;
        progressLabel.textContent = 'Preparing…';
        progressBar.style.width = '0%';
        statusText.textContent = '';

        // Create a hidden iframe pointing to shell-restore.html
        const iframe = document.createElement('iframe');
        iframe.style.position = 'absolute';
        iframe.style.left = '-9999px';
        iframe.style.top = '-9999px';
        iframe.style.width = '1px';
        iframe.style.height = '1px';
        iframe.style.border = 'none';
        document.body.appendChild(iframe);
        let currentIframe = iframe;

        // Listen for messages from the hidden iframe
        let messageListener = function(event) {
            if (event.source !== iframe.contentWindow) return;
            if (!event.data || event.data.flow !== "restore") return;

            const data = event.data;
            if (data.type === "libraryjs-flow-progress" || data.type === "libraryjs-flow-status") {
                const done = data.done || 0;
                const total = data.total || 1;
                const pct = total ? Math.min(100, (done / total) * 100) : 0;
                progressBar.style.width = `${pct}%`;
                if (data.label || data.status || data.message) {
                    progressLabel.textContent = data.label || data.status || data.message;
                }
                if (data.status || data.message) {
                    statusText.textContent = data.status || data.message;
                }
            } else if (data.type === "libraryjs-flow-complete") {
                progressBar.style.width = '100%';
                progressLabel.textContent = 'Restore complete!';
                statusText.textContent = data.status || data.message || `${shellName} has been added to the library.`;
                // Clean up
                if (currentIframe) {
                    currentIframe.remove();
                    currentIframe = null;
                }
                if (messageListener) {
                    window.removeEventListener("message", messageListener);
                    messageListener = null;
                }
            }
        };
        window.addEventListener("message", messageListener);

        iframe.src = "./shell-restore.html?flow=1&auto=1&contentMode=merge";
        iframe.addEventListener("load", function injectAndStart() {
            try {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                if (!iframeDoc) {
                    statusText.textContent = "Could not access iframe. Check same-origin policy.";
                    return;
                }
                const fileInput = iframeDoc.getElementById("zipFile");
                if (!fileInput) {
                    statusText.textContent = "shell‑restore page missing file input.";
                    return;
                }
                // Convert Blob to File before adding to DataTransfer
                const zipFile = new File([zipBlob], `${shellName}-shell.zip`, { type: "application/zip" });
                const dt = new DataTransfer();
                dt.items.add(zipFile);
                fileInput.files = dt.files;
                fileInput.dispatchEvent(new Event("change", { bubbles: true }));
                progressLabel.textContent = "Scanning and restoring…";
            } catch (e) {
                statusText.textContent = "Error communicating with restore page: " + e.message;
            }
            iframe.removeEventListener("load", injectAndStart);
        });
    }

    // ---------- Collection shell: show sub‑items ----------
    async function showCollectionItems(shellName) {
        const encoded = encodeURIComponent(shellName);
        const zipUrl = `${BASE}shell/${encoded}/${encoded}-shell.zip`;

        collectionModal.classList.add('active');
        modalTitle.textContent = `Items in ${shellName}`;
        modalBody.innerHTML = '<div class="loader"></div>';

        try {
            const resp = await fetch(zipUrl);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const zipBytes = await resp.arrayBuffer();
            const fileObj = new File([zipBytes], 'temp.zip', { type: 'application/zip' });
            const entries = await parseZip(fileObj);

            // Parse loadseasonfunctions.js to get the seasons array
            const loadseasonBytes = entries.get('loadseasonfunctions.js');
            if (!loadseasonBytes) throw new Error('No loadseasonfunctions.js in shell');
            const loadseasonText = new TextDecoder().decode(loadseasonBytes);

            // Find the seasons array for the root function (e.g., loadMoviesSeasons)
            const fnName = `load${shellName.replace(/\s/g, '')}Seasons`; // crude
            const fnBlock = extractFunctionBlock(loadseasonText, fnName);
            if (!fnBlock) throw new Error(`Could not find function ${fnName}`);
            const seasonsMatch = fnBlock.match(/const\s+seasons\s*=\s*\[([\s\S]*?)\]\s*;/);
            if (!seasonsMatch) throw new Error('No seasons array found');
            const seasonItems = eval(`[${seasonsMatch[1]}]`);

            // Build sub‑grid
            modalBody.innerHTML = `<div class="sub-grid" id="subGrid"></div>`;
            const subGrid = document.getElementById('subGrid');

            const libraryBytes = entries.get('library.js');
            const libraryText = libraryBytes ? new TextDecoder().decode(libraryBytes) : '';

            for (const item of seasonItems) {
                const card = document.createElement('div');
                card.className = 'sub-card';

                // Try to get poster from inside the zip: ./<shellName>/<item>/<item>.jpg
                const posterPath = `./${shellName}/${item}/${item}.jpg`;
                const posterBytes = entries.get(posterPath) || entries.get(`${item}/${item}.jpg`) || entries.get(`${item}.jpg`);
                const img = document.createElement('img');
                if (posterBytes) {
                    const blob = new Blob([posterBytes]);
                    img.src = URL.createObjectURL(blob);
                } else {
                    img.src = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22450%22%3E%3Crect fill=%22%232a2a2e%22 width=%22300%22 height=%22450%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2214%22%3ENo Poster%3C/text%3E%3C/svg%3E';
                }
                img.alt = item;
                card.appendChild(img);

                const titleDiv = document.createElement('div');
                titleDiv.className = 'sub-title';
                titleDiv.textContent = item;
                card.appendChild(titleDiv);

                card.addEventListener('click', async () => {
                    // Build a minimal zip for this item
                    const newZipFiles = [];

                    // 1. mainfolders.js: just this item
                    newZipFiles.push({ name: 'mainfolders.js', content: `const folders = ["${item}"];` });

                    // 2. library.js: extract the block for this item
                    if (libraryText) {
                        const libBlock = extractLibraryBlock(libraryText, item);
                        if (libBlock) {
                            newZipFiles.push({ name: 'library.js', content: `const episodes = {\n${libBlock}\n};` });
                        }
                    }

                    // 3. loadseasonfunctions.js: extract the function for this item (if any)
                    const targetFn = `load${item.replace(/\s/g, '')}Seasons`;
                    const fnBlock = extractFunctionBlock(loadseasonText, targetFn);
                    if (fnBlock) {
                        newZipFiles.push({ name: 'loadseasonfunctions.js', content: fnBlock });
                    }

                    // 4. Poster for this item
                    if (posterBytes) {
                        // Use the same path as in the original shell
                        newZipFiles.push({ name: posterPath, bytes: posterBytes });
                    }

                    // Create zip and install
                    const newZipBytes = makeZip(newZipFiles);
                    const blob = new Blob([newZipBytes], { type: 'application/zip' });
                    // Close the collection modal
                    collectionModal.classList.remove('active');
                    // Install using the hidden iframe
                    installZipBlob(blob, item);
                });

                subGrid.appendChild(card);
            }

        } catch (err) {
            modalBody.innerHTML = `<div class="empty-message">Error loading items: ${err.message}</div>`;
        }
    }

    // ---------- Render cards ----------
    function renderCards(filterText = "") {
        const term = filterText.toLowerCase().trim();
        const filtered = term ? shells.filter(s => s.name.toLowerCase().includes(term)) : shells;

        grid.innerHTML = "";
        if (!shells.length) {
            grid.innerHTML = `<div class="loader"></div>`;
            return;
        }
        if (filtered.length === 0) {
            grid.innerHTML = `<div class="empty-message">No shells found for “${term}”</div>`;
            return;
        }

        filtered.forEach(shell => {
            const encoded = encodeURIComponent(shell.name);
            const posterUrl = `${BASE}shell/${encoded}/poster.jpg`;

            const card = document.createElement("div");
            card.className = "card";

            // Check if this shell is a collection (from the dynamically loaded list)
            const isCollection = COLLECTION_SHELLS.includes(shell.name);

            card.addEventListener("click", async (e) => {
                if (isCollection) {
                    await showCollectionItems(shell.name);
                } else {
                    // Normal install: fetch full shell zip and install
                    const zipUrl = `${BASE}shell/${encoded}/${encoded}-shell.zip`;
                    const resp = await fetch(zipUrl);
                    if (!resp.ok) {
                        alert(`Failed to fetch shell: HTTP ${resp.status}`);
                        return;
                    }
                    const zipBytes = await resp.arrayBuffer();
                    const blob = new Blob([zipBytes], { type: 'application/zip' });
                    installZipBlob(blob, shell.name);
                }
            });

            card.innerHTML = `
                <img src="${posterUrl}" 
                     alt="${shell.name}" 
                     loading="lazy"
                     onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22450%22%3E%3Crect fill=%22%232a2a2e%22 width=%22300%22 height=%22450%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2214%22%3ENo Poster%3C/text%3E%3C/svg%3E'">
                <div class="card-body">
                    <div class="card-title">${shell.name}</div>
                </div>
            `;

            grid.appendChild(card);
        });
    }

    // ---------- Fetch catalog and collections ----------
    async function loadCatalog() {
        // Load collections from loadseasonfunctions.js
        try {
            COLLECTION_SHELLS = await fetchCollectionsFromLoader();
            console.log('📋 Auto-detected collections:', COLLECTION_SHELLS);
        } catch (e) {
            console.warn('Could not detect collections, using empty list.');
            COLLECTION_SHELLS = [];
        }

        try {
            const response = await fetch(CATALOG_URL);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            if (!Array.isArray(data)) throw new Error("Catalog is not an array");
            shells = data.filter(item => item && typeof item.name === "string");
            renderCards();
        } catch (error) {
            console.error("Failed to load catalog:", error);
            grid.innerHTML = `
                <div class="empty-message">
                    ❌ Could not load the catalog.<br>
                    <small>Check that <code>catalog.json</code> exists at the root of the repository.</small><br>
                    <small style="color:#888">${error.message}</small>
                </div>`;
        }
    }

    // ---------- Event listeners ----------
    searchInput.addEventListener("input", () => renderCards(searchInput.value));

    modalCloseBtn.addEventListener("click", () => {
        collectionModal.classList.remove('active');
    });
    collectionModal.addEventListener("click", (e) => {
        if (e.target === collectionModal) collectionModal.classList.remove('active');
    });

    restoreModalCloseBtn.addEventListener("click", () => {
        restoreModal.classList.remove('active');
    });

    // ---------- Start ----------
    loadCatalog();
})();
</script>
