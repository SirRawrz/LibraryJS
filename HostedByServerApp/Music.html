<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player</title>
  <script src="./loadplatform.js"></script>
  <script src="./screensaver.js"></script>
  <script src="./loadlocalexpanded.js"></script>
  <script src="./loadexpanded.js"></script>
  <style>
    /* TOAST & MODAL OVERLAYS */
    #sys-toast {
      position: fixed;
      right: 18px;
      bottom: 22px;
      min-width: 200px;
      max-width: 420px;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(0,0,0,0.86);
      color: #fff;
      font-size: 14px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.35);
      z-index: 99999;
      display: none;
      opacity: 0;
      transition: opacity .22s ease, transform .22s ease;
      transform: translateY(6px);
      pointer-events: none;
    }
    #sys-toast.show { display: block; opacity: 1; transform: translateY(0); pointer-events: auto; }

    #sys-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100000;
    }
    #sys-modal-overlay.show { display: flex; }

    #sys-modal {
      background: #111;
      color: #fff;
      min-width: 320px;
      max-width: 720px;
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6);
      font-family: Arial, sans-serif;
    }
    #sys-modal h3 { margin:0 0 8px 0; font-size:16px; }
    #sys-modal p { margin:0 0 14px 0; line-height:1.3; color: #ddd; }
    #sys-modal .btns { display:flex; gap:10px; justify-content:flex-end; }
    #sys-modal button { padding:8px 12px; border-radius:6px; border: none; cursor:pointer; font-weight:600; }
    #sys-modal .btn-primary { background: #2f8cff; color:#fff; }
    #sys-modal .btn-secondary { background: #333; color:#fff; }

    /* TYPOGRAPHY & SPACING */
    :root {
      --music-h1-desktop: 36px;
      --music-h1-mobile: 76px;
    }
    h1 { color: #fff; margin-top: var(--music-h1-desktop); }
    @media (max-width:700px) and (orientation: portrait) {
      h1 { margin-top: var(--music-h1-mobile); padding-top: 4px; }
    }
    h2 { color: #fff; }
    .genre p { font-weight: bold; margin-top: 5px; color: #fff; }
    #currentSong { color: #ffffff; }

    body {
      font-family: Arial, sans-serif;
      background-color: #B34700;
      color: #1ABC9C;
      margin: 0;
      padding: 5px;
      text-align: center;
      position: relative;
    }

    /* CONTAINERS & GENRES */
    .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
    .genre { text-align: center; width: 150px; cursor: pointer; position: relative; }
    .genre img { width: 150px; height: 150px; object-fit: cover; border-radius: 10px; }
    .genre input { position: absolute; top: 5px; right: 5px; transform: scale(2.3); transform-origin: top right; }

    .music-player { margin-top: 20px; }

    /* BUTTONS */
    .home-button, .toggle-button {
      position: absolute;
      top: 10px;
      padding: 10px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background-color: #333;
      color: #fff;
    }
    .home-button { left: 10px; }
    .toggle-button { right: 10px; }

    #playSelectedButton .full-text { display: inline; }
    #playSelectedButton .short-text { display: none; }
    #playSelectedButton .mini-checkbox {
      display: inline-block;
      width: 18px;
      height: 18px;
      line-height: 18px;
      font-size: 13px;
      text-align: center;
      border-radius: 3px;
      vertical-align: middle;
      margin-left: 6px;
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    }
    @media (orientation: portrait) and (max-width: 640px) {
      #playSelectedButton { min-width: 48px; padding: 6px 8px; white-space: nowrap; }
      #playSelectedButton .full-text { display: none; }
      #playSelectedButton .short-text { display: inline; }
      #playSelectedButton .mini-checkbox { width: 16px; height: 16px; line-height:16px; font-size:12px; margin-left:4px; }
    }

    .button-style {
      padding: 5px; font-size: 12px; cursor: pointer; border: none; border-radius: 5px;
      background-color: #333; color: #fff; margin: 1px; transition: background-color 0.3s ease;
    }
    .button-style:hover, .home-button:hover, .toggle-button:hover { background-color: #555; }
    .button-style.small { padding: 5px 9px; font-size: 14px; border-radius: 8px; }

    #loopButton.active {
      background-color: rgba(47,111,109,0.92) !important;
      color: #ffffff !important;
      display: inline-flex; align-items: center; justify-content: center;
      box-sizing: border-box; padding: inherit; height: inherit; min-width: inherit;
      font-size: inherit; border-radius: inherit; border: none; cursor: pointer;
      transition: background-color 180ms ease, color 180ms ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.22);
    }
    #loopAButton, #loopBButton { color: #fff !important; text-shadow: 0 1px 0 rgba(0,0,0,0.6); }
    #loopAButton.active, #loopBButton.active { background-color: #f39c12; color: #fff !important; text-shadow: 0 1px 0 rgba(0,0,0,0.6); }

    /* LISTS & ARTIST SEARCH */
    #playlistOrder { list-style: none; padding: 0; max-width: 300px; margin: 20px auto; max-height: 300px; overflow-y: auto; scrollbar-width: none; }
    #playlistOrder::-webkit-scrollbar { display: none; }
    #playlistOrder li { padding: 4px 8px; color: #fff; }
    #playlistOrder li.active { font-weight: bold; background-color: #444; border-radius: 4px; }
    
    #likedSongsList, #manageLikesList { list-style: none; padding: 0; }
    #likedSongsList li { font-weight: bold; color: #1ABC9C; }
    
    #artistSearchResults { padding-top: 35px; box-sizing: border-box; }
    #selectAllGenresCheckbox { margin-right: 6px; transform: scale(1.6); transform-origin: center; cursor: pointer; outline: none; accent-color: #1ABC9C; }
    
    #artist-search-top { position: absolute; top: 52px; right: 10px; display: flex; align-items: center; gap: 8px; z-index: 999; pointer-events: auto; }
    #artist-search-top #artistSearchInput { width: 160px; padding: 8px; font-size: 12px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.12); color: #fff; outline: none; }
    #artist-search-top #clearArtistSearchBtn { padding: 8px 10px; font-size: 14px; }

    /* Glass overlay for artist search */
    .search-input-wrapper {
      position: relative;
      display: inline-block;
    }
    .search-glass-overlay {
      position: absolute;
      inset: 0;
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      cursor: text;
      z-index: 2;
      border-radius: 4px;
      outline: none;
    }
    .search-glass-overlay:focus {
      outline: 2px solid rgba(255, 215, 0, 0.6);
      outline-offset: 2px;
    }
    .search-glass-overlay:focus-visible {
      outline: 2px solid rgba(255, 215, 0, 0.8);
    }
    /* Hide caret when input is readonly */
    #artistSearchInput[readonly],
    #songSearchInput[readonly] {
      caret-color: transparent;
    }
    /* Song search wrapper */
    .song-search-wrapper {
      position: relative;
      display: inline-block;
    }

    /* Glass overlay for sliders – mouse/touch passes through */
    .slider-wrapper {
      position: relative;
      display: inline-block;
      flex: 1 1 0;
      min-width: 0;
    }
    .slider-glass-overlay {
      position: absolute;
      inset: 0;
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      pointer-events: none;   /* mouse/touch pass through to range */
      z-index: 2;
      border-radius: 999px;
      outline: none;
    }
    .slider-glass-overlay:focus {
      outline: 2px solid rgba(255, 215, 0, 0.6);
      outline-offset: 2px;
    }
    .slider-glass-overlay:focus-visible {
      outline: 2px solid rgba(255, 215, 0, 0.8);
    }
    /* When slider is active, the glass is hidden from pointer events */
    .slider-wrapper.active .slider-glass-overlay {
      pointer-events: none;
      cursor: default;
    }
    .slider-wrapper.active input[type="range"] {
      z-index: 3;
      position: relative;
    }

    #top-control-bar { display: flex; align-items: center; gap: 8px; padding: 6px; flex-wrap: nowrap; white-space: nowrap; }
    #top-control-bar img, #top-control-bar button { flex-shrink: 0; }
    #artistSearchInput { flex: 1; }

    /* ARTIST CAROUSEL (9 Images) */
    #artistCarousel {
      width: 520px; max-width: calc(100% - 20px); height: 300px; margin: 8px auto; position: relative;
      display: flex; align-items: center; justify-content: center; perspective: 1200px; pointer-events: none;
    }
    #artistCarousel img {
      transition: transform 300ms cubic-bezier(.2,.9,.2,1), opacity 300ms ease, filter 300ms ease;
      border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,0.55); object-fit: cover;
      user-select: none; -webkit-user-drag: none; position: absolute; pointer-events: auto;
    }
    #artistCarousel img.center {
      width: 260px; height: 260px; z-index: 6; opacity: 1; cursor: default; left: 50%; top: 50%;
      transform-origin: center center; transform: translate(-50%, -50%) translateZ(0px) scale(1);
    }
    #artistCarousel img.prev1 { width: 200px; height: 200px; z-index: 5; left: 50%; top: 50%; transform: translate(-50%, -50%) translateX(-90px) translateZ(-10px) rotateY(10deg) scale(0.92); opacity: 0.98; }
    #artistCarousel img.prev2 { width: 160px; height: 160px; z-index: 4; left: 50%; top: 50%; transform: translate(-50%, -50%) translateX(-160px) translateZ(-25px) rotateY(10deg) scale(0.86); opacity: 0.92; }
    #artistCarousel img.prev3 { width: 130px; height: 130px; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%) translateX(-230px) translateZ(-45px) rotateY(10deg) scale(0.78); opacity: 0.86; }
    #artistCarousel img.prev4 { width: 110px; height: 110px; z-index: 2; left: 50%; top: 50%; transform: translate(-50%, -50%) translateX(-290px) translateZ(-65px) rotateY(10deg) scale(0.70); opacity: 0.80; }
    #artistCarousel img.next1 { width: 200px; height: 200px; z-index: 5; left: 50%; top: 50%; transform: translate(-50%, -50%) translateX(90px) translateZ(-10px) rotateY(-10deg) scale(0.92); opacity: 0.98; }
    #artistCarousel img.next2 { width: 160px; height: 160px; z-index: 4; left: 50%; top: 50%; transform: translate(-50%, -50%) translateX(160px) translateZ(-25px) rotateY(-10deg) scale(0.86); opacity: 0.92; }
    #artistCarousel img.next3 { width: 130px; height: 130px; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%) translateX(230px) translateZ(-45px) rotateY(-10deg) scale(0.78); opacity: 0.86; }
    #artistCarousel img.next4 { width: 110px; height: 110px; z-index: 2; left: 50%; top: 50%; transform: translate(-50%, -50%) translateX(290px) translateZ(-65px) rotateY(-10deg) scale(0.70); opacity: 0.80; }
    #artistCarousel img:hover { filter: saturate(1) brightness(1.03); box-shadow: 0 10px 24px rgba(0,0,0,0.65); }
    @media (max-width: 900px) {
      #artistCarousel { height: 260px; }
      #artistCarousel img.center { width: 220px; height: 220px; transform: translate(-50%, -50%) translateZ(0px) scale(1); }
      #artistCarousel img.prev3, #artistCarousel img.next3, #artistCarousel img.prev4, #artistCarousel img.next4 { display: none; }
    }
    @media (max-width: 600px) {
      #artistCarousel { height: 200px; }
      #artistCarousel img.center { width: 180px; height: 180px; }
      #artistCarousel img.prev2, #artistCarousel img.next2, #artistCarousel img.prev3, #artistCarousel img.next3, #artistCarousel img.prev4, #artistCarousel img.next4 { display: none; }
    }

    /* PLAYER BAR LAYOUT */
    .player-bar {
      position: fixed; bottom: calc(env(safe-area-inset-bottom, 12px) + 56px); left: 50%; transform: translateX(-50%);
      width: 92%; max-width: 1200px; border-radius: 12px; z-index: 1200; box-sizing: border-box;
      background: linear-gradient(180deg, rgba(51,51,51,0.28), rgba(51,51,51,0.18));
      box-shadow: 0 8px 22px rgba(0,0,0,0.18); border: 1px solid rgba(255,255,255,0.015); backdrop-filter: blur(4px);
      transition: all 260ms cubic-bezier(.2,.9,.2,1); display: flex; flex-direction: column; padding: 2px 6px;
    }
    .player-top { width: 100%; display: flex; gap: 6px; align-items: flex-end; box-sizing: border-box; padding: 0; }
    .player-left { flex: 0 0 auto; display: flex; align-items: flex-end; justify-content: flex-start; gap: 6px; padding-left: 2px; }
    .player-left .btn-ctrl { font-size: 20px; padding: 6px 8px; min-width: 48px; min-height: 48px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; }
    .player-left .btn-ctrl#barPlay { font-size: 22px; padding: 8px 10px; }
    .player-mid { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-align: center; padding: 0 6px 2px 6px; min-width: 0; }
    .nowPlayingLabel { font-size: 11px; text-transform: uppercase; opacity: 0.85; margin-bottom: 2px; color: #ddd; }
    #songTitle { font-size: 20px; font-weight: 800; line-height: 1.05; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; max-width: 100%; margin-bottom: 2px; color: #fff; }
    #artistName { font-size: 14px; opacity: 0.9; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; max-width: 100%; margin-bottom: 2px; color: #fff; }
    .player-right { flex: 0 0 10%; display: flex; align-items: flex-end; justify-content: flex-end; padding-right: 2px; }
    .player-right img { width: 72px; height: 72px; border-radius: 8px; object-fit: cover; display: block; margin: 0; }
    
    .player-bottom { width: 100%; display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: 2px; box-sizing: border-box; padding: 2px 0 4px 0; }
    .bottom-left { display: flex; align-items: center; gap: 8px; flex: 1 1 0; min-width: 0; }
    .progress-row { display: flex; align-items: center; gap: 8px; flex: 1 1 0; min-width: 0; }
    .slider-wrapper { flex: 1 1 0; min-width: 40px; }
    .progress { -webkit-appearance: none; appearance: none; height: 12px; border-radius: 999px; outline: none; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,0.02); background: linear-gradient(90deg,#2b2b2b,#1f1f1f); width: 100%; }
    .progress::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 6px 12px rgba(0,0,0,0.35); border: 2px solid rgba(0,0,0,0.18); }
    .time { font-size: 13px; color: rgba(255,255,255,0.8); min-width: 48px; text-align: center; }
    .vol-range { -webkit-appearance: none; appearance: none; height: 8px; border-radius: 999px; background: linear-gradient(90deg,#444,#222); width: 100%; }
    .vol-range::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 6px 12px rgba(0,0,0,0.35); }
    
    .btn-ctrl { background: linear-gradient(180deg,#111,#0d0d0d); color: #fff; border: none; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; }
    .btn-ctrl.small { padding: 6px 8px; font-size: 13px; }

    @media (max-width:700px) {
      .player-top { flex-direction: column; gap: 6px; align-items: center; padding: 2px 0; }
      .player-left { order: 1; width: 100%; justify-content: center; padding-left: 0; align-items: center; }
      .player-mid { order: 2; width: 100%; padding: 0 8px 2px 8px; justify-content: center; }
      .player-right { order: 3; width: 100%; justify-content: center; align-items: center; padding-right: 0; }
      .player-right img { width: 64px; height: 64px; }
      #songTitle { font-size: 18px; }
      .vol-range { width: 90px; margin-left: 0; }
      .player-bottom { flex-direction: column; align-items: stretch; gap: 6px; margin-top: 6px; }
    }

    /* MINIFIED PLAYER STATE */
    .player-bar.minified {
      width: auto !important; max-width: 360px !important; left: auto !important; right: 18px !important;
      transform: none !important; bottom: calc(env(safe-area-inset-bottom, 12px) + 62px) !important;
      padding: 8px 10px !important; border-radius: 10px !important; flex-direction: row !important;
      align-items: center !important; gap: 8px !important; box-shadow: 0 10px 26px rgba(0,0,0,0.35) !important;
    }
    .player-bar.minified .player-mid, .player-bar.minified .player-bottom { display: none !important; opacity: 0; height: 0; overflow: hidden; }
    .player-bar.minified .player-top { display: flex !important; align-items: center !important; gap: 8px !important; width: auto !important; }
    .player-bar.minified .player-left { flex: 0 0 auto !important; display: flex !important; gap: 6px !important; align-items: center !important; }
    .player-bar.minified .player-left .btn-ctrl { padding: 6px 8px !important; min-width: 40px !important; min-height: 40px !important; font-size: 18px !important; border-radius: 8px !important; }
    .player-bar.minified .player-right { flex: 0 0 auto !important; display: flex !important; align-items: center !important; justify-content: center !important; padding-left: 6px !important; }
    .player-bar.minified .player-right img { width: 56px !important; height: 56px !important; border-radius: 6px !important; object-fit: cover !important; cursor: pointer !important; box-shadow: 0 6px 18px rgba(0,0,0,0.34) !important; }
    .player-top, .player-bottom, .player-mid { transition: opacity 200ms ease, transform 200ms ease, height 200ms ease; }

    /* PLAYLIST DIALOGS */
    #playlistDialog {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80vw; max-width: 920px;
      max-height: 80vh; background-color: rgba(0,0,0,0.96); padding: 20px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.04); z-index: 3000; display: none; color: #fff;
      overflow-y: auto; box-shadow: 0 12px 30px rgba(0,0,0,0.65);
    }
    #dialogOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.45); z-index: 2500; display: none; }
    #playlistGrid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .playlist-tiles-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
    .playlist-tile { width: 120px; text-align: center; color: #fff; cursor: pointer; position: relative; }
    .playlist-tile img { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; display: block; }
    .playlist-tile .tile-name { margin-top: 8px; font-size: 13px; }
    .playlist-add-square { width: 120px; height: 120px; background: #222; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #ddd; }
    
    #managePlaylistDialog {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); background: #0e0e0e; padding: 14px;
      border-radius: 8px; z-index: 4000; width: 92%; max-width: 640px; display: none; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    #managePlaylistDialog .cover-preview { width: 120px; height: 120px; object-fit: cover; border-radius: 6px; }
    #managePlaylistDialog .song-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    #managePlaylistDialog .name { flex: 1; margin-right: 8px; color: #fff; font-size: 13px; }
    #managePlaylistDialog .close-btn { position: absolute; right: 8px; top: 8px; background: transparent; color: #fff; border: none; font-size: 18px; cursor: pointer; }
    
    .playlist-tile .add-to-btn {
      position: absolute; right: 4px; bottom: 28px; background: rgba(0,0,0,0.6); color: #fff; border: none;
      border-radius: 6px; padding: 6px 18px; cursor: pointer; font-weight: 700; line-height: 1; user-select: none; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .playlist-tile .add-to-btn:active { transform: translateY(1px); }
    
    @media (max-width:700px) { #playlistDialog { width: 94vw; max-height: 86vh; padding: 12px; } .playlist-tiles-row { justify-content: flex-start; } }
  </style>
</head>
<body>
  <div id="sys-toast" role="status" aria-live="polite"></div>

  <!-- confirm modal -->
  <div id="sys-modal-overlay" aria-hidden="true">
    <div id="sys-modal" role="dialog" aria-modal="true" aria-labelledby="sys-modal-title">
      <h3 id="sys-modal-title">Confirm</h3>
      <p id="sys-modal-message"></p>
      <div class="btns">
        <button class="btn-secondary" id="sys-modal-no">Cancel</button>
        <button class="btn-primary" id="sys-modal-yes">OK</button>
      </div>
    </div>
  </div>

  <!-- Right-aligned Artist search bar with glass overlay -->
  <div id="artist-search-top" aria-label="Artist search controls">
    <input type="checkbox" id="selectAllGenresCheckbox" title="Select / clear all genres" aria-label="Select all genres" />
    <div class="search-input-wrapper">
      <input type="text" id="artistSearchInput" placeholder="Search artists..." autocomplete="off" readonly tabindex="-1" />
      <button class="search-glass-overlay" id="artistSearchGlass" aria-label="Search artists (press Enter to edit)" tabindex="0"></button>
    </div>
    <button id="clearArtistSearchBtn" class="button-style" title="Clear artist search">✕</button>
  </div>

  <div id="top-control-bar">
    <div id="artistSearchResults" class="container" style="display:none; margin: 6px auto 12px auto; max-width: 200px; justify-content:flex-start;"></div>
  </div>

  <h1>Music Library</h1>

  <div id="home-container" style="display: flex; align-items: center; margin-bottom: 14px;">
    <button class="home-button" onclick="window.location.href='./index.html'">Home</button>
    <!-- Profile icon will be injected here -->
  </div>

  <button id="fullscreenButton" class="toggle-button" style="right: 8px;" onclick="toggleFullscreen()">Fullscreen</button>

  <button id="toggleArtistsButton" class="toggle-button" style="right: 224px;" onclick="toggleArtists()">Artists</button>

  <button id="playSelectedButton" class="toggle-button" style="right: 105px;" onclick="playSelectedShuffled()" aria-label="Play selected songs" title="Play selected songs">
    <span class="full-text">Play Selected</span>
    <span class="short-text" aria-hidden="true">Play <span class="mini-checkbox">☑</span></span>
  </button>

  <button id="toggleGenresButton" class="toggle-button" style="right: 290px;" onclick="toggleGenres()">Genres</button>

  <div id="genres" class="container"></div>
  <div id="artists" class="container" style="display:none"></div>

    <script>
      (function(){
        function preHyphen(text){ if(!text) return ''; return (text.split(/[-–—]/)[0] || text).trim(); }
        function applyTrim(){
          var el = document.getElementById('songTitle');
          if(!el) return;
          var raw = el.textContent || '';
          var trimmed = preHyphen(raw);
          if(trimmed !== raw.trim()){ el.textContent = trimmed; }
        }
        var titleEl = document.getElementById('songTitle');
        if(titleEl){
          applyTrim();
          var obs = new MutationObserver(function(){ applyTrim(); });
          obs.observe(titleEl, { childList: true, characterData: true, subtree: true });
          var wrap = document.getElementById('nowPlayingWrap');
          if(wrap){
            var wrapObs = new MutationObserver(function(){ setTimeout(applyTrim, 10); });
            wrapObs.observe(wrap, { childList: true, subtree: true });
          }
          var intval = setInterval(applyTrim, 700);
          window.addEventListener('beforeunload', function(){
            try{ obs.disconnect(); }catch(e){}
            try{ wrapObs && wrapObs.disconnect(); }catch(e){}
            clearInterval(intval);
          });
        }
      })();
    </script>

  <script>
    // ====== Playlist integration (unchanged) ======
    (function(){
      function basename(p){
        try {
          const n = String(p || '').split('/').pop();
          try { return decodeURIComponent(n); } catch (e) { return n; }
        } catch (e) { return String(p || ''); }
      }

      async function tryFetchUrl(url) {
        try {
          const r = await fetch(url, { cache: 'no-store' });
          if (!r || !r.ok) return null;
          const t = await r.text();
          const tripleMatch = t.match(/\[\[\[([\s\S]*?)\]\]\]/);
          if (tripleMatch && tripleMatch[1]) {
            try {
              const parsed = JSON.parse(tripleMatch[1]);
              if (Array.isArray(parsed)) return flattenStoredList(parsed);
            } catch (e) { }
          }
          const extractFirstJsonArray = (text) => {
            if (!text || typeof text !== 'string') return null;
            for (let i = 0; i < text.length; i++) {
              if (text[i] === '[') {
                let depth = 0;
                for (let j = i; j < text.length; j++) {
                  if (text[j] === '[') depth++;
                  else if (text[j] === ']') {
                    depth--;
                    if (depth === 0) return text.slice(i, j + 1);
                  }
                }
                break;
              }
            }
            return null;
          };
          const arrSlice = extractFirstJsonArray(t);
          if (arrSlice) {
            try {
              const parsed = JSON.parse(arrSlice);
              if (Array.isArray(parsed) && parsed.length === 1 && Array.isArray(parsed[0])) return flattenStoredList(parsed[0]);
              if (Array.isArray(parsed)) return flattenStoredList(parsed);
            } catch (e) { }
          }
          try {
            const whole = JSON.parse(t);
            if (Array.isArray(whole)) return flattenStoredList(whole);
          } catch (e) { }
          return null;
        } catch (e) { return null; }
      }

      async function loadPlaylistFileFromServer(profile, playlistSlug) {
        profile = profile || getActiveProfileName();
        if (!playlistSlug) return [];
        const fileName = `${profile}-${playlistSlug}.txt`;
        let tried = [];
        const p1 = `/Profiles/${encodeURIComponent(fileName)}?_=${Date.now()}`;
        tried.push(p1);
        let res = await tryFetchUrl(p1);
        if (Array.isArray(res)) return normalizeLoadedPlaylist(res);
        const p2 = `/Profiles/${encodeURIComponent(profile + '-' + playlistSlug)}?_=${Date.now()}`;
        tried.push(p2);
        res = await tryFetchUrl(p2);
        if (Array.isArray(res)) return normalizeLoadedPlaylist(res);
        try {
          const androidPath = `/Profiles/${encodeURIComponent(fileName)}?_=${Date.now()}`;
          res = await tryFetchUrl(androidPath);
          if (Array.isArray(res)) return res.map(basename);
        } catch(e){}
        return [];
      }

      async function savePlaylistFileToServer(profile, playlistSlug, arr) {
        profile = profile || getActiveProfileName();
        if (!playlistSlug) return false;
        const fileName = `${profile}-${playlistSlug}.txt`;
        const basenames = (Array.isArray(arr) ? arr : []).map(a => {
          if (!a) return a;
          try { return String(a).split('/').pop(); } catch (e) { return a; }
        });
        const sanitized = `[[[\n${JSON.stringify(basenames, null, 2)}\n]]]`;
        const payloadBlob = new Blob([sanitized], { type: 'text/plain' });
        const targetPath = `/Profiles/${encodeURIComponent(fileName)}`;
        try {
          await platformAPI.upload(payloadBlob, targetPath);
          console.log(`[savePlaylistFileToServer] uploaded ${targetPath}`);
          return true;
        } catch (e) {
          console.error('[savePlaylistFileToServer] upload failed:', e);
          return false;
        }
      }

      async function loadMasterPlaylistsFromServer(profile) {
        profile = profile || getActiveProfileName();
        const fileName = `${profile}-playlists.txt`;
        const url = `/Profiles/${encodeURIComponent(fileName)}?_=${Date.now()}`;
        const arr = await tryFetchUrl(url);
        if (Array.isArray(arr)) return flattenStoredList(arr);
        const url2 = `/Profiles/${encodeURIComponent(profile + '-playlists')}?_=${Date.now()}`;
        const arr2 = await tryFetchUrl(url2);
        if (Array.isArray(arr2)) return flattenStoredList(arr2);
        return [];
      }

      async function saveMasterPlaylistsToServer(profile, arr) {
        profile = profile || getActiveProfileName();
        const fileName = `${profile}-playlists.txt`;
        const sanitized = `[[[\n${JSON.stringify(arr, null, 2)}\n]]]`;
        const payloadBlob = new Blob([sanitized], { type: 'text/plain' });
        const targetPath = `/Profiles/${encodeURIComponent(fileName)}`;
        try {
          await platformAPI.upload(payloadBlob, targetPath);
          console.log(`[saveMasterPlaylistsToServer] uploaded ${targetPath}`);
          return true;
        } catch (e) {
          console.error('[saveMasterPlaylistsToServer] upload failed:', e);
          return false;
        }
      }

      async function uploadPlaylistImage(profile, playlistSlug, file) {
        const ext = (file && file.name && file.name.match(/\.\w+$/)) ? file.name.match(/\.\w+$/)[0] : '.jpg';
        const targetName = `${playlistSlug}${ext}`;
        const targetPath = `/Music/Images/${encodeURIComponent(targetName)}`;
        try {
          await platformAPI.upload(file, targetPath);
          console.log(`[uploadPlaylistImage] uploaded ${targetPath}`);
          return true;
        } catch (e) {
          console.error('[uploadPlaylistImage] upload failed:', e);
          return false;
        }
      }

      function hashString(s) {
        let h = 0;
        if (!s) return 0;
        for (let i = 0; i < s.length; i++) {
          h = ((h << 5) - h) + s.charCodeAt(i);
          h |= 0;
        }
        return h;
      }

      async function checkPlaylistImageUrl(profile, slug, index) {
        profile = profile || getActiveProfileName();
        if (!slug) return 'Music/Images/default.jpg';
        const base = `/Music/Images/${encodeURIComponent(slug)}`;
        try { const j = await fetch(base + '.jpg', { method: 'HEAD' }); if (j && j.ok) return base + '.jpg'; } catch (e) { }
        try { const p = await fetch(base + '.png', { method: 'HEAD' }); if (p && p.ok) return base + '.png'; } catch (e) { }
        const idx = (typeof index === 'number') ? ((index % 15) + 1) : (Math.abs(hashString(slug) % 15) + 1);
        const fallback = `/Music/Images/playlist${idx}.jpg`;
        try { const f = await fetch(fallback, { method: 'HEAD' }); if (f && f.ok) return fallback; } catch (e) { }
        return 'Music/Images/default.jpg';
      }

      function sanitizePlaylistName(s) {
        if (!s) return null;
        return String(s).trim().replace(/[^a-z0-9\-_\s]/gi, '').replace(/\s+/g, '-').toLowerCase();
      }

      async function appendSongToPlaylist(profile, playlistSlug, songPath) {
        profile = profile || getActiveProfileName();
        if (!playlistSlug || !songPath) return false;
        const songName = normalizeSongBase(songPath);
        try {
          const arr = await loadPlaylistFileFromServer(profile, playlistSlug) || [];
          if (!Array.isArray(arr)) return false;
          if (arr.find(x => (x||'').split('/').pop() === songName)) return true;
          arr.push(songName);
          const ok = await savePlaylistFileToServer(profile, playlistSlug, arr);
          if (ok) {
            try {
              if (Array.isArray(window.currentPlaylist)) {
                const norm = /^https?:\/\//i.test(songPath) || songPath.startsWith('/') ? songPath : (songPath.startsWith('Music/') ? songPath : ('Music/' + songPath));
                window.currentPlaylist.push(norm);
              }
            } catch(e){}
          }
          return ok;
        } catch(e){
          console.warn('appendSongToPlaylist failed', e);
          return false;
        }
      }

      const playlistGrid = document.getElementById('playlistGrid');
      const playlistDialog = document.getElementById('playlistDialog');
      const dialogOverlay = document.getElementById('dialogOverlay');

      function hidePlaylistDialog(){
        try { playlistDialog.style.display = 'none'; dialogOverlay.style.display = 'none'; } catch(e){}
        try { document.getElementById('managePlaylistDialog').style.display = 'none'; } catch(e){}
      }
      dialogOverlay && dialogOverlay.addEventListener('click', hidePlaylistDialog);

      async function renderPlaylistTiles(){
        if (!playlistGrid) return;
        playlistGrid.innerHTML = '';
        const topRow = document.createElement('div');
        topRow.style.display = 'flex';
        topRow.style.justifyContent = 'space-between';
        topRow.style.marginBottom = '12px';

        const backBtn = document.createElement('button');
        backBtn.className = 'button-style';
        backBtn.textContent = 'Close';
        backBtn.onclick = hidePlaylistDialog;
        topRow.appendChild(backBtn);

        const addBtn = document.createElement('button');
        addBtn.className = 'button-style';
        addBtn.textContent = 'New Playlist';
        addBtn.onclick = async function(){
          const name = prompt('New playlist name:');
          if (!name) return;
          const slug = sanitizePlaylistName(name);
          if (!slug) { alert('Invalid playlist name'); return; }
          const profile = getActiveProfileName();
          let master = await loadMasterPlaylistsFromServer(profile) || [];
          if (!Array.isArray(master)) master = [];
          if (!master.includes(slug)) {
            master.push(slug);
            await saveMasterPlaylistsToServer(profile, master);
            await savePlaylistFileToServer(profile, slug, []);
          }
          await loadAndRenderMaster();
        };
        topRow.appendChild(addBtn);
        playlistGrid.appendChild(topRow);

        const tilesRow = document.createElement('div');
        tilesRow.className = 'playlist-tiles-row';
        tilesRow.id = 'playlistTilesRow';
        playlistGrid.appendChild(tilesRow);

        const likedTile = document.createElement('div');
        likedTile.className = 'playlist-tile';
        likedTile.tabIndex = 0;
        likedTile.setAttribute('role','button');
        likedTile.innerHTML = `<div class="playlist-add-square">♥<div style="font-size:11px;margin-top:6px;">Liked Songs</div></div><div class="tile-name">Liked Songs</div>`;
        likedTile.addEventListener('click', async (ev)=>{
          hidePlaylistDialog();
          try { playLikedSongs(); } catch(e){ console.warn(e); }
        });
        tilesRow.appendChild(likedTile);

        async function loadAndRenderMaster(){
          const profile = getActiveProfileName();
          let master = await loadMasterPlaylistsFromServer(profile) || [];
          if (!Array.isArray(master)) master = [];
          tilesRow.innerHTML = '';
          tilesRow.appendChild(likedTile);
          for (let i = 0; i < master.length; i++){
            const pl = master[i];
            try {
              const tile = document.createElement('div');
              tile.className = 'playlist-tile';
              tile.tabIndex = 0;
              tile.setAttribute('role','button');

              const img = document.createElement('img');
              img.alt = pl;
              img.onerror = function(){ this.onerror=null; this.src = 'Music/Images/default.jpg'; };
              checkPlaylistImageUrl(getActiveProfileName(), pl, i).then(url => { img.src = url; }).catch(()=>{ img.src='Music/Images/default.jpg'; });

              tile.appendChild(img);
              const name = document.createElement('div');
              name.className = 'tile-name';
              name.textContent = pl;
              tile.appendChild(name);

              tile.addEventListener('click', async (ev)=>{
                ev.stopPropagation();
                const arr = await loadPlaylistFileFromServer(getActiveProfileName(), pl);
                if (!Array.isArray(arr) || arr.length === 0) { alert('Playlist empty or not found.'); return; }
                currentPlaylist = normalizeLoadedPlaylist(arr);
                currentSongIndex = 0;
                currentGenre = 'Playlist: ' + pl;
                const playerEl = document.getElementById('player');
                if (playerEl) playerEl.style.display = 'block';
                hideGenresAndArtists();   // <-- hide panels when playing a playlist
                try { playSong(); } catch(e){ if (typeof loadAndPlay === 'function') loadAndPlay(0); }
                hidePlaylistDialog();
                try { await uploadPlaylistToServer(currentPlaylist); } catch(e){}
              });

              const gear = document.createElement('button');
              gear.className = 'button-style';
              gear.style.position = 'absolute';
              gear.style.right = '6px';
              gear.style.top = '6px';
              gear.title = 'Manage';
              gear.textContent = '⚙';
              gear.addEventListener('click', (ev) => { ev.stopPropagation(); openManagePlaylist(pl); });
              tile.appendChild(gear);

              const addBtnTile = document.createElement('button');
              addBtnTile.className = 'add-to-btn';
              addBtnTile.title = 'Add current song to this playlist';
              addBtnTile.textContent = '+';

              function getCurrentTrack() {
                try {
                  if (Array.isArray(window.currentPlaylist) && typeof window.currentSongIndex !== 'undefined' && window.currentSongIndex !== null) {
                    const idx = Number(window.currentSongIndex);
                    if (Number.isFinite(idx) && window.currentPlaylist[idx]) return window.currentPlaylist[idx];
                    if (window.currentPlaylist.length > 0) return window.currentPlaylist[0];
                  }
                  const altNames = ['currentTrack','currentSong','currentPlaying','nowPlaying','now_playing','nowPlayingTrack','playingTrack'];
                  for (const name of altNames) {
                    const val = window[name];
                    if (!val) continue;
                    if (typeof val === 'string') return val;
                    if (typeof val === 'object') {
                      if (val.src) return val.src; if (val.url) return val.url; if (val.path) return val.path;
                      if (val.file) return val.file; if (val.filename) return val.filename; if (val.name) return val.name;
                    }
                  }
                  const audio = document.querySelector('audio') || document.getElementById('audio') || document.querySelector('audio#playerAudio');
                  if (audio) {
                    if (audio.currentSrc) return audio.currentSrc;
                    if (audio.src) return audio.src;
                    if (audio.dataset && audio.dataset.src) return audio.dataset.src;
                  }
                  const playerEl = document.getElementById('player');
                  if (playerEl) {
                    if (playerEl.dataset && playerEl.dataset.currentTrack) return playerEl.dataset.currentTrack;
                    const attr = playerEl.getAttribute && playerEl.getAttribute('data-current-track');
                    if (attr) return attr;
                  }
                  return null;
                } catch (e) { return null; }
              }

              addBtnTile.addEventListener('click', async (ev) => {
                ev.stopPropagation();
                try {
                  const cur = getCurrentTrack();
                  if (!cur) {
                    alert('No current track detected. Make sure a track is loaded/playing.');
                    return;
                  }
                  let trackToAdd = cur;
                  if (typeof cur === 'object') {
                    trackToAdd = cur.src || cur.url || cur.path || cur.file || cur.filename || cur.name || null;
                    if (!trackToAdd) return;
                  }
                  const profileLocal = getActiveProfileName();
                  const ok = await appendSongToPlaylist(profileLocal, pl, trackToAdd);
                  if (ok) {
                    const prev = addBtnTile.textContent;
                    addBtnTile.textContent = '✓';
                    setTimeout(()=>{ addBtnTile.textContent = prev; }, 900);
                  } else {
                    alert('Failed to add track to playlist. See console for details.');
                  }
                } catch (err) { alert('Failed to add to playlist (see console).'); }
              });

              tile.appendChild(addBtnTile);
              tile.addEventListener('keydown', ev => {
                if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); ev.stopPropagation(); tile.click(); }
              });
              tilesRow.appendChild(tile);
            } catch(e){ console.warn('render tile failed', e); }
          }
        }
        await loadAndRenderMaster();
      }
      
      window.showPlaylistDialog = async function() {
        try {
          if (!playlistGrid) return;
          await renderPlaylistTiles();
          playlistDialog.style.display = 'block';
          dialogOverlay.style.display = 'block';
        } catch(e){ console.warn('showPlaylistDialog failed', e); }
      };

      async function openManagePlaylist(playlistSlug) {
        const profile = getActiveProfileName();
        const dialog = document.getElementById('managePlaylistDialog');
        const title = document.getElementById('manageTitle');
        const preview = document.getElementById('manageCoverPreview');
        const songsList = document.getElementById('manageSongsList');
        const imgInput = document.getElementById('manageImageInput');

        if (!dialog) { alert('Manage dialog not found'); return; }
        dialog.style.display = 'block';
        dialog.setAttribute('aria-hidden','false');
        title.textContent = 'Manage: ' + playlistSlug;
        window._currentManagingPlaylist = playlistSlug;

        const imgUrl = await checkPlaylistImageUrl(profile, playlistSlug);
        preview.src = imgUrl;

        const arr = await loadPlaylistFileFromServer(profile, playlistSlug) || [];
        window._managePlaylistArray = arr.slice();

        function renderManageSongs() {
          songsList.innerHTML = '';
          (window._managePlaylistArray || []).forEach((s, idx) => {
            const div = document.createElement('div');
            div.className = 'song-item';
            const name = document.createElement('div');
            name.className = 'name';
            name.textContent = s;
            const rem = document.createElement('button');
            rem.className = 'button-style';
            rem.textContent = 'Remove';
            rem.onclick = async function() {
              if (!confirm('Remove this song from playlist?')) return;
              window._managePlaylistArray.splice(idx,1);
              renderManageSongs();
              try {
                await savePlaylistFileToServer(profile, playlistSlug, window._managePlaylistArray);
              } catch(err) {
                console.error('Failed to sync updated removal array', err);
              }
            };
            div.appendChild(name);
            div.appendChild(rem);
            songsList.appendChild(div);
          });
        }
        renderManageSongs();
        
        const saveBtn = document.getElementById('manageSaveBtn');
        const delBtn = document.getElementById('manageDeleteBtn');
        const closeBtn = document.getElementById('manageCloseBtn');

        saveBtn.onclick = async function() {
          await savePlaylistFileToServer(profile, playlistSlug, window._managePlaylistArray);
          if (imgInput.files && imgInput.files[0]) {
            await uploadPlaylistImage(profile, playlistSlug, imgInput.files[0]);
          }
          alert('Playlist updated successfully!');
          document.getElementById('managePlaylistDialog').style.display = 'none';
          showPlaylistDialog(); // Refresh
        };

        delBtn.onclick = async function() {
          if (!confirm('Are you sure you want to delete this playlist?')) return;
          let master = await loadMasterPlaylistsFromServer(profile) || [];
          master = master.filter(p => p !== playlistSlug);
          await saveMasterPlaylistsToServer(profile, master);
          document.getElementById('managePlaylistDialog').style.display = 'none';

        closeBtn.onclick = function() {

  <!-- ================================================================ -->
  <!-- MAIN MUSIC SCRIPT – with concurrency‑limited image loading       -->
  <!-- ================================================================ -->
  <script>
    // ---- GLOBAL VARIABLES ----
    let currentPlaylist = [];
    let currentSongIndex = 0;
    let currentGenre = "";
    let selectedGenres = new Set();
    let allowedArtists = new Set();
    let selectedArtistsSongs = [];
    let lastPlayedIndex = null;
    let loopCurrent = false;
    let loopA = null, loopB = null;
    const audio = document.getElementById("audio");

    // ---- FULLSCREEN HELPER ----
    let _keyboardTrigger = false;
    let _referralPlayed = false;

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        _keyboardTrigger = true;
      }
    });

    document.addEventListener('pointerdown', function() {
      _keyboardTrigger = false;
    });

    function requestFullscreenIfNot() {
      if (_keyboardTrigger && !document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        if (_referralPlayed) _referralPlayed = false;
      }
    }

    function requestFullscreenOnKeyboard() {
      if (_keyboardTrigger && !document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        if (_referralPlayed) _referralPlayed = false;
      }
    }

    // ---- IMAGE CONCURRENCY CONTROL ----
    const MAX_CONCURRENT_IMAGE_REQUESTS = 4;
    const IMAGE_CACHE = new Map();          // key: artist baseName -> resolved URL
    const PENDING_IMAGE_QUEUE = [];
    let ACTIVE_IMAGE_REQUESTS = 0;

    // process queue
    function processImageQueue() {
      if (ACTIVE_IMAGE_REQUESTS >= MAX_CONCURRENT_IMAGE_REQUESTS || PENDING_IMAGE_QUEUE.length === 0) return;
      const job = PENDING_IMAGE_QUEUE.shift();
      ACTIVE_IMAGE_REQUESTS++;
      _probeImage(job.baseName).then(result => {

    // Only cache real artwork.
    if (!result.endsWith('default.jpg')) {
        IMAGE_CACHE.set(job.baseName, result);
    }

    job.resolve(result);
}).finally(() => {
        ACTIVE_IMAGE_REQUESTS--;
        processImageQueue();
      });
    }

    // actual probing function – returns a promise that resolves to the best URL
    function _probeImage(baseName) {
      if (!baseName) return Promise.resolve('Music/Images/default.jpg');
      // get name variations
      const nameVariations = getArtistNameVariations(baseName);
      const primaryOrigin = getOriginForArtist(baseName);

      // Build list of origins: primary first, then server (priority 3), then others, then local
      const allOrigins = new Set();
      allOrigins.add(primaryOrigin);
      const sources = window.__availableSources || [];
      const serverSource = sources.find(s => s.priority === 3);
      if (serverSource) allOrigins.add(serverSource.origin);
      for (const src of sources) allOrigins.add(src.origin);
      allOrigins.add(window.location.origin);

      // Order: primary first, then server, then others by priority descending, then local
      const originOrder = [];
      if (allOrigins.has(primaryOrigin)) originOrder.push(primaryOrigin);
      if (serverSource && serverSource.origin !== primaryOrigin) originOrder.push(serverSource.origin);
      const sortedSources = [...sources].sort((a,b) => b.priority - a.priority);
      for (const src of sortedSources) {
        if (!originOrder.includes(src.origin)) originOrder.push(src.origin);
      }
      if (!originOrder.includes(window.location.origin)) originOrder.push(window.location.origin);

      // Build candidate URLs
      const candidates = [];
      for (const origin of originOrder) {
        const base = origin.endsWith('/') ? origin : origin + '/';
        for (const name of nameVariations) {
          const encoded = encodeURIComponent(name);
          candidates.push(`${base}Music/Images/${encoded}.jpg`);
        }
      }
      // Relative fallback
      candidates.push(`Music/Images/${encodeURIComponent(baseName)}.jpg`);
      candidates.push('Music/Images/default.jpg');

      const unique = [...new Set(candidates)];

      // Probe each with HEAD (timeout 300ms)
      return new Promise((resolve) => {
        let index = 0;
        function tryNext() {
          if (index >= unique.length) {
            resolve('Music/Images/default.jpg');
            return;
          }
          const url = unique[index++];
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 2000);
          fetch(url, { method: 'HEAD', cache: 'no-store', signal: controller.signal })
            .then(res => {
              clearTimeout(timer);
              if (res && res.ok) resolve(url);
              else tryNext();
            })
            .catch(() => {
              clearTimeout(timer);
              tryNext();
            });
        }
        tryNext();
      });
    }

    // ---- HELPER FUNCTIONS ----
    function normalizeSongBase(raw) {
      let s = String(raw == null ? '' : raw).trim();
      try { s = decodeURIComponent(s); } catch (e) {}
      s = s.split(/[\/]/).pop();
      s = s.replace(/[?#].*$/, '');
      s = s.replace(/\.(mp3|flac|wav|m4a|ogg|aac|opus|wma|alac)(\?.*)?$/i, '');
      s = s.replace(/\$[9AM\+RPUHEBC]$/i, '');
      return s.trim();
    }

    function getArtistFromFilename(filename) {
      return parseFilename(filename).artist || '';
    }

    function getTitleFromFilename(filename) {
      return parseFilename(filename).title || '';
    }

    function parseFilename(filename) {
      if (!filename) return { title: '', artist: '' };
      const base = normalizeSongBase(filename);
      const parts = base.split(' - ').map(p => p.trim()).filter(Boolean);
      if (parts.length === 0) return { title: '', artist: '' };
      if (parts.length === 1) return { title: parts[0], artist: '' };
      if (parts.length >= 3 && /^\d+$/.test(parts[0])) {
        const artist = parts[1];
        const title = parts.slice(2).join(' - ');
        return { title, artist };
      }
      if (parts.length === 2) {
        return { title: parts[0], artist: parts[1] };
      }
      const artist = parts[parts.length - 1];
      const title = parts.slice(0, parts.length - 1).join(' - ');
      return { title, artist };
    }

    function flattenStoredList(input) {
      const out = [];
      const walk = (item) => {
        if (item == null) return;
        if (Array.isArray(item)) { item.forEach(walk); return; }
        let str = String(item).trim();
        if (!str) return;
        if (str.startsWith('[') && str.endsWith(']')) {
          try { const parsed = JSON.parse(str); if (Array.isArray(parsed)) { walk(parsed); return; } } catch (e) {}
        }
        out.push(str);
      };
      walk(input);
      return out;
    }

    function normalizeLoadedPlaylist(list) {
      const out = [];
      const seen = new Set();
      flattenStoredList(list).forEach(item => {
        const base = normalizeSongBase(item);
        if (!base || seen.has(base)) return;
        seen.add(base);
        out.push(base);
      });
      return out;
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // ---- ORIGIN‑AWARE IMAGE LOADING (JPG only) ----
    let MUSIC_LIBRARY_ENTRIES = [];
    let MUSIC_LIBRARY_GENRE_MAP = {};
    let MUSIC_LIBRARY_GENRE_CODE_BY_NAME = {};
    let artistOriginMap = new Map();

    function buildArtistOriginMap(entries) {
      const map = new Map();
      for (const e of entries) {
        const artist = getArtistFromFilename(e.base);
        if (artist && !map.has(artist)) {
          map.set(artist, e.origin);
        }
      }
      return map;
    }

    function getOriginForArtist(artistName) {
      if (!artistName) return window.location.origin;
      if (artistOriginMap.has(artistName)) return artistOriginMap.get(artistName);
      const entry = MUSIC_LIBRARY_ENTRIES.find(e => getArtistFromFilename(e.base) === artistName);
      if (entry) return entry.origin;
      return window.location.origin;
    }

    function getArtistNameVariations(fullName) {
      const variations = [fullName];
      const lower = fullName.toLowerCase();
      const featIndex = lower.indexOf(' feat ');
      if (featIndex !== -1) {
        variations.push(fullName.substring(0, featIndex).trim());
      }
      const capitalFeatIndex = fullName.indexOf(' Feat ');
      if (capitalFeatIndex !== -1 && capitalFeatIndex !== featIndex) {
        variations.push(fullName.substring(0, capitalFeatIndex).trim());
      }
      return [...new Set(variations.filter(v => v.length > 0))];
    }

    // ----- MAIN RESOLVE (uses concurrency & cache) -----
    function resolveImage(baseName) {
      if (!baseName) return Promise.resolve('Music/Images/default.jpg');
      if (IMAGE_CACHE.has(baseName)) {
    const cached = IMAGE_CACHE.get(baseName);

    // Never trust cached defaults.
    if (!cached.endsWith('default.jpg')) {
        return Promise.resolve(cached);
    }

    IMAGE_CACHE.delete(baseName);
}
      return new Promise((resolve, reject) => {
        PENDING_IMAGE_QUEUE.push({ baseName, resolve, reject });
        processImageQueue();
      });
    }

    // applyImage – async to wait for resolve
    async function applyImage(img, baseName) {
      if (!img) return;
      const url = await resolveImage(baseName);
      img.src = url;
      img.onerror = function() {
        this.onerror = null;
        this.src = 'Music/Images/default.jpg';
      };
    }

    // Legacy names for compatibility
    const resolveArtistImage = resolveImage;
    const applyArtistImage = applyImage;
    const applyGenreImage = applyImage;

    // ---- PARSE MERGED LIBRARY ----
    function parseMergedLibrary() {
      const raw = window.musicLibrary || [];
      const entries = [];
      const genreMap = window.musicLibraryGenreMap || {};
      MUSIC_LIBRARY_GENRE_MAP = genreMap;
      MUSIC_LIBRARY_GENRE_CODE_BY_NAME = Object.fromEntries(
        Object.entries(genreMap).map(([code, name]) => [String(name), String(code)])
      );

      for (const item of raw) {
        let rawStr = '';
        let origin = window.location.origin;
        if (typeof item === 'string') {
          rawStr = item;
        } else if (item && typeof item === 'object') {
          rawStr = item.raw || '';
          origin = item._origin || window.location.origin;
        }
        if (!rawStr) continue;
        const idx = rawStr.lastIndexOf('$');
        const base = normalizeSongBase(idx === -1 ? rawStr : rawStr.slice(0, idx));
        const code = idx === -1 ? '' : rawStr.slice(idx + 1).trim();
        const genre = genreMap[code] || code;
        entries.push({ raw: rawStr, base, code, genre, origin });
      }
      MUSIC_LIBRARY_ENTRIES = entries;
      artistOriginMap = buildArtistOriginMap(entries);
    }

    // ---- HELPER: HIDE GENRES & ARTISTS (USED BY ALL PLAYBACK STARTERS) ----
    function hideGenresAndArtists() {
      const genres = document.getElementById('genres');
      const artists = document.getElementById('artists');
      const toggleGenresBtn = document.getElementById('toggleGenresButton');
      const toggleArtistsBtn = document.getElementById('toggleArtistsButton');

    // ---- FUNCTIONS THAT USE THE PARSED LIBRARY ----
    function getAllGenreNames() {
      const seen = new Set();
      const names = [];
      for (const rec of MUSIC_LIBRARY_ENTRIES) {
        if (!rec.genre || seen.has(rec.genre)) continue;
        seen.add(rec.genre);
        names.push(rec.genre);
      }
      return names.sort((a,b) => a.localeCompare(b));
    }

    function getSongsForGenre(genreName) {
      const code = MUSIC_LIBRARY_GENRE_CODE_BY_NAME[String(genreName || '').trim()];
      if (!code) return [];
      return MUSIC_LIBRARY_ENTRIES.filter(rec => rec.code === code).map(rec => rec.base).filter(Boolean);
    }

    function getSongsForArtist(artistName) {
      const target = String(artistName || '').trim();
      if (!target) return [];
      const songs = [];
      const seen = new Set();
      for (const rec of MUSIC_LIBRARY_ENTRIES) {
        const artist = getArtistFromFilename(rec.base);
        if (artist === target && !seen.has(rec.base)) {
          seen.add(rec.base);
          songs.push(rec.base);
        }
      }
      return songs;
    }

    // ---- PLAYLIST / NAVIGATION FUNCTIONS ----
    function loadPlaylist(genre) {
      requestFullscreenOnKeyboard();
      currentPlaylist = shuffle([...new Set(getSongsForGenre(genre))]);
      currentSongIndex = 0;
      currentGenre = genre;
      document.getElementById("player").style.display = "block";
      hideGenresAndArtists();   // <-- hide panels
      playSong();
      uploadPlaylistToServer(currentPlaylist);
    }

    function loadArtist(artistName) {
      requestFullscreenOnKeyboard();
      const artistSongs = shuffle([...new Set(getSongsForArtist(artistName))]);
      if (!artistSongs.length) return;
      currentPlaylist = artistSongs;
      currentSongIndex = 0;
      currentGenre = artistName;
      document.getElementById("player").style.display = "block";
      hideGenresAndArtists();   // <-- hide panels
      playSong();
      uploadPlaylistToServer(currentPlaylist);
    }

    // ---- PLAY SONG ----
    function playSong() {
      const player = document.getElementById("player");
      if (player.style.display === "none") {
        const mainImg = document.getElementById("artistImage");
        if (mainImg) mainImg.src = "";
        ['prev4','prev3','prev2','prev1','center','next1','next2','next3','next4'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.style.display = 'none';
        });
        return;
      }
      if (!currentPlaylist.length) return;
      const raw = currentPlaylist[currentSongIndex];

      let entry = MUSIC_LIBRARY_ENTRIES.find(e => e.raw === raw || e.base === normalizeSongBase(raw));
      if (!entry) {
        const base = normalizeSongBase(raw);
        entry = MUSIC_LIBRARY_ENTRIES.find(e => e.base === base);
      }
      if (!entry) {
        const artist = getArtistFromFilename(raw);
        if (artist) {
          entry = MUSIC_LIBRARY_ENTRIES.find(e => getArtistFromFilename(e.base) === artist);
        }
      }
      const origin = entry ? entry.origin : window.location.origin;

      const parsed = parseFilename(raw);
      const display = parsed.title || String(raw).replace(/\.\w+$/, "");
      const artist = parsed.artist || '';

      // Resolve audio URL with origin
      resolveTrackUrl(raw, origin).then(src => {
        audio.onerror = function() {
          if (src.endsWith('.flac')) {
            const fallback = fileToMusicUrl(raw, 'mp3', origin);
            audio.onerror = null;
            audio.src = fallback;
            try { audio.load(); } catch (e) {}
            audio.play().catch(() => {});
          }
        };
        audio.src = src;
        try { audio.load(); } catch (e) {}
        audio.play().catch(() => {});
      }).catch(err => {
        console.warn('resolveTrackUrl failed', err);
        const fallback = fileToMusicUrl(raw, 'flac', origin);
        audio.src = fallback;
        try { audio.load(); } catch (e) {}
        audio.play().catch(() => {});
      });

      document.getElementById("npGenre").innerText = currentGenre ? `Now Playing - ${currentGenre}` : 'Now Playing';
      document.getElementById("songTitle").innerText = display;
      document.getElementById("artistName").innerText = artist || '';

      // Artwork: center + neighbors
      const token = (window._artworkRenderToken = (window._artworkRenderToken || 0) + 1);
      const mainImg = document.getElementById("artistImage");
      const barImg = document.getElementById("playerArtistImg");
      
      resolveImage(artist).then(url => {
        if ((window._artworkRenderToken || 0) !== token) return;
        if (mainImg) mainImg.src = url;
        if (barImg) barImg.src = url;
      }).catch(() => {
        if ((window._artworkRenderToken || 0) !== token) return;
        const fallback = 'Music/Images/default.jpg';
        if (mainImg) mainImg.src = fallback;
        if (barImg) barImg.src = fallback;
      });

      const elems = {
        prev4: document.getElementById("prev4"),
        prev3: document.getElementById("prev3"),
        prev2: document.getElementById("prev2"),
        prev1: document.getElementById("prev1"),
        next1: document.getElementById("next1"),
        next2: document.getElementById("next2"),
        next3: document.getElementById("next3"),
        next4: document.getElementById("next4")
      };

      const assignNeighbor = (offset, el) => {
        if (!el) return;
        if (currentPlaylist.length === 1) { el.style.display = 'none'; return; }
        const idx = (currentSongIndex + offset + currentPlaylist.length) % currentPlaylist.length;
        const candidate = currentPlaylist[idx];
        const candArtist = getArtistFromFilename(candidate);
        el.style.display = '';
        el.title = candidate.replace(/\.(mp3|flac)$/, "");
        const dist = Math.abs(offset);
        const delay = dist === 1 ? 20 : dist === 2 ? 55 : dist === 3 ? 95 : 140;
        setTimeout(() => {
          if ((window._artworkRenderToken || 0) !== token) return;
          resolveImage(candArtist).then(url => {
            el.src = url;
          }).catch(() => {
            el.src = 'Music/Images/default.jpg';
          });
        }, delay);
        el.onclick = () => { currentSongIndex = idx; playSong(); };
        el.ondblclick = (ev) => { ev.stopPropagation(); currentSongIndex = idx; playSong(); };
      };

      assignNeighbor(-1, elems.prev1);
      assignNeighbor(-2, elems.prev2);
      assignNeighbor(-3, elems.prev3);
      assignNeighbor(-4, elems.prev4);
      assignNeighbor(1, elems.next1);
      assignNeighbor(2, elems.next2);
      assignNeighbor(3, elems.next3);
      assignNeighbor(4, elems.next4);

      updateLikedSongsUI();
      updatePlaylistOrder();
      try { lastPlayedIndex = currentSongIndex; } catch(e){}

      setNowPlayingMetadata(artist, display, `Music/Images/${artist}.jpg`, origin);

      // Preload next
      try {
        if (audio._nextPreloadTimeout) clearTimeout(audio._nextPreloadTimeout);
        audio._nextPreloadTimeout = setTimeout(() => {
          if (!Array.isArray(currentPlaylist) || currentPlaylist.length <= 1) return;
          const nextIdx = (currentSongIndex + 1) % currentPlaylist.length;
          const nextRaw = currentPlaylist[nextIdx];
          let nextEntry = MUSIC_LIBRARY_ENTRIES.find(e => e.raw === nextRaw || e.base === normalizeSongBase(nextRaw));
          if (!nextEntry) {
            const nextArtist = getArtistFromFilename(nextRaw);
            if (nextArtist) {
              nextEntry = MUSIC_LIBRARY_ENTRIES.find(e => getArtistFromFilename(e.base) === nextArtist);
            }
          }
          const nextOrigin = nextEntry ? nextEntry.origin : origin;
          resolveTrackUrl(nextRaw, nextOrigin).then(url => {
            if (window._audioPreloader && typeof window._audioPreloader.preload === 'function') {
              window._audioPreloader.preload(url, 400 * 1024).catch(()=>{});
            }
          }).catch(()=>{});
        }, 8000);
      } catch(e){}
    }

    // ---- AUDIO URL RESOLUTION ----
    function fileToMusicUrl(baseName, ext, origin) {
      const clean = normalizeSongBase(baseName);
      const baseUrl = origin || window.location.origin;
      return `${baseUrl}/Music/${encodeURIComponent(clean)}.${ext}`;
    }

    async function resolveTrackUrl(baseName, origin) {
      const clean = normalizeSongBase(baseName);
      const flacUrl = fileToMusicUrl(clean, 'flac', origin);
      const mp3Url = fileToMusicUrl(clean, 'mp3', origin);
      const head = async (url) => {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 100);
          const res = await fetch(url, { method: 'HEAD', cache: 'no-store', signal: controller.signal });
          clearTimeout(timer);
          return res.ok;
        } catch (e) { return false; }
      };
      if (await head(flacUrl)) return flacUrl;
      if (await head(mp3Url)) return mp3Url;
      return flacUrl;
    }

    // ---- MEDIA SESSION ----
    function setNowPlayingMetadata(artist, title, imagePath, origin) {
      try {
        if (!('mediaSession' in navigator)) return;
        const metaTitle = title || '';
        const metaArtist = artist || '';
        const baseOrigin = origin || window.location.origin;
        const artUrl = (imagePath && (imagePath.indexOf('http') === 0)) ? imagePath : `${baseOrigin}/${imagePath}`;
        try {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: metaTitle || 'Unknown Title',
            artist: metaArtist || 'Unknown Artist',
            album: '',
            artwork: [
              { src: artUrl, sizes: '96x96',   type: 'image/jpeg' },
              { src: artUrl, sizes: '128x128', type: 'image/jpeg' },
              { src: artUrl, sizes: '192x192', type: 'image/jpeg' },
              { src: artUrl, sizes: '512x512', type: 'image/jpeg' }
            ]
          });
          navigator.mediaSession.playbackState = (audio && !audio.paused) ? 'playing' : 'paused';
        } catch (e) {}
        (async function tryFetchAndSetBlob() {
          try {
            const resp = await fetch(artUrl, { mode: 'cors', cache: 'force-cache', credentials: 'omit' });
            if (!resp.ok) throw new Error('fetch failed: ' + resp.status);
            const blob = await resp.blob();
            const blobUrl = URL.createObjectURL(blob);
            try {
              navigator.mediaSession.metadata = new MediaMetadata({
                title: metaTitle || 'Unknown Title',
                artist: metaArtist || 'Unknown Artist',
                album: '',
                artwork: [
                  { src: blobUrl, sizes: '96x96',   type: blob.type || 'image/jpeg' },
                  { src: blobUrl, sizes: '128x128', type: blob.type || 'image/jpeg' },
                  { src: blobUrl, sizes: '192x192', type: blob.type || 'image/jpeg' },
                  { src: blobUrl, sizes: '512x512', type: blob.type || 'image/jpeg' }
                ]
              });
              setTimeout(() => { try { URL.revokeObjectURL(blobUrl); } catch(e){} }, 60000);
            } catch(e) {}
          } catch (e) {}
        })();
      } catch (e) {}
    }

    // ---- PLAY NEXT / PREVIOUS ----
    function playNext() {
      if (loopCurrent) {
        const dest = (loopA !== null && isFinite(loopA)) ? loopA : 0;
        audio.currentTime = dest;
        if (audio.paused) audio.play().catch(()=>{});
        return;
      }
      currentSongIndex = (currentSongIndex + 1) % currentPlaylist.length;
      playSong();
    }

    function playPrevious() {
      if (audio.currentTime > 5) {
        audio.currentTime = 0;
        audio.play();
      } else {
        currentSongIndex = (currentSongIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
        playSong();
      }
    }

    // ---- UPDATE PLAYLIST ORDER ----
    function updatePlaylistOrder() {
      const listEl = document.getElementById("playlistOrder");
      listEl.innerHTML = "";
      const windowSize = 3;
      const total = currentPlaylist.length;
      if (total === 0) return;
      let start = currentSongIndex - Math.floor(windowSize / 2);
      start = Math.max(0, Math.min(start, total - windowSize));
      const end = Math.min(total, start + windowSize);
      for (let i = start; i < end; i++) {
        const fileName = currentPlaylist[i];
        const title = fileName.replace(/\.(mp3|flac)$/i, "");
        const li = document.createElement("li");
        li.innerText = title;
        li.style.cursor = "pointer";
        li.onclick = () => { currentSongIndex = i; playSong(); uploadPlaylistToServer(currentPlaylist); };
        if (i === currentSongIndex) { li.classList.add("active"); setTimeout(() => li.scrollIntoView({ behavior: "smooth", block: "nearest" }), 0); }
        listEl.appendChild(li);
      }
    }

    // ---- LIKED SONGS HELPERS ----
    function getActiveProfileName() {
      return String(localStorage.getItem('activeProfile') || 'Guest').trim() || 'Guest';
    }

    function getStoredLikedSongs() {
      const profile = getActiveProfileName();
      const key = `likedSongs:${profile}`;
      let raw = '';
      try { raw = localStorage.getItem(key) || ''; } catch(e){}
      if (!raw) try { raw = localStorage.getItem('likedSongs') || ''; } catch(e){}
      let arr = [];
      try {
        const extracted = extractFirstJsonArray(raw);
        if (extracted) arr = JSON.parse(extracted);
        else if (raw) arr = JSON.parse(raw);
      } catch (e) {
        const match = raw.match(/\[\[\[\s*(\[[\s\S]*?\])\s*\]\]\]/);
        try { if (match) arr = JSON.parse(match[1]); } catch(e2){ arr = []; }
      }
      arr = flattenStoredList(arr);
      arr = arr.map(v => String(v).trim()).filter(Boolean);
      if (arr.length === 1 && typeof arr[0] === 'string') {
        const single = arr[0];
        const extMatches = (single.match(/\.(mp3|flac)\b/ig) || []);
        if (extMatches.length > 1) {
          arr = single.split(/(?<=\.(?:mp3|flac))\s*,\s*/i).map(x => String(x).trim()).filter(Boolean);
        }
      }
      return arr;
    }

    function setStoredLikedSongs(arr) {
      const profile = getActiveProfileName();
      const clean = flattenStoredList(arr);
      const payload = JSON.stringify(clean);
      try { localStorage.setItem(`likedSongs:${profile}`, payload); } catch(e){}
      try { localStorage.setItem('likedSongs', payload); } catch(e){}
    }

    function extractFirstJsonArray(text) {
      if (!text || typeof text !== 'string') return null;
      for (let i = 0; i < text.length; i++) {
        if (text[i] === '[') {
          let depth = 0;
          for (let j = i; j < text.length; j++) {
            if (text[j] === '[') depth++;
            else if (text[j] === ']') { depth--; if (depth === 0) return text.slice(i, j+1); }
          }
          break;
        }
      }
      return null;
    }

    function toggleLikeForFile(fileName) {
      if (!fileName) return;
      const name = normalizeSongBase(fileName);
      let liked = getStoredLikedSongs();
      liked = liked.map(x => normalizeSongBase(x));
      const idx = liked.indexOf(name);
      if (idx === -1) liked.push(name);
      else liked.splice(idx, 1);
      setStoredLikedSongs(liked);
      saveLikedSongsToServer(liked);
      updateLikedSongs();
      updateLikedSongsUI();
    }

    function updateLikedSongsUI() {
      const btn = document.getElementById('likeBtn');
      if (!btn) return;
      const raw = (currentPlaylist && currentPlaylist.length) ? currentPlaylist[currentSongIndex] : null;
      const cur = raw ? normalizeSongBase(raw) : null;
      const stored = getStoredLikedSongs();
      const normalized = stored.map(x => normalizeSongBase(x));
      const liked = cur && normalized.indexOf(cur) !== -1;
      btn.innerText = liked ? 'Liked' : 'Like';
    }

    function updateLikedSongs() {
      const likedSongs = getStoredLikedSongs();
      const list = document.getElementById("likedSongsList");
      if (!list) return;
      list.innerHTML = "";
      if (!likedSongs || likedSongs.length === 0) return;
      const displayItems = likedSongs.map(s => normalizeSongBase(s)).filter(Boolean);
      displayItems.forEach(item => {
        const li = document.createElement('li');
        li.innerText = item;
        li.style.cursor = 'pointer';
        li.onclick = () => {
          const clickedIndex = likedSongs.findIndex(s => String(s).trim().replace(/\.(mp3|flac)$/i,'') === item);
          if (clickedIndex === -1) return;
          currentPlaylist = likedSongs.slice();
          currentSongIndex = clickedIndex;
          currentGenre = "Liked Songs";
          document.getElementById("player").style.display = "block";
          hideGenresAndArtists();   // <-- hide panels
          playSong();
        };
        list.appendChild(li);
      });
    }

    async function saveLikedSongsToServer(likedSongs) {
      const profile = getActiveProfileName();
      const fileName = `${profile}-likedsongs.txt`;
      const cleaned = flattenStoredList(likedSongs);
      const sanitized = `[[[\n${JSON.stringify(cleaned, null, 2)}\n]]]`;
      const payloadBlob = new Blob([sanitized], { type: 'text/plain' });
      const targetPath = `/Profiles/${encodeURIComponent(fileName)}`;
      try {
        await platformAPI.upload(payloadBlob, targetPath);
      } catch (e) { console.error('[saveLikedSongsToServer] upload failed:', e); }
    }

    async function loadLikedSongsFromServer() {
      const profile = getActiveProfileName();
      const fileName = `${profile}-likedsongs.txt`;
      const url = `/Profiles/${encodeURIComponent(fileName)}?_=${Date.now()}`;
      try {
        const r = await fetch(url, { cache: 'no-store' });
        if (!r.ok) {
          if (r.status !== 404) throw new Error(`HTTP ${r.status}`);
          setStoredLikedSongs([]);
          updateLikedSongs();
          updateLikedSongsUI();
          return;
        }
        const text = await r.text();
        let likedSongs = [];
        try {
          const arrString = extractFirstJsonArray(text);
          if (arrString) likedSongs = JSON.parse(arrString);
        } catch (err) {}
        setStoredLikedSongs(normalizeLoadedPlaylist(likedSongs));
        updateLikedSongs();
        updateLikedSongsUI();
      } catch (err) {
        console.error('Liked songs load failed:', err);
        setStoredLikedSongs([]);
        updateLikedSongs();
        updateLikedSongsUI();
      }
    }

    function playLikedSongs() {
      requestFullscreenOnKeyboard();
      const likedSongs = getStoredLikedSongs();
      if (likedSongs.length === 0) { alert("No liked songs yet!"); return; }
      currentPlaylist = shuffle(likedSongs);
      currentSongIndex = 0;
      currentGenre = "Liked Songs";
      document.getElementById("player").style.display = "block";
      hideGenresAndArtists();   // <-- hide panels
      playSong();
      document.getElementById("genres").style.display = "none";
      document.getElementById("toggleGenresButton").textContent = "Genres";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // ---- UPLOAD PLAYLIST ----
    async function uploadPlaylistToServer(playlistArray) {
      const profile = getActiveProfileName();
      const fileNameTxt = `${profile}-radio.txt`;
      const basenames = (Array.isArray(playlistArray) ? playlistArray : []).map(item => {
        if (!item) return item;
        try { const name = String(item).split('/').pop(); try { return decodeURIComponent(name); } catch (e) { return name; } } catch (e) { return item; }
      });
      const jsonArray = JSON.stringify(basenames, null, 2);
      const sanitized = `[[[\n${jsonArray}\n]]]`;
      const payloadBlob = new Blob([sanitized], { type: 'text/plain' });
      const targetPath = `/Profiles/${encodeURIComponent(fileNameTxt)}`;
      try {
        await platformAPI.upload(payloadBlob, targetPath);
      } catch (e) { console.error('[uploadPlaylistToServer] upload failed:', e); }
    }

      const button = document.getElementById(buttonId);
      if (getComputedStyle(element).display === "none") {

    // ---- RENDER ARTIST TILE ----
    function renderArtistTile(artist, isChecked) {
      const container = document.getElementById("artists");
      const div = document.createElement("div");
      div.className = "genre";
      div.id = `artist-${artist}`;
      div.innerHTML = `<img alt="${artist}"><p>${artist}</p>`;

      checkbox.checked = isChecked;
      checkbox.onchange = function () { setArtistChecked(artist, this.checked); };
