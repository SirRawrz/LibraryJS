    // ---- UPDATE ARTISTS BASED ON GENRES ----
    function updateArtistsBasedOnGenres(checkArtists = false) {
      const container = document.getElementById("artists");
      if (!container) return;
      container.innerHTML = "";
      allowedArtists.clear();
      const genreSongs = Array.from(selectedGenres).flatMap(g => getSongsForGenre(g));
      const artistMap = {};
      genreSongs.forEach(fn => {
        const artist = getArtistFromFilename(fn);
        if (!artist) return;
        if (!artistMap[artist]) artistMap[artist] = [];
        artistMap[artist].push(fn);
        allowedArtists.add(artist);
      });
      Object.keys(artistMap).sort().forEach(artist => {
        renderArtistTile(artist, checkArtists || allowedArtists.has(artist));
      });
    }

    // ---- SET ARTIST CHECKED ----
    function setArtistChecked(artist, checked) {
      try {
        const songs = getSongsForArtist(artist);
        if (checked) {
          allowedArtists.add(artist);
          const newSongs = songs.filter(s => currentPlaylist.indexOf(s) === -1);
          if (newSongs.length) {
            currentPlaylist = currentPlaylist.concat(newSongs);
            try { uploadPlaylistToServer(currentPlaylist); } catch(e) {}
          }
          songs.forEach(s => { if (selectedArtistsSongs.indexOf(s) === -1) selectedArtistsSongs.push(s); });
        } else {
          allowedArtists.delete(artist);
          currentPlaylist = currentPlaylist.filter(s => songs.indexOf(s) === -1);
          try { uploadPlaylistToServer(currentPlaylist); } catch(e) {}
          selectedArtistsSongs = selectedArtistsSongs.filter(s => songs.indexOf(s) === -1);
        }
      } catch(e) { console.error(e); }
      try {
        selectedArtistsSongs = selectedArtistsSongs.filter((v,i,a) => a.indexOf(v) === i);
        if (selectedArtistsSongs.length > 0) selectedGenres.add("Selected Artists");
        else selectedGenres.delete("Selected Artists");
      } catch(e) {}
      try {
        const mainDiv = document.getElementById('artist-' + artist);
        if (mainDiv) {
          const cb = mainDiv.querySelector('input[type="checkbox"]');
          if (cb) cb.checked = checked;
        }
      } catch(e) {}
      try {
        const searchCb = document.getElementById('search-artist-cb-' + artist);
        if (searchCb) searchCb.checked = checked;
      } catch(e) {}
    }

    // ---- LOAD GENRES ----
    function loadGenres() {
      const container = document.getElementById("genres");
      if (!container) return;
      container.innerHTML = "";
      const genres = getAllGenreNames();
      genres.forEach(function(genre) {
        const div = document.createElement("div");
        div.className = "genre";
        div.innerHTML = `<img alt="${genre}"><p>${genre}</p>`;
        const img = div.querySelector("img");
        if (img) applyImage(img, genre);
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = genre;
        checkbox.checked = selectedGenres.has(genre);
        checkbox.onchange = () => {
          const artistsEl = document.getElementById('artists');
          if (checkbox.checked) {
            selectedGenres.add(genre);
            if (artistsEl) artistsEl.style.display = 'flex';
            updateArtistsBasedOnGenres(true);
            setTimeout(() => {
              try {
                const artRoot = document.getElementById('artists');
                if (artRoot) {
                  artRoot.querySelectorAll('.genre').forEach(div => {
                    try { const cb = div.querySelector('input[type="checkbox"]'); if (cb) cb.checked = true; } catch(e){}
                    try { const img = div.querySelector('img'); if (img) { const name = img.alt || ''; applyImage(img, name); } } catch(e){}
                  });
                }
              } catch(e){}
            }, 40);
          } else {
            selectedGenres.delete(genre);
            updateArtistsBasedOnGenres();
            if ((!selectedGenres || selectedGenres.size === 0) && artistsEl) {
              try { artistsEl.querySelectorAll('.genre img').forEach(img => { img.src = ''; }); } catch(e){}
              artistsEl.style.display = 'none';
            }
          }
        };
        div.appendChild(checkbox);
        div.onclick = event => {
          if (event.target.tagName !== "INPUT") loadPlaylist(genre);
        };
        container.appendChild(div);
      });
      updateArtistsBasedOnGenres();
    }

    // ---- PLAY SELECTED SHUFFLED ----
    function playSelectedShuffled() {
      requestFullscreenOnKeyboard();
      let selectedSongs = [];
      const seenSongs = new Set();
      if (selectedGenres && selectedGenres.size > 0) {
        const genresToUse = Array.from(selectedGenres);
        genresToUse.forEach(genre => {
          getSongsForGenre(genre).forEach(song => {
            const artist = getArtistFromFilename(song);
            if (allowedArtists.has(artist) && !seenSongs.has(song)) {
              selectedSongs.push(song);
              seenSongs.add(song);
            }
          });
        });
      } else if (allowedArtists && allowedArtists.size > 0) {
        for (const artist of allowedArtists) {
          const songs = getSongsForArtist(artist);
          songs.forEach(song => {
            if (!seenSongs.has(song)) {
              selectedSongs.push(song);
              seenSongs.add(song);
            }
          });
        }
      }
      if (selectedSongs.length === 0 && selectedArtistsSongs && selectedArtistsSongs.length > 0) {
        selectedSongs = selectedArtistsSongs.slice();
      }
      if (selectedSongs.length === 0) { alert("Please select at least one artist or genre before playing."); return; }
      cleanupUIForPlayback();
      currentPlaylist = shuffle(selectedSongs);
      currentSongIndex = 0;
      currentGenre = "Selected Mix";
      document.getElementById("player").style.display = "block";
      hideGenresAndArtists();   // <-- hide panels
      playSong();
      uploadPlaylistToServer(currentPlaylist);
    }

    // ---- LOOP FUNCTIONS ----
    function toggleLoop() {
      loopCurrent = !loopCurrent;
      audio.loop = loopCurrent;
      const loopBtn = document.getElementById("loopButton");
      if (loopCurrent) { loopBtn.classList.add("active"); loopBtn.innerText = "Loop"; } else { loopBtn.classList.remove("active"); loopBtn.innerText = "Loop"; }
      updateLoopButtonsUI();
    }

    function updateLoopButtonsUI() {
      try {
        const aBtn = document.getElementById('loopAButton');
        const bBtn = document.getElementById('loopBButton');
        const loopBtn = document.getElementById('loopButton');
        if (!aBtn || !bBtn || !loopBtn) return;
        if (loopCurrent) { aBtn.style.display = ''; bBtn.style.display = ''; } else { aBtn.style.display = 'none'; bBtn.style.display = 'none'; }
        if (loopA !== null && !isNaN(loopA)) { aBtn.classList.add('active'); aBtn.innerText = 'A ' + formatTimeShort(loopA); aBtn.title = 'Clear A (' + formatTimeShort(loopA) + ')'; } else { aBtn.classList.remove('active'); aBtn.innerText = 'A'; aBtn.title = 'Set A (loop start)'; }
        if (loopB !== null && !isNaN(loopB)) { bBtn.classList.add('active'); bBtn.innerText = 'B ' + formatTimeShort(loopB); bBtn.title = 'Clear B (' + formatTimeShort(loopB) + ')'; } else { bBtn.classList.remove('active'); bBtn.innerText = 'B'; bBtn.title = 'Set B (loop end)'; }
      } catch(e){ console.warn('updateLoopButtonsUI', e); }
    }

    function formatTimeShort(s) {
      if (s === null || s === undefined || isNaN(s)) return '';
      s = Math.floor(Number(s) || 0);
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return m + ":" + String(sec).padStart(2, "0");
    }

    function toggleLoopA() {
      try { if (!audio) return; if (loopA === null) { loopA = Math.max(0, Math.floor(audio.currentTime)); if (loopB !== null && loopA > loopB) { var tmp = loopA; loopA = loopB; loopB = tmp; } } else { loopA = null; } updateLoopButtonsUI(); } catch(e){ console.warn(e); }
    }

    function toggleLoopB() {
      try { if (!audio) return; if (loopB === null) { loopB = Math.max(0, Math.floor(audio.currentTime)); if (loopA !== null && loopA > loopB) { var tmp = loopA; loopA = loopB; loopB = tmp; } } else { loopB = null; } updateLoopButtonsUI(); } catch(e){ console.warn(e); }
    }

    function clearLoopAndMarkers() {
      try { loopCurrent = false; audio.loop = false; loopA = null; loopB = null; try { var loopBtn = document.getElementById('loopButton'); if (loopBtn) { loopBtn.classList.remove('active'); loopBtn.innerText = 'Loop'; } } catch(e){} try { updateLoopButtonsUI(); } catch(e){} } catch(e){ console.warn('clearLoopAndMarkers failed', e); }
    }

    // ---- SEARCH SONGS ----
    function searchSongs() {
      const q = document.getElementById("songSearchInput").value.trim().toLowerCase();
      const results = [];
      if (!q) {
        alert("Please enter a search term.");
        return;
      }
      const seen = new Set();
      for (const rec of MUSIC_LIBRARY_ENTRIES) {
        const genre = rec.genre || '';
        const artist = getArtistFromFilename(rec.base);
        const title = getTitleFromFilename(rec.base);
        const normalized = `${rec.base} ${genre} ${artist} ${title}`.toLowerCase();
        if ((normalized.includes(q) || genre.toLowerCase().includes(q) || artist.toLowerCase().includes(q) || title.toLowerCase().includes(q)) && !seen.has(rec.base)) {
          seen.add(rec.base);
          results.push(rec.base);
        }
      }
      const container = document.getElementById("searchResultsContainer");
      const list = document.getElementById("searchResultsList");
      list.innerHTML = "";
      if (results.length === 0) {
        list.innerHTML = "<li>No songs found.</li>";
      } else {
        results.forEach((fileName) => {
          const title = normalizeSongBase(fileName);
          const li = document.createElement("li");
          li.style.display = "flex";
          li.style.alignItems = "center";
          li.style.justifyContent = "flex-start";
          const likeBtn = document.createElement("button");
          likeBtn.className = "button-style";
          likeBtn.style.marginRight = "8px";
          try {
            const likedNow = getStoredLikedSongs().map(x => normalizeSongBase(x)).includes(normalizeSongBase(fileName));
            likeBtn.innerText = likedNow ? "Liked" : "Like";
          } catch(e){ likeBtn.innerText = "Like"; }
          likeBtn.onclick = () => {
            toggleLikeForFile(fileName);
            const nowLiked = getStoredLikedSongs().map(x => normalizeSongBase(x)).includes(normalizeSongBase(fileName));
            likeBtn.innerText = nowLiked ? "Liked" : "Like";
            updateLikedSongs();
          };
          li.appendChild(likeBtn);
          const titleSpan = document.createElement("span");
          titleSpan.innerText = title;
          titleSpan.style.cursor = "pointer";
          titleSpan.onclick = () => {
            if (_keyboardTrigger && !document.fullscreenElement) {
              document.documentElement.requestFullscreen().catch(() => {});
              if (_referralPlayed) _referralPlayed = false;
            }
            const existing = currentPlaylist.indexOf(fileName);
            if (existing > -1) currentPlaylist.splice(existing, 1);
            currentPlaylist.unshift(fileName);
            currentSongIndex = 0;
            currentGenre = "Search Results";
            document.getElementById("player").style.display = "block";
            hideGenresAndArtists();   // <-- hide panels
            playSong();
            uploadPlaylistToServer(currentPlaylist);
          };
          li.appendChild(titleSpan);
          list.appendChild(li);
        });
      }
      container.style.display = "block";
      document.getElementById("genres").style.display = "none";
      document.getElementById("toggleGenresButton").textContent = "Genres";
      container.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function renderManageLikes() {

    function handlePlayReferral() {
      try {
        const params = new URLSearchParams(window.location.search);
        let genreParam = params.get('genre');
        if (genreParam) {
          genreParam = decodeURIComponent(genreParam.trim());
          const genreName = genreParam.trim();
          if (genreName) {
            const genreSongs = getSongsForGenre(genreName).filter(Boolean);
            if (genreSongs.length) {
              const shuffled = shuffle(genreSongs);
              currentPlaylist = shuffled;
              currentSongIndex = 0;
              currentGenre = genreName;
              document.getElementById("player").style.display = "block";
              hideGenresAndArtists();
              playSong();
              uploadPlaylistToServer(shuffled);
              // Focus the play button (barPlay)
              const playBtn = document.getElementById('barPlay');
              if (playBtn) setTimeout(() => playBtn.focus(), 200);
              // Set flag so first keyboard press requests fullscreen
              _referralPlayed = true;
              return;
            }
          }
        }
        let playParam = params.get('play');
        if (!playParam) return;
        playParam = decodeURIComponent(playParam.trim());

        let foundEntry = MUSIC_LIBRARY_ENTRIES.find(e => e.raw === playParam);
        if (!foundEntry) {
          const base = normalizeSongBase(playParam);
          foundEntry = MUSIC_LIBRARY_ENTRIES.find(e => e.base === base);
        }
        if (!foundEntry) {
          const artist = getArtistFromFilename(playParam);
          if (artist) {
            foundEntry = MUSIC_LIBRARY_ENTRIES.find(e => getArtistFromFilename(e.base) === artist);
          }
        }
        if (!foundEntry) { console.info('Referral not found:', playParam); return; }

        const found = foundEntry.base;
        const artist = getArtistFromFilename(found);
        const artistSongs = getSongsForArtist(artist).filter(s => s !== found);
        const others = shuffle(artistSongs);
        const playlist = [found].concat(others);

        currentPlaylist = playlist;
        currentSongIndex = 0;
        currentGenre = artist || 'Artist Referral';
        document.getElementById("player").style.display = "block";
        hideGenresAndArtists();
        playSong();
        uploadPlaylistToServer(playlist);
        // Focus the play button (barPlay)
        const playBtn = document.getElementById('barPlay');
        if (playBtn) setTimeout(() => playBtn.focus(), 200);
        // Set flag so first keyboard press requests fullscreen
        _referralPlayed = true;
      } catch (e) { console.warn('handlePlayReferral error', e); }
    }

    // Actually, we can just rely on the fact that the click handler for playlist tiles calls loadPlaylistFileFromServer and then sets currentPlaylist and calls playSong. We can add a check in playSong? But playSong is called after loading, and we don't want to fullscreen on every playSong (e.g., next/prev). So we need to differentiate. The playlist tile click is a user action; we can set a global flag before calling playSong, and then in playSong, if that flag is set, we request fullscreen. But playSong is called many times; we could use a flag like _pendingFullscreen and clear it after.

    // Simpler: we can override the click handler of the playlist tiles after they are created. We'll use a MutationObserver on the tiles row.

    // Let's do that.

    // We'll also need to handle the liked tile and the genre/artist tiles (they already call loadPlaylist/loadArtist which are wrapped).

    // So we just need to patch the playlist tile click handler.

    // We'll add a function that sets up the observer after the playlist dialog is rendered.

    // Since the playlist dialog is rendered on demand, we can call our patch function after renderPlaylistTiles.

    // We'll add a patch function.

    function patchPlaylistTileClicks() {
      const tilesRow = document.getElementById('playlistTilesRow');
      if (!tilesRow) return;
      // Get all tiles with class 'playlist-tile' that are not the liked tile (we already handle liked)
      const tiles = tilesRow.querySelectorAll('.playlist-tile');
      tiles.forEach(tile => {
        // Skip if already patched
        if (tile.dataset.patched) return;
        tile.dataset.patched = '1';
        // Store original click handler (we'll clone it)
        const origClick = tile.onclick;
        // Replace with our wrapper
        tile.onclick = function(e) {
          // If this click was triggered by keyboard (Enter/Space), request fullscreen
          if (_keyboardTrigger && !document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
            if (_referralPlayed) _referralPlayed = false;
          }
          // Call original handler
          if (origClick) {
            origClick.call(tile, e);
          }
        };
        // Also handle keydown to set _keyboardTrigger (already global)
      });
    }

    // We'll call this after each render of playlist tiles.
    // We can call it in renderPlaylistTiles after loading master.
    // We'll modify renderPlaylistTiles to call patchPlaylistTileClicks after tiles are added.
    // Since renderPlaylistTiles is defined in the IIFE, we can't easily override it.
    // Instead, we'll use a MutationObserver on the playlistGrid to detect when tiles are added.

    // We'll set up a MutationObserver on the playlistGrid.
    const playlistGridObs = new MutationObserver(function(mutations) {
      mutations.forEach(mutation => {
        if (mutation.type === 'childList') {
          // Check if tilesRow was added or changed
          const tilesRow = document.getElementById('playlistTilesRow');
          if (tilesRow) {
            patchPlaylistTileClicks();
          }
        }
      });
    });
    playlistGridObs.observe(playlistGrid, { childList: true, subtree: true });

    // Also we need to handle the liked tile in the playlist dialog (it calls playLikedSongs, which is wrapped).

    // For the genre tiles and artist tiles, they are created in loadGenres and renderArtistTile, and they call loadPlaylist/loadArtist which are wrapped.

    // For the search results (song search), we'll wrap the onclick in searchSongs.

    // We'll also need to handle the "Liked Songs" button on the main page (not the dialog) - it calls playLikedSongs which is wrapped.

    // Now we also need to handle the "Play Selected" button - it calls playSelectedShuffled which is wrapped.

    async function init() {

      window.toggleFullscreen = toggleFullscreen;
      window.toggleManageLikes = toggleManageLikes;

      window.searchSongs = searchSongs;
      window.clearSearch = clearSearch;
      window.toggleLoop = toggleLoop;
      window.loadArtist = loadArtist;
      window.loadPlaylist = loadPlaylist;
      window.uploadPlaylistToServer = uploadPlaylistToServer;
      window.playSong = playSong;
      window.playNext = playNext;
      window.playPrevious = playPrevious;
      window.getActiveProfileName = getActiveProfileName;
      window.normalizeSongBase = normalizeSongBase;
      window.flattenStoredList = flattenStoredList;
      window.normalizeLoadedPlaylist = normalizeLoadedPlaylist;

      window.setStoredLikedSongs = setStoredLikedSongs;

      const artistInput = document.getElementById('artistSearchInput');
      const artistClear = document.getElementById('clearArtistSearchBtn');
      const artistResults = document.getElementById('artistSearchResults');
      if (artistInput) {
        artistInput.addEventListener('input', function() {
          const q = this.value.trim();
          if (q.length >= 2) {
            doArtistSearch(q);
          } else if (q.length === 0) {
            artistResults.style.display = 'none';

          if (genres) genres.style.display = 'flex';

      }

      // Patch playlist tiles after initial render (the dialog might be opened later)
      // Also we'll call patch after showPlaylistDialog is called.
      // We'll wrap showPlaylistDialog to call patch after rendering.
      const origShow = window.showPlaylistDialog;
      window.showPlaylistDialog = async function() {
        await origShow();
        setTimeout(patchPlaylistTileClicks, 100);
      };
    }

    // Override searchSongs to include fullscreen request on keyboard.
    // We'll redefine searchSongs with the full wrapper.
    searchSongs = function() {
      const q = document.getElementById("songSearchInput").value.trim().toLowerCase();
      const results = [];
      if (!q) {
        alert("Please enter a search term.");
        return;
      }
      const seen = new Set();
      for (const rec of MUSIC_LIBRARY_ENTRIES) {
        const genre = rec.genre || '';
        const artist = getArtistFromFilename(rec.base);
        const title = getTitleFromFilename(rec.base);
        const normalized = `${rec.base} ${genre} ${artist} ${title}`.toLowerCase();
        if ((normalized.includes(q) || genre.toLowerCase().includes(q) || artist.toLowerCase().includes(q) || title.toLowerCase().includes(q)) && !seen.has(rec.base)) {
          seen.add(rec.base);
          results.push(rec.base);
        }
      }
      const container = document.getElementById("searchResultsContainer");
      const list = document.getElementById("searchResultsList");
      list.innerHTML = "";
      if (results.length === 0) {
        list.innerHTML = "<li>No songs found.</li>";
      } else {
        results.forEach((fileName) => {
          const title = normalizeSongBase(fileName);
          const li = document.createElement("li");
          li.style.display = "flex";
          li.style.alignItems = "center";
          li.style.justifyContent = "flex-start";
          const likeBtn = document.createElement("button");
          likeBtn.className = "button-style";
          likeBtn.style.marginRight = "8px";
          try {
            const likedNow = getStoredLikedSongs().map(x => normalizeSongBase(x)).includes(normalizeSongBase(fileName));
            likeBtn.innerText = likedNow ? "Liked" : "Like";
          } catch(e){ likeBtn.innerText = "Like"; }
          likeBtn.onclick = () => {
            toggleLikeForFile(fileName);
            const nowLiked = getStoredLikedSongs().map(x => normalizeSongBase(x)).includes(normalizeSongBase(fileName));
            likeBtn.innerText = nowLiked ? "Liked" : "Like";
            updateLikedSongs();
          };
          li.appendChild(likeBtn);
          const titleSpan = document.createElement("span");
          titleSpan.innerText = title;
          titleSpan.style.cursor = "pointer";
          titleSpan.onclick = () => {
            // Request fullscreen if keyboard triggered
            if (_keyboardTrigger && !document.fullscreenElement) {
              document.documentElement.requestFullscreen().catch(() => {});
              if (_referralPlayed) _referralPlayed = false;
            }
            const existing = currentPlaylist.indexOf(fileName);
            if (existing > -1) currentPlaylist.splice(existing, 1);
            currentPlaylist.unshift(fileName);
            currentSongIndex = 0;
            currentGenre = "Search Results";
            document.getElementById("player").style.display = "block";
            hideGenresAndArtists();   // <-- hide panels
            playSong();
            uploadPlaylistToServer(currentPlaylist);
          };
          li.appendChild(titleSpan);
          list.appendChild(li);
        });
      }
      container.style.display = "block";
      document.getElementById("genres").style.display = "none";
      document.getElementById("toggleGenresButton").textContent = "Genres";
      container.scrollIntoView({ behavior: "smooth", block: "start" });
    };

    init();
  </script>

  <!-- Injected platform‑aware upload helpers (unchanged) -->
  <script>
    async function getCachedPlatform() {
      if (window.__cachedPlatform) return window.__cachedPlatform;
      try {
        const r = await fetch('./platform.txt', { cache: 'no-store' });
        if (r && r.ok) { window.__cachedPlatform = (await r.text()).trim().toLowerCase(); return window.__cachedPlatform; }
      } catch (e) { console.warn('Could not fetch platform.txt', e); }
      window.__cachedPlatform = (localStorage.getItem('SERVER_UPLOAD_STYLE') || 'windows').toLowerCase();
      return window.__cachedPlatform;
    }
    document.addEventListener('DOMContentLoaded', async () => {
      window.detectedPlatform = await getCachedPlatform().catch(()=> 'windows');
      try { localStorage.setItem('SERVER_UPLOAD_STYLE', window.detectedPlatform); } catch(e){}
    });
    function platformNow() { return (window.detectedPlatform || window.__cachedPlatform || localStorage.getItem('SERVER_UPLOAD_STYLE') || 'windows').toLowerCase(); }
    function isWindowsUpload() { return platformNow().includes('windows'); }
    function isAndroidUpload() { return platformNow().includes('android'); }
    function isIphoneUpload() { const p = platformNow(); return p.includes('iphone') || p === 'iphones'; }

    async function pocketUpload(name, targetDir, payloadText) {
      try {
        const blob = new Blob([payloadText || window.__pocketPayload || ''], { type: 'application/json' });
        const form = new FormData(); form.append('files[]', blob, name); form.append('targetDir', targetDir);
        const r = await fetch('/pocketserver-api/upload', { method: 'POST', body: form, credentials: 'include' });
        const txt = await r.text().catch(()=> '');
        console.log('[pocketUpload] ', name, '->', r.status, txt);
        return r.ok;
      } catch (e) { console.warn('[pocketUpload] failed', name, e); return false; }
    }
    async function listProfiles(targetDir) {
      try {
        const q = encodeURIComponent(targetDir);
        const r = await fetch(`/pocketserver-api/list?q=${q}`, { credentials: 'include' });
        if (!r.ok) { console.warn('[pocket] list failed', r.status); return null; }
        const text = await r.text();
        try { return JSON.parse(text); } catch { return text; }
      } catch (e) { console.error('[pocket] listProfiles error', e); return null; }
    }
    async function deletePath(fullPath) {
      try {
        const body = { command: "delete", paths: [ fullPath ], name: "", targetDir: "" };
        const r = await fetch('/pocketserver-api/command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          credentials: 'include'
        });
        const txt = await r.text().catch(()=> '');
        console.log('[pocket] deletePath', fullPath, '->', r.status, txt);
        return r.ok;
      } catch (e) { console.error('[pocket] deletePath error', fullPath, e); return false; }
    }
    async function pocketReplace(baseName, targetDir, payloadText) {
      const tempName = baseName + '.__new__';
      const tempOk = await pocketUpload(tempName, targetDir, payloadText);
      if (!tempOk) { console.warn('[pocketReplace] temp upload failed', tempName); return false; }
      const midList = await listProfiles(targetDir);
      const midText = midList ? (typeof midList === 'string' ? midList : JSON.stringify(midList)) : '';
      if (!midText.includes(tempName)) { console.warn('[pocketReplace] temp not visible', tempName); return false; }
      const desiredFullPath = targetDir + baseName;
      const delOk = await deletePath(desiredFullPath);
      if (!delOk) { console.warn('[pocketReplace] could not delete existing', desiredFullPath); return false; }
      const finalOk = await pocketUpload(baseName, targetDir, payloadText);
      if (!finalOk) { console.warn('[pocketReplace] final upload failed', baseName); return false; }
      await deletePath(targetDir + tempName).catch(()=>{});
      return finalOk;
    }
    async function putTxtCopy(encodedNameWithoutExt, txtPayload) {
      try {
        const url = `/Profiles/${encodedNameWithoutExt}.txt`;
        const r = await fetch(url, { method: 'PUT', headers: { 'Content-Type': 'text/plain' }, body: txtPayload });
        console.log('[putTxtCopy] PUT .txt ->', url, r.status);
        return r.ok;
      } catch (e) { console.warn('[putTxtCopy] failed', encodedNameWithoutExt, e); return false; }
    }
  </script>

  <!-- SysNotify (unchanged) -->
  <script>
    (function(){
      const toastEl = document.getElementById('sys-toast');
      const modalOverlay = document.getElementById('sys-modal-overlay');
      const modalTitle = document.getElementById('sys-modal-title');
      const modalMessage = document.getElementById('sys-modal-message');
      const modalYes = document.getElementById('sys-modal-yes');
      const modalNo = document.getElementById('sys-modal-no');
      let toastTimer = null;

      function showToast(msg, ms=3000) {
        if (!toastEl) return;
        toastEl.textContent = String(msg || '');
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toastEl.classList.remove('show'); }, ms);
      }
      function showAlert(msg) { showToast(msg, 3000); }
      function showConfirm({ title = 'Confirm', message = 'Are you sure?' } = {}) {
        return new Promise((resolve) => {
          if (!modalOverlay) return resolve(false);
          modalTitle.textContent = title;
          modalMessage.textContent = message;
          modalOverlay.classList.add('show');
          modalOverlay.setAttribute('aria-hidden', 'false');

          function cleanup() {
            modalOverlay.classList.remove('show');
            modalOverlay.setAttribute('aria-hidden', 'true');
            modalYes.removeEventListener('click', onYes);
            modalNo.removeEventListener('click', onNo);
            document.removeEventListener('keydown', onKey);
          }
          function onYes() { cleanup(); resolve(true); }
          function onNo() { cleanup(); resolve(false); }
          function onKey(e) {
            if (e.key === 'Escape') { onNo(); }
            if (e.key === 'Enter') { onYes(); }
          }

          modalYes.addEventListener('click', onYes);
          modalNo.addEventListener('click', onNo);
          document.addEventListener('keydown', onKey);
          setTimeout(()=> modalYes.focus(), 50);
        });
      }

      window.SysNotify = {
        toast: showToast,
        alert: showAlert,
        confirm: (msg, title) => showConfirm({ title: title || 'Confirm', message: msg || '' })
      };
      try { window.alert = (m) => { window.SysNotify && window.SysNotify.alert(m); }; } catch(e){}
    })();
  </script>

          whiteSpace: 'nowrap', fontWeight: '800', color: '#ffffff', fontSize: '14px', lineHeight: MARQUEE_HEIGHT + 'px',
          paddingLeft: '12px', paddingRight: '12px', transform: 'translateX(0px)', willChange: 'transform',
          display: 'inline-block', textRendering: 'optimizeLegibility', pointerEvents: 'auto',
        });
        marquee.appendChild(marqueeText);
        playerBar.appendChild(marquee);
        return marquee;
      }

      function destroyMarquee() { stopMarqueeAnimation(); if (marquee && marquee.parentNode) marquee.parentNode.removeChild(marquee); marquee = null; marqueeText = null; }

      function stopMarqueeAnimation() {
        try {
          if (marqueeAnimation && marqueeAnimation.cancel) marqueeAnimation.cancel();
          marqueeAnimation = null;
          if (marqueeText) { marqueeText.style.transform = 'translateX(0px)'; marqueeText.style.animation = ''; }
        } catch(e){}
      }

      function startMarqueeIfNeeded() {
        if (!marquee || !marqueeText) return;
        try {
          const playerRect = playerBar.getBoundingClientRect();
          const containerWidth = playerRect.width;
          marquee.style.display = 'flex';
          marquee.style.left = '0px';
          marquee.style.right = '0px';
          const textWidth = marqueeText.getBoundingClientRect().width;
          stopMarqueeAnimation();
          if (textWidth > containerWidth) {
            const distance = textWidth - containerWidth + 24;
            const speed = 30;
            const duration = Math.max(2000, Math.round((distance / speed) * 1000));
            marqueeAnimation = marqueeText.animate(
              [ { transform: 'translateX(0px)' }, { transform: `translateX(${-distance}px)` } ],
              { duration: duration, iterations: Infinity, direction: 'alternate', easing: 'linear' }
            );
          } else {
            marqueeText.style.transform = 'translateX(0px)';
            marquee.style.justifyContent = 'center';
          }
        } catch (e) { console.warn('marquee start error', e); }
      }

      function refreshMarqueeLayout() {
        if (overlay) { overlay.style.bottom = (playerBar.classList.contains('minified') ? `${MARQUEE_HEIGHT + MARQUEE_GAP}px` : '0px'); }
        if (!playerBar.classList.contains('minified')) { if (marquee) marquee.style.display = 'none'; stopMarqueeAnimation(); return; }
        createMarqueeIfMissing();
        setTimeout(() => { startMarqueeIfNeeded(); }, 50);
      }

      function filenameNoExt(path) {
        try {
          if (!path) return '';
          let name = String(path).trim();
          try { name = decodeURIComponent(name); } catch(e){}
          name = name.split('?')[0].split('#')[0];
          const urlParams = new URLSearchParams(path.split('?')[1]);
          const titleFromParams = urlParams.get('title') || urlParams.get('name') || urlParams.get('track');
          if (titleFromParams) { return titleFromParams.replace(/[_\.]+/g, ' ').replace(/\s{2,}/g, ' ').trim(); }
          const parts = name.split('/');
          name = parts.pop() || parts.pop() || '';
          name = name.replace(/\.(mp3|flac|wav|m4a|ogg|aac|opus|wma|alac)(\?.*)?$/i, '');
          name = name.replace(/[_\.]+/g, ' ');
          name = name.replace(/\+/g, ' ');
          name = name.replace(/\s{2,}/g, ' ').trim();
          return name || 'Unknown Track';
        } catch(e){ return 'Unknown Track'; }
      }

      function detectCurrentFilePath() {
        try {
          const audioEl = document.querySelector('audio') || document.getElementById('audio');
          if (audioEl) {
            if (audioEl.currentSrc) return audioEl.currentSrc;
            if (audioEl.src) return audioEl.src;
            if (audioEl.dataset && audioEl.dataset.src) return audioEl.dataset.src;
          }
          if (Array.isArray(window.currentPlaylist) && typeof window.currentSongIndex !== 'undefined' && window.currentSongIndex !== null) {
            const idx = Number(window.currentSongIndex);
            if (Number.isFinite(idx) && window.currentPlaylist[idx]) return window.currentPlaylist[idx];
            if (window.currentPlaylist.length > 0) return window.currentPlaylist[0];
          }
          if (playerBar && playerBar.dataset && playerBar.dataset.currentTrack) return playerBar.dataset.currentTrack;
          const attr = playerBar.getAttribute && playerBar.getAttribute('data-current-track');
          if (attr) return attr;
          const alt = ['currentTrack','currentSong','nowPlaying','now_playing','playingTrack','now_playing_url'];
          for (const n of alt) {
            if (window[n]) {
              if (typeof window[n] === 'string') return window[n];
              if (typeof window[n] === 'object') {
                const o = window[n];
                return o.src || o.url || o.path || o.file || o.filename || o.name || null;
              }
            }
          }
          return null;
        } catch (e) { console.warn('detectCurrentFilePath error', e); return null; }
      }

      function updateMarqueeTextIfChanged() {
        try {
          if (!playerBar.classList.contains('minified')) return;
          createMarqueeIfMissing();
          const raw = detectCurrentFilePath() || '';
          const fallbackTitleEl = document.getElementById('songTitle');
          const base = filenameNoExt(raw) || (fallbackTitleEl ? fallbackTitleEl.textContent.trim() : '');
          if (!base) {
            if (marqueeText) marqueeText.textContent = '';
            if (marquee) marquee.style.display = 'none';
            stopMarqueeAnimation();
            currentMarqueeValue = '';
            return;
          }
          if (base === currentMarqueeValue) {
            if (marqueeText && marqueeText.textContent && marqueeText.textContent.trim()) { return; }
          }
          currentMarqueeValue = base;
          if (marqueeText) { marqueeText.textContent = base + '   '; }
          setTimeout(refreshMarqueeLayout, 55);
        } catch(e){ console.warn('updateMarqueeText error', e); }
      }

      function lockSizeAndFixPosition() {
        const rect = playerBar.getBoundingClientRect();
        const extendedHeight = Math.round(rect.height + MARQUEE_HEIGHT + MARQUEE_GAP);
        playerBar.style.width = Math.round(rect.width) + 'px';
        playerBar.style.height = extendedHeight + 'px';
        playerBar.style.position = 'fixed';
        playerBar.style.top = Math.round(rect.top) + 'px';
        playerBar.style.left = Math.round(rect.left) + 'px';
        playerBar.style.right = 'auto';
        playerBar.style.bottom = 'auto';
        playerBar.style.transform = 'none';
        createMarqueeIfMissing();
        createOverlayInside();
      }

      function clearLockedPosition() {
        playerBar.style.width = ''; playerBar.style.height = ''; playerBar.style.position = ''; playerBar.style.left = ''; playerBar.style.top = '';
        playerBar.style.right = ''; playerBar.style.bottom = ''; playerBar.style.transform = '';
        artImg.style.touchAction = ''; artImg.style.cursor = '';
        if (overlay) removeOverlay();
        destroyMarquee();
      }

      function enterMinified() {
        playerBar.classList.add('minified');
        artImg.setAttribute('aria-pressed','true');
        currentMarqueeValue = '';
        lockSizeAndFixPosition();
        applySavedTop();
        artImg.style.touchAction = 'none';
        artImg.style.cursor = 'grab';
        if (overlay) { overlay.style.touchAction = 'none'; overlay.style.cursor = 'grab'; attachOverlayListeners(); }
        updateMarqueeTextIfChanged();
        if (marqueePollInterval) clearInterval(marqueePollInterval);
        marqueePollInterval = setInterval(updateMarqueeTextIfChanged, 800);
        if (overlay) overlay.style.bottom = `${MARQUEE_HEIGHT + MARQUEE_GAP}px`;
      }

      function exitMinified() {
        playerBar.classList.remove('minified');
        artImg.setAttribute('aria-pressed','false');
        currentMarqueeValue = '';
        clearLockedPosition();
        if (marqueePollInterval) { clearInterval(marqueePollInterval); marqueePollInterval = null; }
        stopMarqueeAnimation();
      }

      function toggleMinified() {
        if (playerBar.classList.contains('minified')) exitMinified();
        else enterMinified();
      }

      let suppressClick = false;
      artImg.addEventListener('click', function(e){
        if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; return; }
        e.stopPropagation();
        toggleMinified();
      });

      artImg.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); artImg.click(); }
      });

      function attachOverlayListeners() {
        if (!overlay) return;
        overlay.removeEventListener('pointerdown', overlayPointerDown);
        overlay.addEventListener('pointerdown', overlayPointerDown, { passive: false });
      }

      function overlayPointerDown(e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (!playerBar.classList.contains('minified')) return;
        e.preventDefault();

        try { overlay.setPointerCapture && overlay.setPointerCapture(e.pointerId); } catch(err){}

        let startY = e.clientY;
        const rect = playerBar.getBoundingClientRect();
        const origTop = rect.top;
        const height = rect.height;
        let moved = false;

        overlay.style.cursor = 'grabbing';

        function onMove(ev) {
          ev.preventDefault();
          const dy = ev.clientY - startY;
          if (!moved && Math.abs(dy) >= MOVE_THRESHOLD) moved = true;
          let newTop = origTop + dy;
          newTop = Math.max(MARGIN, Math.min(newTop, window.innerHeight - height - MARGIN));
          playerBar.style.top = Math.round(newTop) + 'px';
        }

        function onUp(ev) {
          try { overlay.releasePointerCapture && overlay.releasePointerCapture(ev.pointerId); } catch(err){}
          overlay.style.cursor = 'grab';
          overlay.removeEventListener('pointermove', onMove);
          overlay.removeEventListener('pointerup', onUp);

          if (moved) {
            saveTop();
            suppressClick = true;
            setTimeout(() => { suppressClick = false; }, 250);
          } else {
            overlay.style.display = 'none';
            const underlying = document.elementFromPoint(ev.clientX, ev.clientY);
            overlay.style.display = '';
            if (underlying) {
              const clickEv = new MouseEvent('click', {
                view: window, bubbles: true, cancelable: true,
                clientX: ev.clientX, clientY: ev.clientY
              });
              underlying.dispatchEvent(clickEv);
            }
          }
        }

        overlay.addEventListener('pointermove', onMove, { passive: false });
        overlay.addEventListener('pointerup', onUp, { passive: false });
      }

      window.addEventListener('resize', function(){
        if (!playerBar.classList.contains('minified')) return;
        try {
          const rect = playerBar.getBoundingClientRect();
          const height = rect.height;
          let top = rect.top;
          let changed = false;
          if (top > window.innerHeight - height - MARGIN) { top = Math.max(MARGIN, window.innerHeight - height - MARGIN); changed = true; }
          if (changed) { playerBar.style.top = Math.round(top) + 'px'; saveTop(); }
          refreshMarqueeLayout();
          if (overlay) { overlay.style.bottom = `${MARQUEE_HEIGHT + MARQUEE_GAP}px`; }
        } catch(e){}
      });

      if (playerBar.classList.contains('minified')) {
        lockSizeAndFixPosition();
        applySavedTop();
        artImg.style.touchAction = 'none';
        artImg.style.cursor = 'grab';
        if (overlay) { overlay.style.touchAction = 'none'; overlay.style.cursor = 'grab'; attachOverlayListeners(); }
        updateMarqueeTextIfChanged();
        marqueePollInterval = setInterval(updateMarqueeTextIfChanged, 800);
      }

      (function attachDetectors(){
        try {
          const audioEl = document.querySelector('audio') || document.getElementById('audio');
          if (audioEl) {
            const obs = new MutationObserver(function(m){ updateMarqueeTextIfChanged(); });
            obs.observe(audioEl, { attributes: true, attributeFilter: ['src'] });
          }
        } catch(e){}
        setInterval(updateMarqueeTextIfChanged, 1400);
      })();
    })();
  </script>
</body>
